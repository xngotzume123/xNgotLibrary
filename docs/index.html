ả boolean. <code>MusicSelect(index, play)<\/code> chọn theo index; không gọi khi danh sách rỗng. <code>MusicPlayTrack(id, url, source)<\/code> thêm/chọn bài ngoài và trả boolean, không chứng minh phát thành công. <code>MusicDownloadOne<\/code> có thể chờ, trả asset string hoặc <code>false<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Điều khiển<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>PlayMusic()<\/code><\/td>\n  <td>Đảo phát/tạm dừng, không phải luôn luôn phát.<\/td>\n<\/tr>\n<tr>\n  <td><code>NextMusic(1)<\/code> / <code>NextMusic(-1)<\/code><\/td>\n  <td>Bài tiếp / trước.<\/td>\n<\/tr>\n<tr>\n  <td><code>MusicVolume(n)<\/code><\/td>\n  <td>Âm lượng 0–100.<\/td>\n<\/tr>\n<tr>\n  <td><code>MusicSpeed(n)<\/code><\/td>\n  <td>Tốc độ thực tế 0.7–1.4; player có giới hạn riêng.<\/td>\n<\/tr>\n<tr>\n  <td><code>MusicMode(name, boolean)<\/code><\/td>\n  <td><code>Auto<\/code>, <code>Shuffle<\/code>, <code>RepeatOne<\/code>, <code>ShowIsland<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>OnMusicChanged(fn)<\/code><\/td>\n  <td>Đăng ký theo dõi; hàm trả về dùng để hủy theo dõi.<\/td>\n<\/tr>\n<tr>\n  <td><code>MusicQueue(prompt)<\/code>, <code>MusicPreset(name)<\/code>, <code>MusicConfig()<\/code><\/td>\n  <td>Helper do tích hợp Settings/Island gắn vào khi có.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>File đã tải<\/h2>\n<p><code>MusicFiles(includeSizes)<\/code> trả <code>files, stats<\/code>; <code>MusicStorage()<\/code> trả stats. <code>MusicLoadDownloaded()<\/code> thay catalog hiện tại bằng file local và trả số lượng. <code>MusicPlayFile(path)<\/code> cho biết có chọn được bài hay không. <code>MusicDeleteFile(path)<\/code> và <code>MusicClearDownloaded()<\/code> xóa file local; hàm sau trả số thành công và thất bại. Hãy xác nhận trước khi xóa.<\/p>\n<pre><code class=\"language-lua\">if island then\n    local files, stats = island:MusicFiles(true)\n    print(&quot;Số file:&quot;, #files, &quot;dung lượng:&quot;, stats.TotalText)\n    if files[1] then island:MusicPlayFile(files[1].Path) end\nend\n<\/code><\/pre>\n<h2>Cấu hình<\/h2>\n<p>Đặt trước khi load bằng <code>getgenv().xNgotMusic = {...}<\/code> hoặc lúc chạy qua <code>_G.xNgotMusicConfig:Set(key, value)<\/code>. API có <code>Get(key)<\/code>, <code>Get()<\/code>, <code>Schema()<\/code>, <code>Apply()<\/code>, <code>OnChange(fn)<\/code>, <code>Preset(name)<\/code>, <code>Presets()<\/code>; <code>OnChange<\/code> trả hàm hủy theo dõi. Preset: <code>fast<\/code>, <code>quality<\/code>, <code>lowdata<\/code>, <code>vietnamese<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Key<\/th>\n  <th>Mặc định<\/th>\n  <th>Phạm vi / ghi chú<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>topN<\/code><\/td>\n  <td>12<\/td>\n  <td>1–40 kết quả<\/td>\n<\/tr>\n<tr>\n  <td><code>sources<\/code><\/td>\n  <td>youtube, soundcloud, audius<\/td>\n  <td>Bảng ID nguồn; UI cho chọn All hoặc một trong ba. Nguồn khác phụ thuộc dịch vụ.<\/td>\n<\/tr>\n<tr>\n  <td><code>region<\/code><\/td>\n  <td><code>auto<\/code><\/td>\n  <td><code>auto<\/code>, <code>global<\/code>, <code>VN<\/code>, <code>US<\/code>, <code>KR<\/code>, <code>JP<\/code>; ưu tiên qua từ khóa, không xác minh ngôn ngữ.<\/td>\n<\/tr>\n<tr>\n  <td><code>prefetchNext<\/code><\/td>\n  <td>true<\/td>\n  <td>Chuẩn bị bài tiếp trong danh sách tại 50% khi bật Auto, tắt RepeatOne và có hơn một bài.<\/td>\n<\/tr>\n<tr>\n  <td><code>searchTimeout<\/code><\/td>\n  <td>12<\/td>\n  <td>2–60 giây<\/td>\n<\/tr>\n<tr>\n  <td><code>preferShort<\/code><\/td>\n  <td>600<\/td>\n  <td>0–7200 giây; 0 tắt ưu tiên<\/td>\n<\/tr>\n<tr>\n  <td><code>folder<\/code><\/td>\n  <td><code>xNgotLibrary/Music<\/code><\/td>\n  <td>Thư mục cache local<\/td>\n<\/tr>\n<tr>\n  <td><code>raceTracks<\/code><\/td>\n  <td>2<\/td>\n  <td>1–4 bài thử song song trong resolve<\/td>\n<\/tr>\n<tr>\n  <td><code>downloadTimeout<\/code><\/td>\n  <td>200<\/td>\n  <td>20–600 giây<\/td>\n<\/tr>\n<tr>\n  <td><code>retries<\/code><\/td>\n  <td>2<\/td>\n  <td>0–5<\/td>\n<\/tr>\n<tr>\n  <td><code>renameFiles<\/code>, <code>aiLearn<\/code>, <code>coverArt<\/code><\/td>\n  <td>true<\/td>\n  <td>Boolean<\/td>\n<\/tr>\n<tr>\n  <td><code>compactRows<\/code>, <code>debug<\/code><\/td>\n  <td>false<\/td>\n  <td>Boolean<\/td>\n<\/tr>\n<tr>\n  <td><code>showSource<\/code>, <code>notifyOnSearch<\/code><\/td>\n  <td>true<\/td>\n  <td>Boolean<\/td>\n<\/tr>\n<tr>\n  <td><code>aiBrain<\/code><\/td>\n  <td><code>local<\/code><\/td>\n  <td>Bản này không bật mô hình online.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Auto ưu tiên quốc gia Roblox nếu có, dự phòng locale; vùng chưa hỗ trợ/không rõ chuyển về global. Preload dùng mạng và bộ nhớ, không đảm bảo chuyển bài không trễ. Nếu preload lỗi sẽ tải theo luồng bình thường. Một số key có trong schema nhưng hiệu lực thực tế tùy source hiện tại; hãy kiểm tra trong môi trường của bạn.<\/p>\n<p>Để chẩn đoán, gọi <code>_G.xNgotMusicDoctor()<\/code> khi có và xem từng check. Cảnh báo không tự chứng minh một nguyên nhân cụ thể. Test riêng tìm kiếm, tải, API file, <code>getcustomasset<\/code>/<code>getsynasset<\/code> và phát âm thanh.<\/p>\n"},"plain":{"en":" Music API and settings\n\nSearch and download depend on third-party services, network access and executor support. Audio playback may also be restricted by Roblox. No actual provider or Delta runtime is guaranteed by a Luau compiler check.\n\n Search and play\n\nlua\nlocal island = Window:GetDynamicIsland()\nif island then\n    local disconnect = island:OnMusicCatalogChanged(function()\n        local rows, state = island:MusicRows()\n        print(\"Catalog state:\", state, \"rows:\", rows)\n    end)\n    island:MusicSearch(\"nhac viet chill\")\n    -- The search is asynchronous; call disconnect() when no longer needed.\nend\n\n\nMusicSearch returning true does not guarantee the search started (for example, it may already be busy) or that results are ready. Check MusicSearchState() or subscribe to catalog changes. Once results exist, MusicRows() returns rows, state; MusicCatalog() returns catalog, state, supported. MusicSelectValue(value, play) selects a result by row Value/name and returns a boolean. MusicSelect(index, play) uses the track index; avoid calling it for an empty list. MusicPlayTrack(id, url, source) queues/selects an external track and returns a boolean, not playback confirmation. MusicDownloadOne may yield and returns an asset string or false.\n\n| Control | Meaning |\n| --- | --- |\n| PlayMusic() | Toggles play/pause, not an unconditional play. |\n| NextMusic(1) / NextMusic(-1) | Next / previous. |\n| MusicVolume(n) | Volume 0–100. |\n| MusicSpeed(n) | Effective music tempo 0.7–1.4; the player applies its own clamp. |\n| MusicMode(name, boolean) | Auto, Shuffle, RepeatOne, ShowIsland. |\n| OnMusicChanged(fn) | Subscribe; returned function unsubscribes. |\n| MusicQueue(prompt), MusicPreset(name), MusicConfig() | Helpers attached by Settings/Island integration when available. |\n\n Downloaded files\n\nMusicFiles(includeSizes) returns files, stats; MusicStorage() returns stats. MusicLoadDownloaded() reloads the current catalog from local cache and returns a count. MusicPlayFile(path) returns whether a matching item was selected. MusicDeleteFile(path) and MusicClearDownloaded() delete local files; the latter returns deleted and failed counts. Ask before destructive actions.\n\nlua\nif island then\n    local files, stats = island:MusicFiles(true)\n    print(\"Files:\", files, \"storage:\", stats.TotalText)\n    if files[1] then island:MusicPlayFile(files[1].Path) end\nend\n\n\n Configuration\n\nSet before loading using getgenv().xNgotMusic = {...} or at runtime through _G.xNgotMusicConfig:Set(key, value). Get(key), Get(), Schema(), Apply(), OnChange(fn), Preset(name), Presets() are available. OnChange returns an unsubscribe function. Supported presets: fast, quality, lowdata, vietnamese.\n\n| Key | Default | Range / note |\n| --- | --- | --- |\n| topN | 12 | 1–40 results |\n| sources | youtube, soundcloud, audius | Table of source IDs; UI exposes All or one of these. Other engine sources depend on service support. |\n| region | auto | auto, global, VN, US, KR, JP; preference via query terms, not verified language. |\n| prefetchNext | true | At 50%, prepare next item from current list when Auto is on and RepeatOne off; needs >1 track. |\n| searchTimeout | 12 | 2–60 seconds |\n| preferShort | 600 | 0–7200 seconds; 0 disables preference |\n| folder | xNgotLibrary/Music | Local cache directory |\n| raceTracks | 2 | 1–4, parallel track attempts in resolve |\n| downloadTimeout | 200 | 20–600 seconds |\n| retries | 2 | 0–5 |\n| renameFiles, aiLearn, coverArt | true | Boolean |\n| compactRows, debug | false | Boolean |\n| showSource, notifyOnSearch | true | Boolean |\n| aiBrain | local | Online model is not enabled in this build. |\n\nRegion Auto uses Roblox country if available and locale as fallback; unsupported/unknown regions become global. Preload uses network and storage and cannot guarantee a gapless transition. Prefetch failure falls back to regular loading. Some settings are exposed in the schema even where their effect is limited by the current code; inspect behavior in your target environment.\n\nFor diagnostics call _G.xNgotMusicDoctor() when available, then inspect the returned checks. A warning is not proof of a particular fault. Test search, download, file support, getcustomasset/getsynasset and playback separately.\n","vi":" API và cấu hình nhạc\n\nTìm/tải nhạc phụ thuộc dịch vụ bên thứ ba, kết nối và executor. Roblox cũng có thể hạn chế phát âm thanh. Luau compiler pass không đảm bảo provider hay Delta chạy được.\n\n Tìm và phát\n\nlua\nlocal island = Window:GetDynamicIsland()\nif island then\n    local disconnect = island:OnMusicCatalogChanged(function()\n        local rows, state = island:MusicRows()\n        print(\"Trạng thái:\", state, \"số bài:\", rows)\n    end)\n    island:MusicSearch(\"nhac viet chill\")\n    -- Tìm bất đồng bộ; gọi disconnect() khi không cần theo dõi nữa.\nend\n\n\nMusicSearch trả true không đảm bảo việc tìm đã bắt đầu (ví dụ đang bận) hoặc đã có kết quả. Dùng MusicSearchState() hoặc theo dõi thay đổi catalog. Khi có kết quả, MusicRows() trả rows, state; MusicCatalog() trả catalog, state, supported. MusicSelectValue(value, play) chọn theo Value/tên và trả boolean. MusicSelect(index, play) chọn theo index; không gọi khi danh sách rỗng. MusicPlayTrack(id, url, source) thêm/chọn bài ngoài và trả boolean, không chứng minh phát thành công. MusicDownloadOne có thể chờ, trả asset string hoặc false.\n\n| Điều khiển | Ý nghĩa |\n| --- | --- |\n| PlayMusic() | Đảo phát/tạm dừng, không phải luôn luôn phát. |\n| NextMusic(1) / NextMusic(-1) | Bài tiếp / trước. |\n| MusicVolume(n) | Âm lượng 0–100. |\n| MusicSpeed(n) | Tốc độ thực tế 0.7–1.4; player có giới hạn riêng. |\n| MusicMode(name, boolean) | Auto, Shuffle, RepeatOne, ShowIsland. |\n| OnMusicChanged(fn) | Đăng ký theo dõi; hàm trả về dùng để hủy theo dõi. |\n| MusicQueue(prompt), MusicPreset(name), MusicConfig() | Helper do tích hợp Settings/Island gắn vào khi có. |\n\n File đã tải\n\nMusicFiles(includeSizes) trả files, stats; MusicStorage() trả stats. MusicLoadDownloaded() thay catalog hiện tại bằng file local và trả số lượng. MusicPlayFile(path) cho biết có chọn được bài hay không. MusicDeleteFile(path) và MusicClearDownloaded() xóa file local; hàm sau trả số thành công và thất bại. Hãy xác nhận trước khi xóa.\n\nlua\nif island then\n    local files, stats = island:MusicFiles(true)\n    print(\"Số file:\", files, \"dung lượng:\", stats.TotalText)\n    if files[1] then island:MusicPlayFile(files[1].Path) end\nend\n\n\n Cấu hình\n\nĐặt trước khi load bằng getgenv().xNgotMusic = {...} hoặc lúc chạy qua _G.xNgotMusicConfig:Set(key, value). API có Get(key), Get(), Schema(), Apply(), OnChange(fn), Preset(name), Presets(); OnChange trả hàm hủy theo dõi. Preset: fast, quality, lowdata, vietnamese.\n\n| Key | Mặc định | Phạm vi / ghi chú |\n| --- | --- | --- |\n| topN | 12 | 1–40 kết quả |\n| sources | youtube, soundcloud, audius | Bảng ID nguồn; UI cho chọn All hoặc một trong ba. Nguồn khác phụ thuộc dịch vụ. |\n| region | auto | auto, global, VN, US, KR, JP; ưu tiên qua từ khóa, không xác minh ngôn ngữ. |\n| prefetchNext | true | Chuẩn bị bài tiếp trong danh sách tại 50% khi bật Auto, tắt RepeatOne và có hơn một bài. |\n| searchTimeout | 12 | 2–60 giây |\n| preferShort | 600 | 0–7200 giây; 0 tắt ưu tiên |\n| folder | xNgotLibrary/Music | Thư mục cache local |\n| raceTracks | 2 | 1–4 bài thử song song trong resolve |\n| downloadTimeout | 200 | 20–600 giây |\n| retries | 2 | 0–5 |\n| renameFiles, aiLearn, coverArt | true | Boolean |\n| compactRows, debug | false | Boolean |\n| showSource, notifyOnSearch | true | Boolean |\n| aiBrain | local | Bản này không bật mô hình online. |\n\nAuto ưu tiên quốc gia Roblox nếu có, dự phòng locale; vùng chưa hỗ trợ/không rõ chuyển về global. Preload dùng mạng và bộ nhớ, không đảm bảo chuyển bài không trễ. Nếu preload lỗi sẽ tải theo luồng bình thường. Một số key có trong schema nhưng hiệu lực thực tế tùy source hiện tại; hãy kiểm tra trong môi trường của bạn.\n\nĐể chẩn đoán, gọi _G.xNgotMusicDoctor() khi có và xem từng check. Cảnh báo không tự chứng minh một nguyên nhân cụ thể. Test riêng tìm kiếm, tải, API file, getcustomasset/getsynasset và phát âm thanh.\n"}},{"id":"loader-reference","num":"20","group":{"en":"DETAILED REFERENCE","vi":"THAM KHẢO CHI TIẾT"},"title":{"en":"Loader and key lifecycle","vi":"Loader và vòng đời key"},"html":{"en":"<h1>Loader and key lifecycle<\/h1>\n<h2>Configure startup<\/h2>\n<pre><code class=\"language-lua\">local Window = LIB:CreateWindow({\n    Title = &quot;My Hub&quot;, Icon = &quot;sparkles&quot;,\n    Loading = {Title = &quot;My Hub&quot;, Text = &quot;Starting&quot;, Steps = {&quot;Prepare&quot;, &quot;Almost ready&quot;}, Duration = 2},\n    KeySystem = {Enabled = true, Keys = {&quot;DEMO-KEY&quot;}, SaveKey = false},\n})\n<\/code><\/pre>\n<p>When <code>KeySystem.Enabled = true<\/code> and <code>Style<\/code> is not <code>Legacy<\/code>, the embedded Ophyn flow handles the gate. The non-Ophyn/legacy loader uses <code>Loading.Title<\/code>, <code>Text<\/code>, <code>Steps<\/code> and <code>Duration<\/code>; its effective display can be longer than the configured duration. <code>Loading = false<\/code> disables the non-key loader, not an enabled key gate. Confirm which flow you are testing before expecting a particular animation.<\/p>\n<h2>Ordering and saved keys<\/h2>\n<p>The window is constructed while startup proceeds, but the menu and island are held until the gate passes. Saved keys are rechecked. Closing the key UI without acceptance destroys the window. Use <code>SaveKey = false<\/code> or call <code>Window:ForgetSavedKey()<\/code> when available to retest input. Saving needs executor filesystem APIs.<\/p>\n<h2>Providers and trust<\/h2>\n<p>Local values/functions are evaluated client-side and can be changed by the user. Providers require working network/request primitives and a properly configured service. PandaAuth and Jnkie load remote SDK code; Platoboost client-side secrets can be extracted. Multiple validators accept <strong>any<\/strong> successful validator. The code and SDK links can change externally; verify valid, invalid and network-failure cases with real credentials before release. Never hardcode a real secret into an example.<\/p>\n<p>For UI overrides, use <code>KeySystem.Ophyn<\/code>, such as <code>SyncTheme = false<\/code>, <code>SyncFont = false<\/code>, <code>Theme<\/code>, <code>Logo<\/code>, <code>Title<\/code>, <code>Description<\/code>. The source integrates Ophyn; the exact set of supported options is the bundled vendor implementation, not a promise that all future upstream options work.<\/p>\n","vi":"<h1>Loader và vòng đời key<\/h1>\n<h2>Cấu hình khởi động<\/h2>\n<pre><code class=\"language-lua\">local Window = LIB:CreateWindow({\n    Title = &quot;My Hub&quot;, Icon = &quot;sparkles&quot;,\n    Loading = {Title = &quot;My Hub&quot;, Text = &quot;Đang mở&quot;, Steps = {&quot;Chuẩn bị&quot;, &quot;Sắp xong&quot;}, Duration = 2},\n    KeySystem = {Enabled = true, Keys = {&quot;DEMO-KEY&quot;}, SaveKey = false},\n})\n<\/code><\/pre>\n<p>Khi <code>KeySystem.Enabled = true<\/code> và <code>Style<\/code> không phải <code>Legacy<\/code>, luồng Ophyn tích hợp xử lý key gate. Loader không dùng Ophyn/legacy đọc <code>Loading.Title<\/code>, <code>Text<\/code>, <code>Steps<\/code>, <code>Duration<\/code>; thời gian hiện thực tế có thể lâu hơn thời lượng cấu hình. <code>Loading = false<\/code> tắt loader không-key, không tắt key gate đã bật. Hãy xác định đúng luồng đang test trước khi chờ một animation cụ thể.<\/p>\n<h2>Thứ tự và key lưu<\/h2>\n<p>Cửa sổ được dựng trong lúc khởi động, nhưng menu và Island chờ gate vượt qua. Key đã lưu được kiểm tra lại. Nếu đóng UI key mà chưa chấp nhận, cửa sổ sẽ bị hủy. Dùng <code>SaveKey = false<\/code> hoặc gọi <code>Window:ForgetSavedKey()<\/code> khi có để test nhập lại. Lưu file cần API filesystem của executor.<\/p>\n<h2>Provider và độ tin cậy<\/h2>\n<p>Key/validator local chạy phía client nên người dùng có thể sửa. Provider cần network/request và service cấu hình đúng. PandaAuth/Jnkie nạp SDK từ xa; secret Platoboost đặt ở client có thể bị đọc. Nhiều validator nghĩa là <strong>một validator thành công là đủ<\/strong>. Code và SDK bên ngoài có thể đổi; trước khi phát hành hãy test key đúng, sai và trường hợp lỗi mạng bằng tài khoản thật. Không nhúng secret thật vào ví dụ.<\/p>\n<p>Để tùy chỉnh UI, dùng <code>KeySystem.Ophyn<\/code>, ví dụ <code>SyncTheme = false<\/code>, <code>SyncFont = false<\/code>, <code>Theme<\/code>, <code>Logo<\/code>, <code>Title<\/code>, <code>Description<\/code>. Những option thực sự hỗ trợ là của vendor được nhúng, không mặc định mọi option upstream tương lai đều chạy.<\/p>\n"},"plain":{"en":" Loader and key lifecycle\n\n Configure startup\n\nlua\nlocal Window = LIB:CreateWindow({\n    Title = \"My Hub\", Icon = \"sparkles\",\n    Loading = {Title = \"My Hub\", Text = \"Starting\", Steps = {\"Prepare\", \"Almost ready\"}, Duration = 2},\n    KeySystem = {Enabled = true, Keys = {\"DEMO-KEY\"}, SaveKey = false},\n})\n\n\nWhen KeySystem.Enabled = true and Style is not Legacy, the embedded Ophyn flow handles the gate. The non-Ophyn/legacy loader uses Loading.Title, Text, Steps and Duration; its effective display can be longer than the configured duration. Loading = false disables the non-key loader, not an enabled key gate. Confirm which flow you are testing before expecting a particular animation.\n\n Ordering and saved keys\n\nThe window is constructed while startup proceeds, but the menu and island are held until the gate passes. Saved keys are rechecked. Closing the key UI without acceptance destroys the window. Use SaveKey = false or call Window:ForgetSavedKey() when available to retest input. Saving needs executor filesystem APIs.\n\n Providers and trust\n\nLocal values/functions are evaluated client-side and can be changed by the user. Providers require working network/request primitives and a properly configured service. PandaAuth and Jnkie load remote SDK code; Platoboost client-side secrets can be extracted. Multiple validators accept any successful validator. The code and SDK links can change externally; verify valid, invalid and network-failure cases with real credentials before release. Never hardcode a real secret into an example.\n\nFor UI overrides, use KeySystem.Ophyn, such as SyncTheme = false, SyncFont = false, Theme, Logo, Title, Description. The source integrates Ophyn; the exact set of supported options is the bundled vendor implementation, not a promise that all future upstream options work.\n","vi":" Loader và vòng đời key\n\n Cấu hình khởi động\n\nlua\nlocal Window = LIB:CreateWindow({\n    Title = \"My Hub\", Icon = \"sparkles\",\n    Loading = {Title = \"My Hub\", Text = \"Đang mở\", Steps = {\"Chuẩn bị\", \"Sắp xong\"}, Duration = 2},\n    KeySystem = {Enabled = true, Keys = {\"DEMO-KEY\"}, SaveKey = false},\n})\n\n\nKhi KeySystem.Enabled = true và Style không phải Legacy, luồng Ophyn tích hợp xử lý key gate. Loader không dùng Ophyn/legacy đọc Loading.Title, Text, Steps, Duration; thời gian hiện thực tế có thể lâu hơn thời lượng cấu hình. Loading = false tắt loader không-key, không tắt key gate đã bật. Hãy xác định đúng luồng đang test trước khi chờ một animation cụ thể.\n\n Thứ tự và key lưu\n\nCửa sổ được dựng trong lúc khởi động, nhưng menu và Island chờ gate vượt qua. Key đã lưu được kiểm tra lại. Nếu đóng UI key mà chưa chấp nhận, cửa sổ sẽ bị hủy. Dùng SaveKey = false hoặc gọi Window:ForgetSavedKey() khi có để test nhập lại. Lưu file cần API filesystem của executor.\n\n Provider và độ tin cậy\n\nKey/validator local chạy phía client nên người dùng có thể sửa. Provider cần network/request và service cấu hình đúng. PandaAuth/Jnkie nạp SDK từ xa; secret Platoboost đặt ở client có thể bị đọc. Nhiều validator nghĩa là một validator thành công là đủ. Code và SDK bên ngoài có thể đổi; trước khi phát hành hãy test key đúng, sai và trường hợp lỗi mạng bằng tài khoản thật. Không nhúng secret thật vào ví dụ.\n\nĐể tùy chỉnh UI, dùng KeySystem.Ophyn, ví dụ SyncTheme = false, SyncFont = false, Theme, Logo, Title, Description. Những option thực sự hỗ trợ là của vendor được nhúng, không mặc định mọi option upstream tương lai đều chạy.\n"}},{"id":"maintain","num":"21","group":{"en":"MAINTENANCE","vi":"BẢO TRÌ"},"title":{"en":"Build, test and publish","vi":"Build, test và xuất bản"},"html":{"en":"<h1>Build, test and publish<\/h1>\n<h2>Project layout<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Path<\/th>\n  <th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>src/modules/<\/code><\/td>\n  <td>Ordered Luau source modules, the source of truth for the library.<\/td>\n<\/tr>\n<tr>\n  <td><code>src/manifest.json<\/code><\/td>\n  <td>Module ordering, hashes and block metadata.<\/td>\n<\/tr>\n<tr>\n  <td><code>src/profiles/<\/code>, <code>src/stubs/<\/code><\/td>\n  <td>Development/release build profiles and replacement modules.<\/td>\n<\/tr>\n<tr>\n  <td><code>src/build.py<\/code>, <code>src/minify.py<\/code><\/td>\n  <td>Build and single/light/compact/full minification tools.<\/td>\n<\/tr>\n<tr>\n  <td><code>dist/main.lua<\/code>, <code>dist/main.min.lua<\/code><\/td>\n  <td>Generated release artifacts; include them in a repository or archive if needed.<\/td>\n<\/tr>\n<tr>\n  <td><code>docs/site/content.py<\/code>, <code>details.py<\/code><\/td>\n  <td>Bilingual content.<\/td>\n<\/tr>\n<tr>\n  <td><code>docs/site/template.html<\/code><\/td>\n  <td>Standalone HTML UI, inline CSS/JS/SVG.<\/td>\n<\/tr>\n<tr>\n  <td><code>docs/site/build.py<\/code><\/td>\n  <td>Builds HTML and Markdown manuals from the content.<\/td>\n<\/tr>\n<tr>\n  <td><code>.github/workflows/pages.yml<\/code><\/td>\n  <td>GitHub Actions Pages workflow.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Build commands<\/h2>\n<pre><code class=\"language-bash\">python3 src/build.py --check\npython3 src/build.py --release --check\npython3 src/build.py --release --minify light\npython3 -m pip install -r docs/site/requirements.txt\npython3 docs/site/build.py\n<\/code><\/pre>\n<p>The source manifest validates module hashes and block balance. Update its metadata when changing modules, rather than editing generated <code>dist<\/code> alone. Single is a one-line wrapper requiring loadstring; it reconstructs light source with newlines at runtime. Light keeps newlines directly; very long compact output can be problematic for older executors. A successful compile checks syntax/register limits, not actual Roblox behavior.<\/p>\n<h2>Release checklist<\/h2>\n<ol>\n<li>Test startup, key success/failure, close/reopen and replacement of an existing xNgot window.<\/li>\n<li>On mobile, test tap vs scroll, slider drag, releasing outside, dropdown, toggle and text input; also test desktop mouse.<\/li>\n<li>Test music search and download against real services, local files, auto-next/prefetch and errors.<\/li>\n<li>Review config save/read/delete and the executor APIs available on the target device.<\/li>\n<li>Build both release artifacts; update the repo's <code>dist/<\/code> and <code>docs/<\/code>, commit and push. A local ZIP or Pages publication does not update the raw GitHub script by itself.<\/li>\n<li>Enable GitHub Pages with GitHub Actions in repository settings and wait for a successful workflow. The expected Pages URL is <code>https://xngotzume123.github.io/xNgotLibrary/<\/code> only after publishing; GitHub's actual URL is authoritative.<\/li>\n<\/ol>\n<p>For private or inaccessible repositories, local preview can still open <code>docs/index.html<\/code>. JS is required for the bilingual navigation. No external fonts, scripts or icons are needed for the site.<\/p>\n","vi":"<h1>Build, test và xuất bản<\/h1>\n<h2>Cấu trúc dự án<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Đường dẫn<\/th>\n  <th>Công dụng<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>src/modules/<\/code><\/td>\n  <td>Source Luau chia module theo thứ tự; nguồn chính của thư viện.<\/td>\n<\/tr>\n<tr>\n  <td><code>src/manifest.json<\/code><\/td>\n  <td>Thứ tự module, hash và metadata cân bằng block.<\/td>\n<\/tr>\n<tr>\n  <td><code>src/profiles/<\/code>, <code>src/stubs/<\/code><\/td>\n  <td>Profile dev/release và module thay thế.<\/td>\n<\/tr>\n<tr>\n  <td><code>src/build.py<\/code>, <code>src/minify.py<\/code><\/td>\n  <td>Công cụ build, minify single/light/compact/full.<\/td>\n<\/tr>\n<tr>\n  <td><code>dist/main.lua<\/code>, <code>dist/main.min.lua<\/code><\/td>\n  <td>Bản release sinh ra; đưa vào repo/ZIP khi cần.<\/td>\n<\/tr>\n<tr>\n  <td><code>docs/site/content.py<\/code>, <code>details.py<\/code><\/td>\n  <td>Nội dung song ngữ.<\/td>\n<\/tr>\n<tr>\n  <td><code>docs/site/template.html<\/code><\/td>\n  <td>Giao diện HTML độc lập, CSS/JS/SVG inline.<\/td>\n<\/tr>\n<tr>\n  <td><code>docs/site/build.py<\/code><\/td>\n  <td>Sinh HTML và manual Markdown từ nội dung.<\/td>\n<\/tr>\n<tr>\n  <td><code>.github/workflows/pages.yml<\/code><\/td>\n  <td>Workflow Pages bằng GitHub Actions.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Lệnh build<\/h2>\n<pre><code class=\"language-bash\">python3 src/build.py --check\npython3 src/build.py --release --check\npython3 src/build.py --release --minify light\npython3 -m pip install -r docs/site/requirements.txt\npython3 docs/site/build.py\n<\/code><\/pre>\n<p>Manifest kiểm tra hash và độ cân bằng block của module. Khi sửa module, cập nhật metadata thay vì chỉ sửa <code>dist<\/code>. Bản single là wrapper một dòng cần loadstring, khôi phục mã light có xuống dòng khi chạy. Bản light giữ xuống dòng trực tiếp; compact rất dài có thể gây vấn đề cho executor cũ. Compile thành công chỉ kiểm tra cú pháp/giới hạn register, không chứng minh chạy đúng trong Roblox.<\/p>\n<h2>Checklist trước khi phát hành<\/h2>\n<ol>\n<li>Test khởi động, key đúng/sai, đóng/mở và thay UI xNgot cũ bằng UI mới.<\/li>\n<li>Trên mobile test chạm và cuộn, kéo slider, thả ngoài nút, dropdown, toggle, input; test cả chuột desktop.<\/li>\n<li>Test tìm/tải nhạc với dịch vụ thật, file local, tự chuyển/preload và lỗi mạng.<\/li>\n<li>Kiểm tra lưu/đọc/xóa config và các API executor trên thiết bị đích.<\/li>\n<li>Build hai bản release; cập nhật <code>dist/<\/code>, <code>docs/<\/code> trong repo rồi commit/push. ZIP local hoặc đăng Pages không tự cập nhật script raw trên GitHub.<\/li>\n<li>Chọn GitHub Actions làm nguồn Pages trong Settings repo và chờ workflow thành công. <code>https://xngotzume123.github.io/xNgotLibrary/<\/code> chỉ là URL dự kiến sau khi đăng; dùng URL thực tế GitHub cung cấp.<\/li>\n<\/ol>\n<p>Có thể mở <code>docs/index.html<\/code> để xem local nếu repo private hoặc chưa truy cập được. Điều hướng song ngữ cần JavaScript. Trang không cần font, script hay icon bên ngoài.<\/p>\n"},"plain":{"en":" Build, test and publish\n\n Project layout\n\n| Path | Purpose |\n| --- | --- |\n| src/modules/ | Ordered Luau source modules, the source of truth for the library. |\n| src/manifest.json | Module ordering, hashes and block metadata. |\n| src/profiles/, src/stubs/ | Development/release build profiles and replacement modules. |\n| src/build.py, src/minify.py | Build and single/light/compact/full minification tools. |\n| dist/main.lua, dist/main.min.lua | Generated release artifacts; include them in a repository or archive if needed. |\n| docs/site/content.py, details.py | Bilingual content. |\n| docs/site/template.html | Standalone HTML UI, inline CSS/JS/SVG. |\n| docs/site/build.py | Builds HTML and Markdown manuals from the content. |\n| .github/workflows/pages.yml | GitHub Actions Pages workflow. |\n\n Build commands\n\nbash\npython3 src/build.py --check\npython3 src/build.py --release --check\npython3 src/build.py --release --minify light\npython3 -m pip install -r docs/site/requirements.txt\npython3 docs/site/build.py\n\n\nThe source manifest validates module hashes and block balance. Update its metadata when changing modules, rather than editing generated dist alone. Single is a one-line wrapper requiring loadstring; it reconstructs light source with newlines at runtime. Light keeps newlines directly; very long compact output can be problematic for older executors. A successful compile checks syntax/register limits, not actual Roblox behavior.\n\n Release checklist\n\n1. Test startup, key success/failure, close/reopen and replacement of an existing xNgot window.\n2. On mobile, test tap vs scroll, slider drag, releasing outside, dropdown, toggle and text input; also test desktop mouse.\n3. Test music search and download against real services, local files, auto-next/prefetch and errors.\n4. Review config save/read/delete and the executor APIs available on the target device.\n5. Build both release artifacts; update the repo's dist/ and docs/, commit and push. A local ZIP or Pages publication does not update the raw GitHub script by itself.\n6. Enable GitHub Pages with GitHub Actions in repository settings and wait for a successful workflow. The expected Pages URL is https://xngotzume123.github.io/xNgotLibrary/ only after publishing; GitHub's actual URL is authoritative.\n\nFor private or inaccessible repositories, local preview can still open docs/index.html. JS is required for the bilingual navigation. No external fonts, scripts or icons are needed for the site.\n","vi":" Build, test và xuất bản\n\n Cấu trúc dự án\n\n| Đường dẫn | Công dụng |\n| --- | --- |\n| src/modules/ | Source Luau chia module theo thứ tự; nguồn chính của thư viện. |\n| src/manifest.json | Thứ tự module, hash và metadata cân bằng block. |\n| src/profiles/, src/stubs/ | Profile dev/release và module thay thế. |\n| src/build.py, src/minify.py | Công cụ build, minify single/light/compact/full. |\n| dist/main.lua, dist/main.min.lua | Bản release sinh ra; đưa vào repo/ZIP khi cần. |\n| docs/site/content.py, details.py | Nội dung song ngữ. |\n| docs/site/template.html | Giao diện HTML độc lập, CSS/JS/SVG inline. |\n| docs/site/build.py | Sinh HTML và manual Markdown từ nội dung. |\n| .github/workflows/pages.yml | Workflow Pages bằng GitHub Actions. |\n\n Lệnh build\n\nbash\npython3 src/build.py --check\npython3 src/build.py --release --check\npython3 src/build.py --release --minify light\npython3 -m pip install -r docs/site/requirements.txt\npython3 docs/site/build.py\n\n\nManifest kiểm tra hash và độ cân bằng block của module. Khi sửa module, cập nhật metadata thay vì chỉ sửa dist. Bản single là wrapper một dòng cần loadstring, khôi phục mã light có xuống dòng khi chạy. Bản light giữ xuống dòng trực tiếp; compact rất dài có thể gây vấn đề cho executor cũ. Compile thành công chỉ kiểm tra cú pháp/giới hạn register, không chứng minh chạy đúng trong Roblox.\n\n Checklist trước khi phát hành\n\n1. Test khởi động, key đúng/sai, đóng/mở và thay UI xNgot cũ bằng UI mới.\n2. Trên mobile test chạm và cuộn, kéo slider, thả ngoài nút, dropdown, toggle, input; test cả chuột desktop.\n3. Test tìm/tải nhạc với dịch vụ thật, file local, tự chuyển/preload và lỗi mạng.\n4. Kiểm tra lưu/đọc/xóa config và các API executor trên thiết bị đích.\n5. Build hai bản release; cập nhật dist/, docs/ trong repo rồi commit/push. ZIP local hoặc đăng Pages không tự cập nhật script raw trên GitHub.\n6. Chọn GitHub Actions làm nguồn Pages trong Settings repo và chờ workflow thành công. https://xngotzume123.github.io/xNgotLibrary/ chỉ là URL dự kiến sau khi đăng; dùng URL thực tế GitHub cung cấp.\n\nCó thể mở docs/index.html để xem local nếu repo private hoặc chưa truy cập được. Điều hướng song ngữ cần JavaScript. Trang không cần font, script hay icon bên ngoài.\n"}},{"id":"controls-start","num":"22","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Control guides: start here","vi":"Control: bắt đầu tại đây"},"html":{"en":"<h1>Control guides: start here<\/h1>\n<p>Each control page has a small <strong>addition<\/strong>, not a separate script. First paste and run this setup together with one or more examples on the following pages. Put the current <code>main.lua<\/code> in the executor workspace. <code>readfile<\/code> and <code>loadstring<\/code> are required.<\/p>\n<pre><code class=\"language-lua\">getgenv().xNgotLibraryOnly = true\nlocal chunk, err = loadstring(readfile(&quot;main.lua&quot;))\nassert(chunk, err)\nlocal LIB = chunk()\nlocal Window = LIB:CreateWindow({\n    Title = &quot;Control examples&quot;, Folder = &quot;ControlExamples&quot;,\n    FileSaveName = &quot;settings.json&quot;, AutoSave = true,\n    SettingsUI = true, Loading = false,\n})\nlocal Tab = Window:Tab({ Title = &quot;Main&quot;, Icon = &quot;house&quot; })\nWindow:SelectTab(&quot;Main&quot;)\n<\/code><\/pre>\n<h2>Before you begin<\/h2>\n<ul>\n<li><code>Tab:Section()<\/code> changes the parent used by <em>subsequently created<\/em> controls; create another section to switch. <code>Section:_Use(&quot;Button&quot;, {...})<\/code> explicitly targets a section. Destroying the current section resets the parent to the tab.<\/li>\n<li>Toggle, Slider, Input, Dropdown and Colorpicker invoke their callback while being created, with the initial or restored value. Create dependencies before these controls; do not refer to a local that is still being assigned from its own constructor.<\/li>\n<li>Saved values are indexed by tab title and the control's original title, not by <code>Flag<\/code>. Use unique titles per tab. Renaming a control later does not migrate its saved key. <code>AutoSave<\/code> and filesystem support affect persistence; see Window &amp; storage.<\/li>\n<li><code>Lock()<\/code> blocks interaction; programmatic setters can still update values and trigger callbacks. <code>Destroy()<\/code> removes the visual control.<\/li>\n<li>Mobile retains its original dimensions. Drag sliders horizontally; vertical gestures are treated as scrolling. Actual executor behavior still needs Roblox testing.<\/li>\n<\/ul>\n","vi":"<h1>Hướng dẫn control: bắt đầu tại đây<\/h1>\n<p>Mỗi trang control là một <strong>đoạn nối thêm<\/strong>, không phải script riêng. Hãy ghép đoạn khởi tạo dưới đây với một hoặc nhiều ví dụ ở các trang tiếp theo rồi chạy. Đặt <code>main.lua<\/code> mới trong workspace của executor; cần <code>readfile<\/code> và <code>loadstring<\/code>.<\/p>\n<pre><code class=\"language-lua\">getgenv().xNgotLibraryOnly = true\nlocal chunk, err = loadstring(readfile(&quot;main.lua&quot;))\nassert(chunk, err)\nlocal LIB = chunk()\nlocal Window = LIB:CreateWindow({\n    Title = &quot;Control examples&quot;, Folder = &quot;ControlExamples&quot;,\n    FileSaveName = &quot;settings.json&quot;, AutoSave = true,\n    SettingsUI = true, Loading = false,\n})\nlocal Tab = Window:Tab({ Title = &quot;Main&quot;, Icon = &quot;house&quot; })\nWindow:SelectTab(&quot;Main&quot;)\n<\/code><\/pre>\n<h2>Trước khi tạo control<\/h2>\n<ul>\n<li><code>Tab:Section()<\/code> đổi vùng chứa cho các control tạo <strong>sau đó<\/strong>; tạo section khác để đổi vùng. <code>Section:_Use(&quot;Button&quot;, {...})<\/code> chỉ định vùng chứa cụ thể. Xóa section hiện tại sẽ đưa vùng chứa về tab.<\/li>\n<li>Toggle, Slider, Input, Dropdown và Colorpicker gọi callback ngay khi tạo, với giá trị mặc định hoặc đã khôi phục. Hãy tạo đối tượng phụ thuộc trước; đừng dùng biến local đang được gán từ chính constructor của nó bên trong callback.<\/li>\n<li>Giá trị lưu theo tên tab và <strong>Title ban đầu<\/strong> của control, không theo <code>Flag<\/code>. Đặt Title duy nhất trong mỗi tab. Đổi tên sau đó không tự chuyển key lưu. <code>AutoSave<\/code> và API file ảnh hưởng việc lưu; xem mục Window &amp; storage.<\/li>\n<li><code>Lock()<\/code> khóa tương tác người dùng; setter bằng code vẫn có thể cập nhật và gọi callback. <code>Destroy()<\/code> xóa control khỏi giao diện.<\/li>\n<li>Mobile giữ kích thước gốc. Kéo slider theo chiều ngang; vuốt dọc dùng để cuộn. Vẫn cần test thực tế trong Roblox/executor.<\/li>\n<\/ul>\n"},"plain":{"en":" Control guides: start here\n\nEach control page has a small addition, not a separate script. First paste and run this setup together with one or more examples on the following pages. Put the current main.lua in the executor workspace. readfile and loadstring are required.\n\nlua\ngetgenv().xNgotLibraryOnly = true\nlocal chunk, err = loadstring(readfile(\"main.lua\"))\nassert(chunk, err)\nlocal LIB = chunk()\nlocal Window = LIB:CreateWindow({\n    Title = \"Control examples\", Folder = \"ControlExamples\",\n    FileSaveName = \"settings.json\", AutoSave = true,\n    SettingsUI = true, Loading = false,\n})\nlocal Tab = Window:Tab({ Title = \"Main\", Icon = \"house\" })\nWindow:SelectTab(\"Main\")\n\n\n Before you begin\n\n- Tab:Section() changes the parent used by subsequently created controls; create another section to switch. Section:_Use(\"Button\", {...}) explicitly targets a section. Destroying the current section resets the parent to the tab.\n- Toggle, Slider, Input, Dropdown and Colorpicker invoke their callback while being created, with the initial or restored value. Create dependencies before these controls; do not refer to a local that is still being assigned from its own constructor.\n- Saved values are indexed by tab title and the control's original title, not by Flag. Use unique titles per tab. Renaming a control later does not migrate its saved key. AutoSave and filesystem support affect persistence; see Window & storage.\n- Lock() blocks interaction; programmatic setters can still update values and trigger callbacks. Destroy() removes the visual control.\n- Mobile retains its original dimensions. Drag sliders horizontally; vertical gestures are treated as scrolling. Actual executor behavior still needs Roblox testing.\n","vi":" Hướng dẫn control: bắt đầu tại đây\n\nMỗi trang control là một đoạn nối thêm, không phải script riêng. Hãy ghép đoạn khởi tạo dưới đây với một hoặc nhiều ví dụ ở các trang tiếp theo rồi chạy. Đặt main.lua mới trong workspace của executor; cần readfile và loadstring.\n\nlua\ngetgenv().xNgotLibraryOnly = true\nlocal chunk, err = loadstring(readfile(\"main.lua\"))\nassert(chunk, err)\nlocal LIB = chunk()\nlocal Window = LIB:CreateWindow({\n    Title = \"Control examples\", Folder = \"ControlExamples\",\n    FileSaveName = \"settings.json\", AutoSave = true,\n    SettingsUI = true, Loading = false,\n})\nlocal Tab = Window:Tab({ Title = \"Main\", Icon = \"house\" })\nWindow:SelectTab(\"Main\")\n\n\n Trước khi tạo control\n\n- Tab:Section() đổi vùng chứa cho các control tạo sau đó; tạo section khác để đổi vùng. Section:_Use(\"Button\", {...}) chỉ định vùng chứa cụ thể. Xóa section hiện tại sẽ đưa vùng chứa về tab.\n- Toggle, Slider, Input, Dropdown và Colorpicker gọi callback ngay khi tạo, với giá trị mặc định hoặc đã khôi phục. Hãy tạo đối tượng phụ thuộc trước; đừng dùng biến local đang được gán từ chính constructor của nó bên trong callback.\n- Giá trị lưu theo tên tab và Title ban đầu của control, không theo Flag. Đặt Title duy nhất trong mỗi tab. Đổi tên sau đó không tự chuyển key lưu. AutoSave và API file ảnh hưởng việc lưu; xem mục Window & storage.\n- Lock() khóa tương tác người dùng; setter bằng code vẫn có thể cập nhật và gọi callback. Destroy() xóa control khỏi giao diện.\n- Mobile giữ kích thước gốc. Kéo slider theo chiều ngang; vuốt dọc dùng để cuộn. Vẫn cần test thực tế trong Roblox/executor.\n"}},{"id":"control-section","num":"23","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Section","vi":"Section"},"html":{"en":"<h1>Section<\/h1>\n<p>Group controls in a collapsible area.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local group = Tab:Section({ Title = &quot;Actions&quot;, Default = true })\nTab:Button({ Title = &quot;Inside Actions&quot;, Callback = function() print(&quot;Pressed&quot;) end })\ngroup:SetOpen(true)\n-- group:_Use(&quot;Toggle&quot;, { Title = &quot;Extra&quot;, Callback = function(v) print(v) end })\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Section<\/code><\/td>\n  <td>Heading<\/td>\n<\/tr>\n<tr>\n  <td><code>Default<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Initially open<\/td>\n<\/tr>\n<tr>\n  <td><code>TextXAlignment<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Left<\/code><\/td>\n  <td>Left, Center or Right<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>SetTitle(text)<\/code>, <code>SetOpen(boolean)<\/code> (returns state), <code>Toggle()<\/code> (returns state), <code>Destroy()<\/code>, <code>_Use(methodName, options)<\/code><\/p>\n<h2>Notes<\/h2>\n<p>Later <code>Tab<\/code> controls go into the most recently created section, not automatically back to the tab. <code>_Use<\/code> does not permanently change that parent.<\/p>\n","vi":"<h1>Section<\/h1>\n<p>Nhóm control trong một vùng có thể thu gọn.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local group = Tab:Section({ Title = &quot;Actions&quot;, Default = true })\nTab:Button({ Title = &quot;Inside Actions&quot;, Callback = function() print(&quot;Pressed&quot;) end })\ngroup:SetOpen(true)\n-- group:_Use(&quot;Toggle&quot;, { Title = &quot;Extra&quot;, Callback = function(v) print(v) end })\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Section<\/code><\/td>\n  <td>Tiêu đề<\/td>\n<\/tr>\n<tr>\n  <td><code>Default<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Mở sẵn<\/td>\n<\/tr>\n<tr>\n  <td><code>TextXAlignment<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Left<\/code><\/td>\n  <td>Left, Center hoặc Right<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>SetTitle(text)<\/code>, <code>SetOpen(boolean)<\/code> (returns state), <code>Toggle()<\/code> (returns state), <code>Destroy()<\/code>, <code>_Use(methodName, options)<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Control tạo sau qua <code>Tab<\/code> nằm trong section mới nhất, không tự quay về tab. <code>_Use<\/code> không đổi vùng chứa mặc định lâu dài.<\/p>\n"},"plain":{"en":" Section\n\nGroup controls in a collapsible area.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal group = Tab:Section({ Title = \"Actions\", Default = true })\nTab:Button({ Title = \"Inside Actions\", Callback = function() print(\"Pressed\") end })\ngroup:SetOpen(true)\n-- group:_Use(\"Toggle\", { Title = \"Extra\", Callback = function(v) print(v) end })\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Title | string | Section | Heading |\n| Default | boolean | false | Initially open |\n| TextXAlignment | string | Left | Left, Center or Right |\n\n Returned object\n\nSetTitle(text), SetOpen(boolean) (returns state), Toggle() (returns state), Destroy(), _Use(methodName, options)\n\n Notes\n\nLater Tab controls go into the most recently created section, not automatically back to the tab. _Use does not permanently change that parent.\n","vi":" Section\n\nNhóm control trong một vùng có thể thu gọn.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal group = Tab:Section({ Title = \"Actions\", Default = true })\nTab:Button({ Title = \"Inside Actions\", Callback = function() print(\"Pressed\") end })\ngroup:SetOpen(true)\n-- group:_Use(\"Toggle\", { Title = \"Extra\", Callback = function(v) print(v) end })\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Title | string | Section | Tiêu đề |\n| Default | boolean | false | Mở sẵn |\n| TextXAlignment | string | Left | Left, Center hoặc Right |\n\n Đối tượng trả về\n\nSetTitle(text), SetOpen(boolean) (returns state), Toggle() (returns state), Destroy(), _Use(methodName, options)\n\n Lưu ý\n\nControl tạo sau qua Tab nằm trong section mới nhất, không tự quay về tab. _Use không đổi vùng chứa mặc định lâu dài.\n"}},{"id":"control-button","num":"24","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Button","vi":"Button"},"html":{"en":"<h1>Button<\/h1>\n<p>Execute an action on activation.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local button = Tab:Button({\n    Title = &quot;Say hello&quot;, Desc = &quot;Run an action&quot;,\n    Callback = function() print(&quot;Hello!&quot;) end,\n})\n-- button:Lock()  -- button:Unlock()\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Button<\/code><\/td>\n  <td>Label<\/td>\n<\/tr>\n<tr>\n  <td><code>Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Optional description<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Disable user activation<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function()<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Runs when pressed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Notes<\/h2>\n<p>The callback receives no arguments.<\/p>\n","vi":"<h1>Button<\/h1>\n<p>Thực hiện hành động khi nhấn.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local button = Tab:Button({\n    Title = &quot;Say hello&quot;, Desc = &quot;Run an action&quot;,\n    Callback = function() print(&quot;Hello!&quot;) end,\n})\n-- button:Lock()  -- button:Unlock()\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Button<\/code><\/td>\n  <td>Nhãn<\/td>\n<\/tr>\n<tr>\n  <td><code>Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Mô tả tùy chọn<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Khóa tương tác<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function()<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Chạy khi nhấn<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Callback không nhận tham số.<\/p>\n"},"plain":{"en":" Button\n\nExecute an action on activation.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal button = Tab:Button({\n    Title = \"Say hello\", Desc = \"Run an action\",\n    Callback = function() print(\"Hello!\") end,\n})\n-- button:Lock()  -- button:Unlock()\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Title | string | Button | Label |\n| Desc | string | nil | Optional description |\n| Locked | boolean | false | Disable user activation |\n| Callback | function() | no-op | Runs when pressed |\n\n Returned object\n\nSetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Notes\n\nThe callback receives no arguments.\n","vi":" Button\n\nThực hiện hành động khi nhấn.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal button = Tab:Button({\n    Title = \"Say hello\", Desc = \"Run an action\",\n    Callback = function() print(\"Hello!\") end,\n})\n-- button:Lock()  -- button:Unlock()\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Title | string | Button | Nhãn |\n| Desc | string | nil | Mô tả tùy chọn |\n| Locked | boolean | false | Khóa tương tác |\n| Callback | function() | no-op | Chạy khi nhấn |\n\n Đối tượng trả về\n\nSetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Lưu ý\n\nCallback không nhận tham số.\n"}},{"id":"control-toggle","num":"25","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Toggle","vi":"Toggle"},"html":{"en":"<h1>Toggle<\/h1>\n<p>Turn a feature on or off.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local toggle = Tab:Toggle({\n    Title = &quot;Auto action&quot;, Desc = &quot;Example switch&quot;, Default = false, Icon = &quot;zap&quot;,\n    Callback = function(enabled) print(&quot;Auto action:&quot;, enabled) end,\n})\ntoggle:Set(true)\n-- toggle:Set() -- invert\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Toggle<\/code><\/td>\n  <td>Label and original storage key<\/td>\n<\/tr>\n<tr>\n  <td><code>Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Optional description<\/td>\n<\/tr>\n<tr>\n  <td><code>Default / Value<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Initial state; prefer Default alone<\/td>\n<\/tr>\n<tr>\n  <td><code>Icon<\/code><\/td>\n  <td>string<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Optional icon name<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Disable interaction<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(boolean)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Receives new state<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>Set(boolean)<\/code> or <code>Set()<\/code> to invert, <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Notes<\/h2>\n<p>The callback runs at creation and after Set. A saved state can override Default. Avoid supplying both Default=false and Value=true: the source fallback expression can choose Value.<\/p>\n","vi":"<h1>Toggle<\/h1>\n<p>Bật hoặc tắt một tính năng.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local toggle = Tab:Toggle({\n    Title = &quot;Auto action&quot;, Desc = &quot;Example switch&quot;, Default = false, Icon = &quot;zap&quot;,\n    Callback = function(enabled) print(&quot;Auto action:&quot;, enabled) end,\n})\ntoggle:Set(true)\n-- toggle:Set() -- invert\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Toggle<\/code><\/td>\n  <td>Nhãn và key lưu ban đầu<\/td>\n<\/tr>\n<tr>\n  <td><code>Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Mô tả tùy chọn<\/td>\n<\/tr>\n<tr>\n  <td><code>Default / Value<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Trạng thái đầu; nên chỉ dùng Default<\/td>\n<\/tr>\n<tr>\n  <td><code>Icon<\/code><\/td>\n  <td>string<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Tên icon tùy chọn<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Khóa tương tác<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(boolean)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Nhận trạng thái mới<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>Set(boolean)<\/code> or <code>Set()<\/code> to invert, <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Callback chạy khi tạo và sau Set; trạng thái đã lưu có thể ghi đè Default. Tránh truyền đồng thời Default=false và Value=true vì biểu thức fallback có thể chọn Value.<\/p>\n"},"plain":{"en":" Toggle\n\nTurn a feature on or off.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal toggle = Tab:Toggle({\n    Title = \"Auto action\", Desc = \"Example switch\", Default = false, Icon = \"zap\",\n    Callback = function(enabled) print(\"Auto action:\", enabled) end,\n})\ntoggle:Set(true)\n-- toggle:Set() -- invert\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Title | string | Toggle | Label and original storage key |\n| Desc | string | nil | Optional description |\n| Default / Value | boolean | false | Initial state; prefer Default alone |\n| Icon | string | nil | Optional icon name |\n| Locked | boolean | false | Disable interaction |\n| Callback | function(boolean) | no-op | Receives new state |\n\n Returned object\n\nSet(boolean) or Set() to invert, SetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Notes\n\nThe callback runs at creation and after Set. A saved state can override Default. Avoid supplying both Default=false and Value=true: the source fallback expression can choose Value.\n","vi":" Toggle\n\nBật hoặc tắt một tính năng.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal toggle = Tab:Toggle({\n    Title = \"Auto action\", Desc = \"Example switch\", Default = false, Icon = \"zap\",\n    Callback = function(enabled) print(\"Auto action:\", enabled) end,\n})\ntoggle:Set(true)\n-- toggle:Set() -- invert\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Title | string | Toggle | Nhãn và key lưu ban đầu |\n| Desc | string | nil | Mô tả tùy chọn |\n| Default / Value | boolean | false | Trạng thái đầu; nên chỉ dùng Default |\n| Icon | string | nil | Tên icon tùy chọn |\n| Locked | boolean | false | Khóa tương tác |\n| Callback | function(boolean) | no-op | Nhận trạng thái mới |\n\n Đối tượng trả về\n\nSet(boolean) or Set() to invert, SetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Lưu ý\n\nCallback chạy khi tạo và sau Set; trạng thái đã lưu có thể ghi đè Default. Tránh truyền đồng thời Default=false và Value=true vì biểu thức fallback có thể chọn Value.\n"}},{"id":"control-slider","num":"26","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Slider","vi":"Slider"},"html":{"en":"<h1>Slider<\/h1>\n<p>Choose a number in a range.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local slider = Tab:Slider({\n    Title = &quot;Speed&quot;, Value = { Min = 0, Max = 100, Default = 25 }, Step = 5,\n    Callback = function(value) print(&quot;Speed:&quot;, value) end,\n})\nslider:Set(40)\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Slider / nil<\/code><\/td>\n  <td>Label and description<\/td>\n<\/tr>\n<tr>\n  <td><code>Value.Min / Max<\/code><\/td>\n  <td>number<\/td>\n  <td><code>0 / 100<\/code><\/td>\n  <td>Range bounds<\/td>\n<\/tr>\n<tr>\n  <td><code>Value.Default<\/code><\/td>\n  <td>number<\/td>\n  <td><code>Min<\/code><\/td>\n  <td>Initial number; top-level Default also supported<\/td>\n<\/tr>\n<tr>\n  <td><code>Step<\/code><\/td>\n  <td>number<\/td>\n  <td><code>1<\/code><\/td>\n  <td>Positive step for updates<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Disable interaction<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(number)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Receives number<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>Set(number)<\/code>, <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Notes<\/h2>\n<p>Values are clamped; invalid/non-positive Step falls back to 1. Callback also runs on creation and Set.<\/p>\n","vi":"<h1>Slider<\/h1>\n<p>Chọn số trong một khoảng.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local slider = Tab:Slider({\n    Title = &quot;Speed&quot;, Value = { Min = 0, Max = 100, Default = 25 }, Step = 5,\n    Callback = function(value) print(&quot;Speed:&quot;, value) end,\n})\nslider:Set(40)\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Slider / nil<\/code><\/td>\n  <td>Nhãn và mô tả<\/td>\n<\/tr>\n<tr>\n  <td><code>Value.Min / Max<\/code><\/td>\n  <td>number<\/td>\n  <td><code>0 / 100<\/code><\/td>\n  <td>Giới hạn khoảng<\/td>\n<\/tr>\n<tr>\n  <td><code>Value.Default<\/code><\/td>\n  <td>number<\/td>\n  <td><code>Min<\/code><\/td>\n  <td>Giá trị đầu; cũng hỗ trợ Default ở ngoài<\/td>\n<\/tr>\n<tr>\n  <td><code>Step<\/code><\/td>\n  <td>number<\/td>\n  <td><code>1<\/code><\/td>\n  <td>Bước dương khi thay đổi<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Khóa tương tác<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(number)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Nhận số<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>Set(number)<\/code>, <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Giá trị được giới hạn trong khoảng; Step không hợp lệ hoặc không dương trở về 1. Callback cũng chạy khi tạo và Set.<\/p>\n"},"plain":{"en":" Slider\n\nChoose a number in a range.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal slider = Tab:Slider({\n    Title = \"Speed\", Value = { Min = 0, Max = 100, Default = 25 }, Step = 5,\n    Callback = function(value) print(\"Speed:\", value) end,\n})\nslider:Set(40)\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Title / Desc | string | Slider / nil | Label and description |\n| Value.Min / Max | number | 0 / 100 | Range bounds |\n| Value.Default | number | Min | Initial number; top-level Default also supported |\n| Step | number | 1 | Positive step for updates |\n| Locked | boolean | false | Disable interaction |\n| Callback | function(number) | no-op | Receives number |\n\n Returned object\n\nSet(number), SetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Notes\n\nValues are clamped; invalid/non-positive Step falls back to 1. Callback also runs on creation and Set.\n","vi":" Slider\n\nChọn số trong một khoảng.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal slider = Tab:Slider({\n    Title = \"Speed\", Value = { Min = 0, Max = 100, Default = 25 }, Step = 5,\n    Callback = function(value) print(\"Speed:\", value) end,\n})\nslider:Set(40)\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Title / Desc | string | Slider / nil | Nhãn và mô tả |\n| Value.Min / Max | number | 0 / 100 | Giới hạn khoảng |\n| Value.Default | number | Min | Giá trị đầu; cũng hỗ trợ Default ở ngoài |\n| Step | number | 1 | Bước dương khi thay đổi |\n| Locked | boolean | false | Khóa tương tác |\n| Callback | function(number) | no-op | Nhận số |\n\n Đối tượng trả về\n\nSet(number), SetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Lưu ý\n\nGiá trị được giới hạn trong khoảng; Step không hợp lệ hoặc không dương trở về 1. Callback cũng chạy khi tạo và Set.\n"}},{"id":"control-input","num":"27","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Input","vi":"Input"},"html":{"en":"<h1>Input<\/h1>\n<p>Accept text, optionally multiline.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local input = Tab:Input({\n    Title = &quot;Nickname&quot;, Placeholder = &quot;Enter a name&quot;, Default = &quot;Guest&quot;,\n    Callback = function(text) print(&quot;Nickname:&quot;, text) end,\n})\ninput:Set(&quot;Player&quot;)\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Input / nil<\/code><\/td>\n  <td>Label and description<\/td>\n<\/tr>\n<tr>\n  <td><code>Placeholder<\/code><\/td>\n  <td>string<\/td>\n  <td><code>empty<\/code><\/td>\n  <td>Hint in text box<\/td>\n<\/tr>\n<tr>\n  <td><code>Default / Value<\/code><\/td>\n  <td>string<\/td>\n  <td><code>empty<\/code><\/td>\n  <td>Initial text<\/td>\n<\/tr>\n<tr>\n  <td><code>ClearTextOnFocus<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Clear when focused<\/td>\n<\/tr>\n<tr>\n  <td><code>MultiLine<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Allow multiple lines<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Disable interaction<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(string)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Receives text<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>Set(text)<\/code>, <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>SetPlaceholder(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Notes<\/h2>\n<p>Callback runs at creation, on focus loss and after Set; it is not an every-keystroke callback.<\/p>\n","vi":"<h1>Input<\/h1>\n<p>Nhận văn bản, có thể nhiều dòng.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local input = Tab:Input({\n    Title = &quot;Nickname&quot;, Placeholder = &quot;Enter a name&quot;, Default = &quot;Guest&quot;,\n    Callback = function(text) print(&quot;Nickname:&quot;, text) end,\n})\ninput:Set(&quot;Player&quot;)\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Input / nil<\/code><\/td>\n  <td>Nhãn và mô tả<\/td>\n<\/tr>\n<tr>\n  <td><code>Placeholder<\/code><\/td>\n  <td>string<\/td>\n  <td><code>empty<\/code><\/td>\n  <td>Gợi ý trong ô nhập<\/td>\n<\/tr>\n<tr>\n  <td><code>Default / Value<\/code><\/td>\n  <td>string<\/td>\n  <td><code>empty<\/code><\/td>\n  <td>Nội dung ban đầu<\/td>\n<\/tr>\n<tr>\n  <td><code>ClearTextOnFocus<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Xóa khi focus<\/td>\n<\/tr>\n<tr>\n  <td><code>MultiLine<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Cho phép nhiều dòng<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Khóa tương tác<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(string)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Nhận chuỗi<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>Set(text)<\/code>, <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>SetPlaceholder(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Callback chạy khi tạo, khi mất focus và sau Set; không chạy theo từng ký tự.<\/p>\n"},"plain":{"en":" Input\n\nAccept text, optionally multiline.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal input = Tab:Input({\n    Title = \"Nickname\", Placeholder = \"Enter a name\", Default = \"Guest\",\n    Callback = function(text) print(\"Nickname:\", text) end,\n})\ninput:Set(\"Player\")\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Title / Desc | string | Input / nil | Label and description |\n| Placeholder | string | empty | Hint in text box |\n| Default / Value | string | empty | Initial text |\n| ClearTextOnFocus | boolean | false | Clear when focused |\n| MultiLine | boolean | false | Allow multiple lines |\n| Locked | boolean | false | Disable interaction |\n| Callback | function(string) | no-op | Receives text |\n\n Returned object\n\nSet(text), SetTitle(text), SetDesc(text), SetPlaceholder(text), Lock(), Unlock(), Destroy()\n\n Notes\n\nCallback runs at creation, on focus loss and after Set; it is not an every-keystroke callback.\n","vi":" Input\n\nNhận văn bản, có thể nhiều dòng.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal input = Tab:Input({\n    Title = \"Nickname\", Placeholder = \"Enter a name\", Default = \"Guest\",\n    Callback = function(text) print(\"Nickname:\", text) end,\n})\ninput:Set(\"Player\")\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Title / Desc | string | Input / nil | Nhãn và mô tả |\n| Placeholder | string | empty | Gợi ý trong ô nhập |\n| Default / Value | string | empty | Nội dung ban đầu |\n| ClearTextOnFocus | boolean | false | Xóa khi focus |\n| MultiLine | boolean | false | Cho phép nhiều dòng |\n| Locked | boolean | false | Khóa tương tác |\n| Callback | function(string) | no-op | Nhận chuỗi |\n\n Đối tượng trả về\n\nSet(text), SetTitle(text), SetDesc(text), SetPlaceholder(text), Lock(), Unlock(), Destroy()\n\n Lưu ý\n\nCallback chạy khi tạo, khi mất focus và sau Set; không chạy theo từng ký tự.\n"}},{"id":"control-dropdown","num":"28","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Dropdown","vi":"Dropdown"},"html":{"en":"<h1>Dropdown<\/h1>\n<p>Pick one or multiple options.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local mode = Tab:Dropdown({\n    Title = &quot;Mode&quot;, Values = {&quot;Normal&quot;, &quot;Fast&quot;}, Value = &quot;Normal&quot;,\n    Callback = function(value) print(&quot;Mode:&quot;, value) end,\n})\nmode:Select(&quot;Fast&quot;)\nlocal colors = Tab:Dropdown({\n    Title = &quot;Colors&quot;, Values = {&quot;Red&quot;, &quot;Blue&quot;, &quot;Green&quot;},\n    Multi = true, AllowNone = true, Value = {&quot;Red&quot;},\n    Callback = function(values) print(&quot;Selected:&quot;, table.concat(values, &quot;, &quot;)) end,\n})\ncolors:Select({&quot;Blue&quot;, &quot;Green&quot;})\n-- mode:Refresh({&quot;Normal&quot;, &quot;Fast&quot;, &quot;Slow&quot;})\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Dropdown / nil<\/code><\/td>\n  <td>Label and description<\/td>\n<\/tr>\n<tr>\n  <td><code>Values<\/code><\/td>\n  <td>array of strings<\/td>\n  <td><code>{}<\/code><\/td>\n  <td>Available items<\/td>\n<\/tr>\n<tr>\n  <td><code>Value / Default<\/code><\/td>\n  <td>string or array<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Initial selection<\/td>\n<\/tr>\n<tr>\n  <td><code>Multi<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Allow multiple selections<\/td>\n<\/tr>\n<tr>\n  <td><code>AllowNone<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Allow no selection<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Disable interaction<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(value)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Single: string or nil; multi: array<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>Select(value)<\/code> (returns selected value or nil), <code>Refresh(values)<\/code> (returns selection), <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Notes<\/h2>\n<p>Callback runs on creation and Select. For multi-select, Select toggles each named item rather than replacing the entire selection. Single AllowNone represents None as an empty string in callbacks; multi receives an array. Refresh resets the selection and saves it but does not call Callback. With multi and AllowNone=false, the first option is used if no initial selection exists.<\/p>\n","vi":"<h1>Dropdown<\/h1>\n<p>Chọn một hoặc nhiều mục.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local mode = Tab:Dropdown({\n    Title = &quot;Mode&quot;, Values = {&quot;Normal&quot;, &quot;Fast&quot;}, Value = &quot;Normal&quot;,\n    Callback = function(value) print(&quot;Mode:&quot;, value) end,\n})\nmode:Select(&quot;Fast&quot;)\nlocal colors = Tab:Dropdown({\n    Title = &quot;Colors&quot;, Values = {&quot;Red&quot;, &quot;Blue&quot;, &quot;Green&quot;},\n    Multi = true, AllowNone = true, Value = {&quot;Red&quot;},\n    Callback = function(values) print(&quot;Selected:&quot;, table.concat(values, &quot;, &quot;)) end,\n})\ncolors:Select({&quot;Blue&quot;, &quot;Green&quot;})\n-- mode:Refresh({&quot;Normal&quot;, &quot;Fast&quot;, &quot;Slow&quot;})\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Dropdown / nil<\/code><\/td>\n  <td>Nhãn và mô tả<\/td>\n<\/tr>\n<tr>\n  <td><code>Values<\/code><\/td>\n  <td>array of strings<\/td>\n  <td><code>{}<\/code><\/td>\n  <td>Danh sách lựa chọn<\/td>\n<\/tr>\n<tr>\n  <td><code>Value / Default<\/code><\/td>\n  <td>string or array<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Lựa chọn ban đầu<\/td>\n<\/tr>\n<tr>\n  <td><code>Multi<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Cho phép chọn nhiều<\/td>\n<\/tr>\n<tr>\n  <td><code>AllowNone<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Cho phép không chọn<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Khóa tương tác<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(value)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Một mục: string hoặc nil; nhiều mục: mảng<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>Select(value)<\/code> (returns selected value or nil), <code>Refresh(values)<\/code> (returns selection), <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Callback chạy khi tạo và Select. Với multi, Select đảo trạng thái từng mục được truyền, không thay toàn bộ lựa chọn. Một lựa chọn với AllowNone biểu diễn None bằng chuỗi rỗng trong callback; multi nhận mảng. Refresh đặt lại lựa chọn và lưu nhưng không gọi Callback. Multi với AllowNone=false chọn mục đầu nếu ban đầu chưa chọn.<\/p>\n"},"plain":{"en":" Dropdown\n\nPick one or multiple options.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal mode = Tab:Dropdown({\n    Title = \"Mode\", Values = {\"Normal\", \"Fast\"}, Value = \"Normal\",\n    Callback = function(value) print(\"Mode:\", value) end,\n})\nmode:Select(\"Fast\")\nlocal colors = Tab:Dropdown({\n    Title = \"Colors\", Values = {\"Red\", \"Blue\", \"Green\"},\n    Multi = true, AllowNone = true, Value = {\"Red\"},\n    Callback = function(values) print(\"Selected:\", table.concat(values, \", \")) end,\n})\ncolors:Select({\"Blue\", \"Green\"})\n-- mode:Refresh({\"Normal\", \"Fast\", \"Slow\"})\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Title / Desc | string | Dropdown / nil | Label and description |\n| Values | array of strings | {} | Available items |\n| Value / Default | string or array | nil | Initial selection |\n| Multi | boolean | false | Allow multiple selections |\n| AllowNone | boolean | false | Allow no selection |\n| Locked | boolean | false | Disable interaction |\n| Callback | function(value) | no-op | Single: string or nil; multi: array |\n\n Returned object\n\nSelect(value) (returns selected value or nil), Refresh(values) (returns selection), SetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Notes\n\nCallback runs on creation and Select. For multi-select, Select toggles each named item rather than replacing the entire selection. Single AllowNone represents None as an empty string in callbacks; multi receives an array. Refresh resets the selection and saves it but does not call Callback. With multi and AllowNone=false, the first option is used if no initial selection exists.\n","vi":" Dropdown\n\nChọn một hoặc nhiều mục.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal mode = Tab:Dropdown({\n    Title = \"Mode\", Values = {\"Normal\", \"Fast\"}, Value = \"Normal\",\n    Callback = function(value) print(\"Mode:\", value) end,\n})\nmode:Select(\"Fast\")\nlocal colors = Tab:Dropdown({\n    Title = \"Colors\", Values = {\"Red\", \"Blue\", \"Green\"},\n    Multi = true, AllowNone = true, Value = {\"Red\"},\n    Callback = function(values) print(\"Selected:\", table.concat(values, \", \")) end,\n})\ncolors:Select({\"Blue\", \"Green\"})\n-- mode:Refresh({\"Normal\", \"Fast\", \"Slow\"})\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Title / Desc | string | Dropdown / nil | Nhãn và mô tả |\n| Values | array of strings | {} | Danh sách lựa chọn |\n| Value / Default | string or array | nil | Lựa chọn ban đầu |\n| Multi | boolean | false | Cho phép chọn nhiều |\n| AllowNone | boolean | false | Cho phép không chọn |\n| Locked | boolean | false | Khóa tương tác |\n| Callback | function(value) | no-op | Một mục: string hoặc nil; nhiều mục: mảng |\n\n Đối tượng trả về\n\nSelect(value) (returns selected value or nil), Refresh(values) (returns selection), SetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Lưu ý\n\nCallback chạy khi tạo và Select. Với multi, Select đảo trạng thái từng mục được truyền, không thay toàn bộ lựa chọn. Một lựa chọn với AllowNone biểu diễn None bằng chuỗi rỗng trong callback; multi nhận mảng. Refresh đặt lại lựa chọn và lưu nhưng không gọi Callback. Multi với AllowNone=false chọn mục đầu nếu ban đầu chưa chọn.\n"}},{"id":"control-colorpicker","num":"29","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Colorpicker","vi":"Colorpicker"},"html":{"en":"<h1>Colorpicker<\/h1>\n<p>Pick and observe a Color3 value.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local color = Tab:Colorpicker({\n    Title = &quot;Accent example&quot;, Default = &quot;#66AAFF&quot;,\n    Callback = function(value) print(&quot;Color:&quot;, value) end,\n})\ncolor:Set(Color3.fromRGB(255, 120, 80))\nprint(color:Get())\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Color / empty<\/code><\/td>\n  <td>Label and description<\/td>\n<\/tr>\n<tr>\n  <td><code>Default / Value<\/code><\/td>\n  <td>Color3, hex string or RGB table<\/td>\n  <td><code>white<\/code><\/td>\n  <td>Initial color<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Disable interaction<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(Color3)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Receives Color3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>Set(value)<\/code>, <code>Get()<\/code> → Color3, <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Notes<\/h2>\n<p>Accepts Color3, <code>#RRGGBB<\/code>, or an RGB table. Invalid input falls back to white. Callback runs on creation and Set; this example does not change the global UI theme.<\/p>\n","vi":"<h1>Colorpicker<\/h1>\n<p>Chọn màu và nhận giá trị Color3.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local color = Tab:Colorpicker({\n    Title = &quot;Accent example&quot;, Default = &quot;#66AAFF&quot;,\n    Callback = function(value) print(&quot;Color:&quot;, value) end,\n})\ncolor:Set(Color3.fromRGB(255, 120, 80))\nprint(color:Get())\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Color / empty<\/code><\/td>\n  <td>Nhãn và mô tả<\/td>\n<\/tr>\n<tr>\n  <td><code>Default / Value<\/code><\/td>\n  <td>Color3, hex string or RGB table<\/td>\n  <td><code>white<\/code><\/td>\n  <td>Màu ban đầu<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Khóa tương tác<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(Color3)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Nhận Color3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>Set(value)<\/code>, <code>Get()<\/code> → Color3, <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Nhận Color3, <code>#RRGGBB<\/code> hoặc bảng RGB. Đầu vào không hợp lệ trở về trắng. Callback chạy khi tạo và Set; ví dụ này không tự đổi theme toàn UI.<\/p>\n"},"plain":{"en":" Colorpicker\n\nPick and obs

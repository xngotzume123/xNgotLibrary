 not undone. The sequence supports registered Toggle/Section and Buttons whose author explicitly sets AIAllowMacro=true. Blocked/sensitive names are filtered on a best-effort basis; callbacks run original code and cannot be guaranteed harmless. Normal single-action Cross controls retain their existing wider support.\n\nOptionally use tạo macro tên: bật Main Auto Farm; tắt Main Auto Farm, chạy macro tên, danh sách macro, or xóa macro tên. These are optional chat requests, not setup needed for ordinary usage. Matching is rule-based and unsupported formats are not executed.\n\n Local character movement\n\nCross or Shell accepts speed 32, reset speed, fly, fly speed 50, disable fly, noclip, disable noclip, or stop movement. Vietnamese equivalents include tốc độ 32, đặt lại tốc độ, bật bay, tốc độ bay 50, tắt bay, bật noclip, tắt noclip and dừng tất cả di chuyển. Starting a feature or changing a speed requires confirmation; stopping does not. Speeds are whole numbers from 4 to 100. Only your own current character is affected; nothing is persisted across sessions, and these are not executable macro steps. AiPermission(\"Body\", false) immediately revokes and stops movement, and Free remains disabled. Movement permission defaults on but every activation requires confirmation.\n\nWhile flying, use the normal movement controls and aim the camera up/down; Space or jump rises, Ctrl/C descends on desktop. Flight is client-side using the local character and may not work with every rig, executor, mobile control scheme, server-authoritative game, or anti-cheat. Stopping flight may cause falling. Noclip tracks original collision values and attempts to restore them when stopped; another script changing the same properties can interfere. Cross stops and cleans up when the character is removed or dies, when Cross is disabled, or when the window is destroyed. Speed restoration is conditional if the game changed it; reapply manually after respawning. Test only where you are permitted to use these capabilities.\n\n Music\n\nExisting Cross music search/play remains unchanged and may use the internet. Favorites and playlists in the integrated engine use downloaded files: favorite gentle song, thêm gentle song vào playlist chill, phát playlist chill, bài tiếp playlist chill, danh sách yêu thích, danh sách playlist, lịch sử nhạc. Disable Music Auto before playlist playback; a local audio asset API is required. Playlist advancement is manual. Cache metadata and history can be incomplete or ambiguous, and requesting playback does not guarantee the client can decode the audio. The player can still independently access network resources.\n\nInternal modules are available through Window.LocalAI; lifecycle cleanup runs with the window. Local JSON is not an encryption or privacy guarantee. Mock tests cannot replace a real Roblox/Delta test.\n","vi":" Cross: tích hợp xử lý offline\n\nNgười dùng chỉ dùng khung chat Cross hiện có trong Dynamic Island, không có tab Local AI mới. Các khả năng V2 chạy phía sau Cross. Đây là xử lý theo luật, không phải LLM: chỉ nhận diện một số mẫu tiếng Việt có/không dấu và tiếng Anh, không hiểu mọi câu tự do. Phần AI không cần model ngoài hay API key. Nhạc online và các chức năng mạng cũ hoạt động riêng.\n\n Dùng hằng ngày\n\nMở Cross như cũ và thử bật Main Auto Farm, giải thích Main Auto Farm, mở tab Main, chẩn đoán hoặc fps ping. Các lệnh control thông thường vẫn dùng Cross cũ và yêu cầu xác nhận. Trả lời có / yes hoặc không / no. Control phải được đăng ký, không bị khóa, không trùng và còn tồn tại; quyền UI và AIControl=false vẫn có hiệu lực. Giải thích dựa trên loại control thực, không đoán công dụng riêng của script. Chẩn đoán chỉ báo tình trạng và lỗi Cross/Local AI quan sát được, không kiểm tra toàn bộ lỗi và không sửa source. FPS/Ping lấy từ số đo sẵn có, không bịa RAM. Cảnh báo kiểm tra mỗi 15 giây, tối đa một lần mỗi phút khi Cross bật.\n\n Tự học và dữ liệu local\n\nCross tự học câu hợp lệ sau xác nhận và sở thích như trước, không cần thêm cài đặt hay giao diện quản lý. File cũ vẫn là xNgotLibrary/AI/xNgotCrossAI_user_<UserId>.json. Engine tích hợp vẫn dùng file riêng xNgotLibrary/AI/LocalAI_v2_user_<UserId>.json cho macro, yêu thích/lịch sử nhạc và dữ liệu V2 trước đó. Cài mới sẽ tự bật lưu local nếu executor hỗ trợ filesystem; lựa chọn bộ nhớ V2 có sẵn vẫn được giữ. File lỗi hoặc bị đổi từ bên ngoài được bảo vệ, không ghi đè. Nếu không lưu được, dữ liệu có thể chỉ tồn tại trong phiên. File là JSON local không mã hóa; bộ lọc không hoàn hảo nên đừng nhập bí mật. Bộ nhớ AI không đồng bộ online. Các câu V2 cũ vẫn được nhận diện nếu không trùng lệnh đã học của Cross.\n\n Shell và phản hồi tiếng Việt\n\nTrong Cross, mở Shell, nhập yêu cầu rồi bấm Gửi hoặc Enter. Shell gọi cùng bộ xử lý với Chat: thao tác được hỗ trợ thực sự chạy sau khi qua cùng bước kiểm tra quyền và xác nhận. Nhật ký có thể cuộn và tự kéo xuống dòng mới nhất khi có hoạt động mới hoặc mở lại Shell. Nhật ký hiển thị tin nhắn, xác nhận đang chờ và lỗi mà Cross thực sự trả lời; không giả lập lệnh hệ điều hành hay báo hoàn thành trước khi có kết quả. Bấm Chat để quay lại. Shell không phải Windows PowerShell và không chạy Lua hay lệnh hệ điều hành tùy ý. Tối đa 80 dòng sau khi xuống dòng được giữ trong phiên và xóa cùng chat Cross/khi đóng. Bộ lọc ẩn bí mật hoặc URL trong nhật ký chỉ là cố gắng, không bảo đảm; không nên nhập bí mật. Chat và Shell dùng chung trợ lý và trạng thái xác nhận.\n\nCross chọn trả lời tiếng Việt hoặc tiếng Anh theo từ nhận diện được trong câu hỏi; hỗ trợ tiếng Việt có/không dấu. Câu ngắn không rõ ngôn ngữ thường giữ ngôn ngữ trước đó. Không phải mọi câu hay lỗi từ callback bên thứ ba đều dịch tự động.\n\n Nhiều thao tác\n\nCó thể nói bật Main Auto Farm rồi tắt Main Auto Farm mà không cần tạo macro trước. Mỗi bước cần xác nhận riêng; nói tạm dừng macro, tiếp tục macro hoặc hủy macro. Các bước đã thực hiện không tự hoàn tác. Chuỗi hỗ trợ Toggle/Section và Button được tác giả cấp AIAllowMacro=true. Tên nhạy cảm được lọc theo danh sách giới hạn; callback chạy code gốc nên không thể bảo đảm an toàn tuyệt đối. Lệnh đơn của Cross vẫn hỗ trợ nhiều loại control hơn.\n\nNếu muốn lưu lại, có thể nói tạo macro tên: bật Main Auto Farm; tắt Main Auto Farm, chạy macro tên, danh sách macro hoặc xóa macro tên. Đây chỉ là lựa chọn qua chat, không phải bước cài đặt khi dùng bình thường. Câu ngoài mẫu có thể không được nhận diện và không được tự chạy.\n\n Di chuyển nhân vật local\n\nNhập trong Cross hoặc Shell: tốc độ 32, đặt lại tốc độ, bật bay, tốc độ bay 50, tắt bay, bật noclip, tắt noclip hoặc dừng tất cả di chuyển. Tiếng Anh có speed 32, reset speed, fly, fly speed 50, disable fly, noclip, disable noclip, stop movement. Bật hoặc thay đổi tốc độ phải xác nhận; lệnh dừng không cần xác nhận. Tốc độ là số nguyên từ 4 đến 100. Chỉ tác động nhân vật hiện tại của bạn; không lưu qua phiên và không đưa các lệnh này vào macro. AiPermission(\"Body\", false) thu hồi quyền và dừng ngay; Free vẫn tắt. Quyền di chuyển mặc định bật nhưng từng lần kích hoạt vẫn cần xác nhận.\n\nKhi bay, dùng điều khiển di chuyển bình thường và hướng camera lên/xuống; Space hoặc nút nhảy để lên, Ctrl/C trên máy tính để xuống. Đây là hiệu ứng phía client, có thể không hoạt động với mọi rig, executor, cách điều khiển mobile, game do server quyết định hoặc anti-cheat. Tắt bay có thể khiến nhân vật rơi. Noclip ghi lại và cố khôi phục va chạm khi dừng; script khác sửa cùng thuộc tính có thể gây xung đột. Cross dừng và dọn khi nhân vật bị xóa/chết, Cross bị tắt hoặc cửa sổ bị đóng. Tốc độ chỉ được khôi phục nếu game chưa đổi giá trị; cần bật lại sau hồi sinh. Chỉ sử dụng tại nơi bạn được phép.\n\n Nhạc\n\nTìm/phát nhạc Cross cũ không thay đổi và có thể dùng mạng. Yêu thích và playlist mới dùng file đã tải: favorite gentle song, thêm gentle song vào playlist chill, phát playlist chill, bài tiếp playlist chill, danh sách yêu thích, danh sách playlist, lịch sử nhạc. Tắt Music Auto trước khi phát playlist; executor cần API nạp audio local. Chuyển bài playlist thủ công. Metadata cache/lịch sử có thể thiếu hoặc trùng; yêu cầu phát không bảo đảm client giải mã được audio. Player cũ vẫn có thể truy cập mạng độc lập.\n\nModule nội bộ vẫn ở Window.LocalAI và được dọn khi đóng cửa sổ. JSON local không phải cơ chế mã hóa. Test mock không thay thế test Roblox/Delta thực tế.\n"}}];

function svgIcon(name){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+(PATHS[name]||PATHS.reference)+'</svg>';}
let language='vi',pageId='start';
const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readRoute(){let parts=location.hash.replace(/^#\/?/,'').split('/');if(['vi','en'].includes(parts[0]))language=parts[0];if(PAGES.some(x=>x.id===parts[1]))pageId=parts[1];}
function route(lang,id){return '#/'+lang+'/'+id;}
function closeMenu(){$('sidebar').classList.remove('open');$('backdrop').classList.remove('open');$('menu').setAttribute('aria-expanded','false');}
function renderNav(){const query=$('search').value.trim().toLocaleLowerCase();let groups=[];PAGES.forEach(p=>{const name=p.title[language],group=p.group[language], searchable=(name+' '+p.plain[language]).toLocaleLowerCase();if(query&&!searchable.includes(query))return;let g=groups.find(x=>x.name===group);if(!g){g={name,items:[]};g.name=group;groups.push(g)}g.items.push(p)});$('nav').innerHTML=groups.length?groups.map(g=>'<div class="group"><div class="group-name">'+escapeHtml(g.name)+'</div>'+g.items.map(p=>'<a class="nav-link '+(p.id===pageId?'active':'')+'" href="'+route(language,p.id)+'" '+(p.id===pageId?'aria-current="page"':'')+'><span class="nav-dot">'+svgIcon(p.id)+'</span><span>'+escapeHtml(p.title[language])+'</span></a>').join('')+'</div>').join(''):'<div class="no-results">'+(language==='vi'?'Không tìm thấy mục phù hợp.':'No matching sections.')+'</div>';}
function hero(){return '<div class="hero"><div class="hero-copy"><div class="hero-kicker">XNGOT LIBRARY &nbsp; / &nbsp; 3.0</div><div class="hero-title">'+(language==='vi'?'Một nền tảng. Mọi ý tưởng.':'One library. Every idea.')+'</div><div class="hero-sub">'+(language==='vi'?'Từ dòng code đầu tiên đến một hub hoàn chỉnh.':'From the first line of code to a complete hub.')+'</div></div><span class="hero-badge">xN</span></div>';}
function render(){readRoute();const p=PAGES.find(x=>x.id===pageId)||PAGES[0];const ix=PAGES.indexOf(p);document.documentElement.lang=language;document.title=p.title[language]+' — xNgot Library';$('language').innerHTML=(language==='vi'?'VI':'EN')+' '+svgIcon('chevron');$('publish-label').textContent=language==='vi'?'Đăng trang':'Publish';$('publish').setAttribute('aria-label',language==='vi'?'Hướng dẫn đăng trang':'Publish documentation');$('help').setAttribute('aria-label',language==='vi'?'Trợ giúp và phím tắt':'Help and shortcuts');$('language').setAttribute('aria-label',language==='vi'?'Chuyển sang tiếng Anh':'Switch to Vietnamese');$('search').placeholder=language==='vi'?'Tìm trong tài liệu...':'Search documentation...';$('sidebar-note').textContent=language==='vi'?'Tài liệu cho bản test trong workspace.':'Docs for the workspace test build.';$('top-current').textContent=p.title[language];$('brand').href=route(language,'start');renderNav();
let prev=ix>0?PAGES[ix-1]:null,next=ix<PAGES.length-1?PAGES[ix+1]:null;
$('article').innerHTML='<div class="breadcrumb"><span>'+escapeHtml(p.group[language])+'</span><span class="slash">/</span><span class="current">'+escapeHtml(p.title[language])+'</span></div><div class="eyebrow"><span></span> '+(language==='vi'?'TÀI LIỆU XNGOT':'XNGOT DOCUMENTATION')+' &nbsp; / &nbsp; '+p.num+'</div>'+(p.id==='start'?p.html[language].replace('</p>','</p>'+hero()):p.html[language])+'<div class="nextprev">'+(prev?'<a href="'+route(language,prev.id)+'"><small>'+svgIcon('arrowleft')+' '+(language==='vi'?'Trước':'Previous')+'</small><strong>'+escapeHtml(prev.title[language])+'</strong></a>':'')+(next?'<a href="'+route(language,next.id)+'"><small>'+(language==='vi'?'Tiếp theo':'Next')+' '+svgIcon('arrowright')+'</small><strong>'+escapeHtml(next.title[language])+'</strong></a>':'')+'</div><div class="article-meta"><span>xNgot Library</span><span>'+(language==='vi'?'Tài liệu song ngữ':'Bilingual documentation')+'</span></div>';
$('article').querySelectorAll('pre').forEach(pre=>{const code=pre.querySelector('code');const lang=(code&&code.className.replace('language-',''))||'text';const wrapper=document.createElement('div');wrapper.className='code-wrap';const head=document.createElement('div');head.className='code-head';const label=document.createElement('span');label.textContent=lang;const button=document.createElement('button');button.className='copy';button.textContent=language==='vi'?'Sao chép':'Copy';button.addEventListener('click',async()=>{let ok=false;try{await navigator.clipboard.writeText(code.textContent);ok=true}catch(e){try{const ta=document.createElement('textarea');ta.value=code.textContent;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}}button.textContent=ok?(language==='vi'?'Đã sao chép':'Copied'):(language==='vi'?'Không thể sao chép':'Copy failed');showToast(ok?'success':'error',ok?(language==='vi'?'Đã sao chép đoạn code':'Code copied'):(language==='vi'?'Không thể sao chép':'Could not copy'),ok?(language==='vi'?'Bạn có thể dán vào executor.':'Ready to paste into your executor.'):(language==='vi'?'Hãy chọn và sao chép thủ công.':'Select and copy the code manually.'));setTimeout(()=>button.textContent=language==='vi'?'Sao chép':'Copy',1800)});head.append(label,button);pre.parentNode.insertBefore(wrapper,pre);wrapper.append(head,pre)});
$('article').querySelectorAll('table').forEach(t=>{let w=document.createElement('div');w.className='table-wrap';t.parentNode.insertBefore(w,t);w.append(t)});
const heads=[...$('article').querySelectorAll('h2')];$('toc').innerHTML='<h2>'+(language==='vi'?'Trong trang này':'On this page')+'</h2>'+heads.map((h,i)=>'<a href="#" data-toc="'+i+'">'+escapeHtml(h.textContent)+'</a>').join('')+'<div class="toc-info">'+(language==='vi'?'Cần xem source?':'Looking for the source?')+'<br><a href="https://github.com/xngotzume123/xNgotLibrary" target="_blank" rel="noopener noreferrer">GitHub repository</a></div>';$('toc').querySelectorAll('[data-toc]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();heads[Number(a.dataset.toc)].scrollIntoView({behavior:'smooth',block:'start'})}));window.scrollTo(0,0);closeMenu();}

let modalReturnFocus=null;
function dismissToast(item){if(!item||item.classList.contains('out'))return;item.classList.add('out');setTimeout(()=>item.remove(),220)}
function showToast(kind,title,detail){const stack=$('toast-stack');while(stack.children.length>=4)stack.firstElementChild.remove();const toast=document.createElement('div');toast.className='toast '+(kind==='error'?'error':'success');toast.setAttribute('role','status');toast.innerHTML='<div class="toast-mark">'+svgIcon(kind==='error'?'troubleshoot':'check')+'</div><div class="toast-copy"><strong>'+escapeHtml(title)+'</strong><span>'+escapeHtml(detail||'')+'</span></div><button class="toast-close" aria-label="Close">'+svgIcon('close')+'</button><div class="toast-bar"></div>';toast.querySelector('button').addEventListener('click',()=>dismissToast(toast));stack.append(toast);setTimeout(()=>dismissToast(toast),4200)}
function openModal(kind){modalReturnFocus=document.activeElement;const isVi=language==='vi',publish=kind==='publish';$('modal-icon').innerHTML=svgIcon(publish?'publish':'help');$('modal-close').innerHTML=svgIcon('close');$('modal-title').textContent=publish?(isVi?'Xuất bản tài liệu':'Publish documentation'):(isVi?'Trợ giúp & phím tắt':'Help & shortcuts');$('modal-sub').textContent=publish?(isVi?'GitHub Pages · 3 bước':'GitHub Pages · 3 steps'):(isVi?'Di chuyển nhanh hơn':'A faster way around');$('modal-body').innerHTML=publish?(isVi?'<ol><li>Thêm <code>docs/index.html</code> và workflow Pages vào repository.</li><li>Push lên nhánh <code>main</code>, rồi chọn <strong>GitHub Actions</strong> trong Settings → Pages.</li><li>Chờ workflow thành công trước khi mở URL trang.</li></ol><p>Trang chỉ là tài liệu; file main phải được cập nhật riêng.</p>':'<ol><li>Add <code>docs/index.html</code> and the Pages workflow to your repository.</li><li>Push to <code>main</code>, then select <strong>GitHub Actions</strong> in Settings → Pages.</li><li>Wait for the workflow to finish before opening the site URL.</li></ol><p>The docs do not update the library file automatically.</p>'):(isVi?'<p><kbd>/</kbd> &nbsp; Tìm trong các mục tài liệu<br><kbd>?</kbd> &nbsp; Mở bảng trợ giúp<br><kbd>Esc</kbd> &nbsp; Đóng bảng hoặc menu</p><p>Chuyển ngôn ngữ ở thanh trên cùng. Dùng nút Copy trong mỗi khối code để sao chép.</p>':'<p><kbd>/</kbd> &nbsp; Search the documentation<br><kbd>?</kbd> &nbsp; Open this help panel<br><kbd>Esc</kbd> &nbsp; Close the panel or menu</p><p>Switch languages in the top bar. Use Copy on any code block to copy it.</p>');$('modal-foot').innerHTML='<button class="modal-action modal-secondary" id="modal-done">'+(isVi?'Đã hiểu':'Got it')+'</button>';if(publish){let btn=document.createElement('button');btn.className='modal-action';btn.textContent=isVi?'Sao chép URL dự kiến':'Copy expected URL';btn.addEventListener('click',async()=>{const url='https://xngotzume123.github.io/xNgotLibrary/';let ok=false;try{await navigator.clipboard.writeText(url);ok=true}catch(e){try{const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}}showToast(ok?'success':'error',ok?(isVi?'Đã sao chép URL':'URL copied'):(isVi?'Không thể sao chép':'Could not copy'),ok?(isVi?'URL chỉ hoạt động sau khi xuất bản.':'URL works after deployment.'):(isVi?'Hãy chép URL trong hướng dẫn.':'Copy the URL from the guide.'))});$('modal-foot').append(btn)}$('modal-done').addEventListener('click',closeModal);$('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false');$('modal-close').focus()}
function closeModal(){if(!$('modal').classList.contains('open'))return;$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true');if(modalReturnFocus&&modalReturnFocus.focus)modalReturnFocus.focus()}
$('publish').addEventListener('click',()=>openModal('publish'));$('help').addEventListener('click',()=>openModal('help'));$('modal-close').addEventListener('click',closeModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});

window.addEventListener('hashchange',render);$('language').addEventListener('click',()=>{const next=language==='vi'?'en':'vi';location.hash=route(next,pageId);showToast('success',next==='vi'?'Đã chuyển sang tiếng Việt':'Switched to English',next==='vi'?'Tất cả mục đã được cập nhật.':'All sections have been updated.');});$('search').addEventListener('input',renderNav);$('menu').addEventListener('click',()=>{let open=$('sidebar').classList.toggle('open');$('backdrop').classList.toggle('open',open);$('menu').setAttribute('aria-expanded',String(open))});$('backdrop').addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('sidebar').classList.add('open');$('backdrop').classList.add('open');$('search').focus()}if(e.key==='?'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();openModal('help')}if(e.key==='Escape'){if($('modal').classList.contains('open'))closeModal();else closeMenu()}if(e.key==='Tab'&&$('modal').classList.contains('open')){let focusable=[...$('modal').querySelectorAll('button,a[href]')].filter(x=>!x.disabled);if(focusable.length){let first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});render();
</script>
</body></html>

 bảng debug bên trong script chưa thể chạy. Dùng bản cập nhật đã được kiểm tra bằng Luau cũ với giới hạn 200 registers. Nếu vẫn lỗi, chụp chính xác thông báo và tên file.<\/p>\n<h2>Không thấy menu hoặc màn hình key<\/h2>\n<ul>\n<li>Kiểm tra <code>xNgotLibraryOnly<\/code>: nếu là <code>true<\/code>, bạn phải tự gọi <code>LIB:CreateWindow(...)<\/code>.<\/li>\n<li>Key đã lưu có thể được kiểm tra tự động. Đặt <code>SaveKey = false<\/code> để test nhập tay.<\/li>\n<li>Màn hình key có thể chờ asset; bản tích hợp có timeout preload.<\/li>\n<li>Đóng màn hình key trước khi xác thực sẽ đóng cửa sổ.<\/li>\n<li>Kiểm tra executor có tạo UI và tải asset Roblox được không; gửi log nếu có.<\/li>\n<\/ul>\n<h2>Provider từ chối key<\/h2>\n<p>Kiểm tra service ID, trạng thái provider, mạng và HTTP của executor. Test cả key đúng và key sai. Tài liệu này chưa xác minh xác thực với tài khoản của bạn.<\/p>\n<h2>Nhạc không phát<\/h2>\n<p>Chạy <code>_G.xNgotMusicDoctor()<\/code> và xem <code>checks<\/code>; kiểm tra thêm file, custom asset và luồng phát thực tế. Một dòng cảnh báo chưa đủ để kết luận nguyên nhân.<\/p>\n"},"plain":{"en":" Troubleshooting\n\n failed to read file\n\nCheck the file is in the executor's workspace, not only the device Downloads folder. The name in readfile(\"main.lua\") must match exactly, including the extension.\n\n Out of local registers ... limit 200\n\nThis is a compile-time error, so in-script debug UI cannot run. Use the updated build, which was checked with an older 200-register Luau compiler. If it persists, capture the exact error and file name.\n\n The menu or key screen does not appear\n\n- Check xNgotLibraryOnly: when true, load the library and call LIB:CreateWindow(...) yourself.\n- A saved key may auto-validate. Set SaveKey = false to test manual entry.\n- The key screen may wait for assets; the integrated build includes a preload timeout.\n- If the user closes the gate before validation, the window is closed.\n- Verify that the executor can create UI and load Roblox assets; share any debug log.\n\n A provider rejects a key\n\nCheck service identifiers, provider status, internet access and executor HTTP support. Test a known valid and invalid key. Provider authentication has not been verified with your account by this documentation build.\n\n Music does not play\n\nRun _G.xNgotMusicDoctor() and inspect checks; also test file access, custom assets and the actual playback flow. A warning alone does not identify the cause.\n","vi":" Xử lý sự cố\n\n failed to read file\n\nKiểm tra file nằm trong workspace của executor, không chỉ trong Downloads. Tên trong readfile(\"main.lua\") phải trùng chính xác, kể cả đuôi file.\n\n Out of local registers ... limit 200\n\nĐây là lỗi biên dịch nên bảng debug bên trong script chưa thể chạy. Dùng bản cập nhật đã được kiểm tra bằng Luau cũ với giới hạn 200 registers. Nếu vẫn lỗi, chụp chính xác thông báo và tên file.\n\n Không thấy menu hoặc màn hình key\n\n- Kiểm tra xNgotLibraryOnly: nếu là true, bạn phải tự gọi LIB:CreateWindow(...).\n- Key đã lưu có thể được kiểm tra tự động. Đặt SaveKey = false để test nhập tay.\n- Màn hình key có thể chờ asset; bản tích hợp có timeout preload.\n- Đóng màn hình key trước khi xác thực sẽ đóng cửa sổ.\n- Kiểm tra executor có tạo UI và tải asset Roblox được không; gửi log nếu có.\n\n Provider từ chối key\n\nKiểm tra service ID, trạng thái provider, mạng và HTTP của executor. Test cả key đúng và key sai. Tài liệu này chưa xác minh xác thực với tài khoản của bạn.\n\n Nhạc không phát\n\nChạy _G.xNgotMusicDoctor() và xem checks; kiểm tra thêm file, custom asset và luồng phát thực tế. Một dòng cảnh báo chưa đủ để kết luận nguyên nhân.\n"}},{"id":"reference","num":"14","group":{"en":"REFERENCE","vi":"THAM KHẢO"},"title":{"en":"API reference","vi":"Tham khảo API"},"html":{"en":"<h1>API reference<\/h1>\n<p>A compact index of the most useful entry points in this build.<\/p>\n<h2>Library and window<\/h2>\n<table>\n<thead>\n<tr>\n  <th>API<\/th>\n  <th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>LIB:CreateWindow(options)<\/code><\/td>\n  <td>Create a window.<\/td>\n<\/tr>\n<tr>\n  <td><code>LIB:Notify(options)<\/code><\/td>\n  <td>Show a notification.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Tab(options)<\/code><\/td>\n  <td>Add a tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Show()<\/code>, <code>Hide()<\/code>, <code>Toggle()<\/code><\/td>\n  <td>Control visibility.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:SelectTab(name)<\/code><\/td>\n  <td>Select a tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Dialog(options)<\/code><\/td>\n  <td>Show a dialog.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:GetDynamicIsland()<\/code><\/td>\n  <td>Return the island API or <code>nil<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:SaveConfig()<\/code>, <code>DeleteConfig()<\/code>, <code>GetConfigPath()<\/code><\/td>\n  <td>Manage configuration.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:ForgetSavedKey()<\/code><\/td>\n  <td>Remove a saved gate key when supported.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Destroy()<\/code><\/td>\n  <td>Destroy the window.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Components<\/h2>\n<p><code>Section<\/code>, <code>Button<\/code>, <code>Toggle<\/code>, <code>Slider<\/code>, <code>Input<\/code>, <code>Dropdown<\/code>, <code>Colorpicker<\/code>, <code>Paragraph<\/code>, <code>Code<\/code>, <code>Discord<\/code> and <code>InfoNguyenNhat<\/code> are created on a tab. Use icon names such as <code>house<\/code>, <code>sparkles<\/code>, <code>music-2<\/code>, <code>key-round<\/code>, <code>settings<\/code> or <code>triangle-alert<\/code>.<\/p>\n<h2>Important globals<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Global<\/th>\n  <th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>getgenv().xNgotLibraryOnly<\/code><\/td>\n  <td>Skip automatic demo startup.<\/td>\n<\/tr>\n<tr>\n  <td><code>getgenv().xNgotLoaderConfig<\/code><\/td>\n  <td>Override bundled demo loader settings before loading.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotMusicConfig<\/code><\/td>\n  <td>Music config API.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotMusicDoctor()<\/code><\/td>\n  <td>Return music diagnostics.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotStudio<\/code><\/td>\n  <td>Demo boot state, when started.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Credits<\/h2>\n<p>xNgot Library: Nguyễn Minh Nhật (xNgot Zume). Key-system interface and engine: <a href=\"https://github.com/snowdevlol/OphynUI\">Ophyn UI<\/a>. Window UI originates from <a href=\"https://github.com/Footagesus/WindUI\">Wind UI<\/a>.<\/p>\n","vi":"<h1>Tham khảo API<\/h1>\n<p>Danh mục nhanh các điểm gọi thường dùng trong bản này.<\/p>\n<h2>Library và cửa sổ<\/h2>\n<table>\n<thead>\n<tr>\n  <th>API<\/th>\n  <th>Công dụng<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>LIB:CreateWindow(options)<\/code><\/td>\n  <td>Tạo cửa sổ.<\/td>\n<\/tr>\n<tr>\n  <td><code>LIB:Notify(options)<\/code><\/td>\n  <td>Hiện thông báo.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Tab(options)<\/code><\/td>\n  <td>Thêm tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Show()<\/code>, <code>Hide()<\/code>, <code>Toggle()<\/code><\/td>\n  <td>Điều khiển hiển thị.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:SelectTab(name)<\/code><\/td>\n  <td>Chọn tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Dialog(options)<\/code><\/td>\n  <td>Hiện hộp thoại.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:GetDynamicIsland()<\/code><\/td>\n  <td>Trả về API island hoặc <code>nil<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:SaveConfig()<\/code>, <code>DeleteConfig()<\/code>, <code>GetConfigPath()<\/code><\/td>\n  <td>Quản lý cấu hình.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:ForgetSavedKey()<\/code><\/td>\n  <td>Xóa key đã lưu nếu executor hỗ trợ.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Destroy()<\/code><\/td>\n  <td>Đóng cửa sổ.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Thành phần<\/h2>\n<p>Tạo <code>Section<\/code>, <code>Button<\/code>, <code>Toggle<\/code>, <code>Slider<\/code>, <code>Input<\/code>, <code>Dropdown<\/code>, <code>Colorpicker<\/code>, <code>Paragraph<\/code>, <code>Code<\/code>, <code>Discord<\/code> và <code>InfoNguyenNhat<\/code> trên tab. Ví dụ tên icon: <code>house<\/code>, <code>sparkles<\/code>, <code>music-2<\/code>, <code>key-round<\/code>, <code>settings<\/code>, <code>triangle-alert<\/code>.<\/p>\n<h2>Global quan trọng<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Global<\/th>\n  <th>Công dụng<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>getgenv().xNgotLibraryOnly<\/code><\/td>\n  <td>Bỏ tự mở demo.<\/td>\n<\/tr>\n<tr>\n  <td><code>getgenv().xNgotLoaderConfig<\/code><\/td>\n  <td>Ghi đè cài đặt loader demo trước khi nạp.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotMusicConfig<\/code><\/td>\n  <td>API cấu hình nhạc.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotMusicDoctor()<\/code><\/td>\n  <td>Trả về chẩn đoán nhạc.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotStudio<\/code><\/td>\n  <td>Trạng thái khởi động demo, nếu đã chạy.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Credit<\/h2>\n<p>xNgot Library: Nguyễn Minh Nhật (xNgot Zume). Giao diện và engine key: <a href=\"https://github.com/snowdevlol/OphynUI\">Ophyn UI<\/a>. UI cửa sổ phát triển từ <a href=\"https://github.com/Footagesus/WindUI\">Wind UI<\/a>.<\/p>\n"},"plain":{"en":" API reference\n\nA compact index of the most useful entry points in this build.\n\n Library and window\n\n| API | Purpose |\n| --- | --- |\n| LIB:CreateWindow(options) | Create a window. |\n| LIB:Notify(options) | Show a notification. |\n| Window:Tab(options) | Add a tab. |\n| Window:Show(), Hide(), Toggle() | Control visibility. |\n| Window:SelectTab(name) | Select a tab. |\n| Window:Dialog(options) | Show a dialog. |\n| Window:GetDynamicIsland() | Return the island API or nil. |\n| Window:SaveConfig(), DeleteConfig(), GetConfigPath() | Manage configuration. |\n| Window:ForgetSavedKey() | Remove a saved gate key when supported. |\n| Window:Destroy() | Destroy the window. |\n\n Components\n\nSection, Button, Toggle, Slider, Input, Dropdown, Colorpicker, Paragraph, Code, Discord and InfoNguyenNhat are created on a tab. Use icon names such as house, sparkles, music-2, key-round, settings or triangle-alert.\n\n Important globals\n\n| Global | Use |\n| --- | --- |\n| getgenv().xNgotLibraryOnly | Skip automatic demo startup. |\n| getgenv().xNgotLoaderConfig | Override bundled demo loader settings before loading. |\n| _G.xNgotMusicConfig | Music config API. |\n| _G.xNgotMusicDoctor() | Return music diagnostics. |\n| _G.xNgotStudio | Demo boot state, when started. |\n\n Credits\n\nxNgot Library: Nguyễn Minh Nhật (xNgot Zume). Key-system interface and engine: [Ophyn UI](https://github.com/snowdevlol/OphynUI). Window UI originates from [Wind UI](https://github.com/Footagesus/WindUI).\n","vi":" Tham khảo API\n\nDanh mục nhanh các điểm gọi thường dùng trong bản này.\n\n Library và cửa sổ\n\n| API | Công dụng |\n| --- | --- |\n| LIB:CreateWindow(options) | Tạo cửa sổ. |\n| LIB:Notify(options) | Hiện thông báo. |\n| Window:Tab(options) | Thêm tab. |\n| Window:Show(), Hide(), Toggle() | Điều khiển hiển thị. |\n| Window:SelectTab(name) | Chọn tab. |\n| Window:Dialog(options) | Hiện hộp thoại. |\n| Window:GetDynamicIsland() | Trả về API island hoặc nil. |\n| Window:SaveConfig(), DeleteConfig(), GetConfigPath() | Quản lý cấu hình. |\n| Window:ForgetSavedKey() | Xóa key đã lưu nếu executor hỗ trợ. |\n| Window:Destroy() | Đóng cửa sổ. |\n\n Thành phần\n\nTạo Section, Button, Toggle, Slider, Input, Dropdown, Colorpicker, Paragraph, Code, Discord và InfoNguyenNhat trên tab. Ví dụ tên icon: house, sparkles, music-2, key-round, settings, triangle-alert.\n\n Global quan trọng\n\n| Global | Công dụng |\n| --- | --- |\n| getgenv().xNgotLibraryOnly | Bỏ tự mở demo. |\n| getgenv().xNgotLoaderConfig | Ghi đè cài đặt loader demo trước khi nạp. |\n| _G.xNgotMusicConfig | API cấu hình nhạc. |\n| _G.xNgotMusicDoctor() | Trả về chẩn đoán nhạc. |\n| _G.xNgotStudio | Trạng thái khởi động demo, nếu đã chạy. |\n\n Credit\n\nxNgot Library: Nguyễn Minh Nhật (xNgot Zume). Giao diện và engine key: [Ophyn UI](https://github.com/snowdevlol/OphynUI). UI cửa sổ phát triển từ [Wind UI](https://github.com/Footagesus/WindUI).\n"}}];

function svgIcon(name){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+(PATHS[name]||PATHS.reference)+'</svg>';}
let language='vi',pageId='start';
const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readRoute(){let parts=location.hash.replace(/^#\/?/,'').split('/');if(['vi','en'].includes(parts[0]))language=parts[0];if(PAGES.some(x=>x.id===parts[1]))pageId=parts[1];}
function route(lang,id){return '#/'+lang+'/'+id;}
function closeMenu(){$('sidebar').classList.remove('open');$('backdrop').classList.remove('open');$('menu').setAttribute('aria-expanded','false');}
function renderNav(){const query=$('search').value.trim().toLocaleLowerCase();let groups=[];PAGES.forEach(p=>{const name=p.title[language],group=p.group[language], searchable=(name+' '+p.plain[language]).toLocaleLowerCase();if(query&&!searchable.includes(query))return;let g=groups.find(x=>x.name===group);if(!g){g={name,items:[]};g.name=group;groups.push(g)}g.items.push(p)});$('nav').innerHTML=groups.length?groups.map(g=>'<div class="group"><div class="group-name">'+escapeHtml(g.name)+'</div>'+g.items.map(p=>'<a class="nav-link '+(p.id===pageId?'active':'')+'" href="'+route(language,p.id)+'" '+(p.id===pageId?'aria-current="page"':'')+'><span class="nav-dot">'+svgIcon(p.id)+'</span><span>'+escapeHtml(p.title[language])+'</span></a>').join('')+'</div>').join(''):'<div class="no-results">'+(language==='vi'?'Không tìm thấy mục phù hợp.':'No matching sections.')+'</div>';}
function hero(){return '<div class="hero"><div class="hero-copy"><div class="hero-kicker">XNGOT LIBRARY &nbsp; / &nbsp; 3.0</div><div class="hero-title">'+(language==='vi'?'Một nền tảng. Mọi ý tưởng.':'One library. Every idea.')+'</div><div class="hero-sub">'+(language==='vi'?'Từ dòng code đầu tiên đến một hub hoàn chỉnh.':'From the first line of code to a complete hub.')+'</div></div><span class="hero-badge">xN</span></div>';}
function render(){readRoute();const p=PAGES.find(x=>x.id===pageId)||PAGES[0];const ix=PAGES.indexOf(p);document.documentElement.lang=language;document.title=p.title[language]+' — xNgot Library';$('language').innerHTML=(language==='vi'?'VI':'EN')+' '+svgIcon('chevron');$('publish-label').textContent=language==='vi'?'Đăng trang':'Publish';$('publish').setAttribute('aria-label',language==='vi'?'Hướng dẫn đăng trang':'Publish documentation');$('help').setAttribute('aria-label',language==='vi'?'Trợ giúp và phím tắt':'Help and shortcuts');$('language').setAttribute('aria-label',language==='vi'?'Chuyển sang tiếng Anh':'Switch to Vietnamese');$('search').placeholder=language==='vi'?'Tìm trong tài liệu...':'Search documentation...';$('sidebar-note').textContent=language==='vi'?'Tài liệu cho bản test trong workspace.':'Docs for the workspace test build.';$('top-current').textContent=p.title[language];$('brand').href=route(language,'start');renderNav();
let prev=ix>0?PAGES[ix-1]:null,next=ix<PAGES.length-1?PAGES[ix+1]:null;
$('article').innerHTML='<div class="breadcrumb"><span>'+escapeHtml(p.group[language])+'</span><span class="slash">/</span><span class="current">'+escapeHtml(p.title[language])+'</span></div><div class="eyebrow"><span></span> '+(language==='vi'?'TÀI LIỆU XNGOT':'XNGOT DOCUMENTATION')+' &nbsp; / &nbsp; '+p.num+'</div>'+(p.id==='start'?p.html[language].replace('</p>','</p>'+hero()):p.html[language])+'<div class="nextprev">'+(prev?'<a href="'+route(language,prev.id)+'"><small>'+svgIcon('arrowleft')+' '+(language==='vi'?'Trước':'Previous')+'</small><strong>'+escapeHtml(prev.title[language])+'</strong></a>':'')+(next?'<a href="'+route(language,next.id)+'"><small>'+(language==='vi'?'Tiếp theo':'Next')+' '+svgIcon('arrowright')+'</small><strong>'+escapeHtml(next.title[language])+'</strong></a>':'')+'</div><div class="article-meta"><span>xNgot Library</span><span>'+(language==='vi'?'Tài liệu song ngữ':'Bilingual documentation')+'</span></div>';
$('article').querySelectorAll('pre').forEach(pre=>{const code=pre.querySelector('code');const lang=(code&&code.className.replace('language-',''))||'text';const wrapper=document.createElement('div');wrapper.className='code-wrap';const head=document.createElement('div');head.className='code-head';const label=document.createElement('span');label.textContent=lang;const button=document.createElement('button');button.className='copy';button.textContent=language==='vi'?'Sao chép':'Copy';button.addEventListener('click',async()=>{let ok=false;try{await navigator.clipboard.writeText(code.textContent);ok=true}catch(e){try{const ta=document.createElement('textarea');ta.value=code.textContent;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}}button.textContent=ok?(language==='vi'?'Đã sao chép':'Copied'):(language==='vi'?'Không thể sao chép':'Copy failed');showToast(ok?'success':'error',ok?(language==='vi'?'Đã sao chép đoạn code':'Code copied'):(language==='vi'?'Không thể sao chép':'Could not copy'),ok?(language==='vi'?'Bạn có thể dán vào executor.':'Ready to paste into your executor.'):(language==='vi'?'Hãy chọn và sao chép thủ công.':'Select and copy the code manually.'));setTimeout(()=>button.textContent=language==='vi'?'Sao chép':'Copy',1800)});head.append(label,button);pre.parentNode.insertBefore(wrapper,pre);wrapper.append(head,pre)});
$('article').querySelectorAll('table').forEach(t=>{let w=document.createElement('div');w.className='table-wrap';t.parentNode.insertBefore(w,t);w.append(t)});
const heads=[...$('article').querySelectorAll('h2')];$('toc').innerHTML='<h2>'+(language==='vi'?'Trong trang này':'On this page')+'</h2>'+heads.map((h,i)=>'<a href="#" data-toc="'+i+'">'+escapeHtml(h.textContent)+'</a>').join('')+'<div class="toc-info">'+(language==='vi'?'Cần xem source?':'Looking for the source?')+'<br><a href="https://github.com/xngotzume123/xNgotLibrary" target="_blank" rel="noopener noreferrer">GitHub repository</a></div>';$('toc').querySelectorAll('[data-toc]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();heads[Number(a.dataset.toc)].scrollIntoView({behavior:'smooth',block:'start'})}));window.scrollTo(0,0);closeMenu();}

let modalReturnFocus=null;
function dismissToast(item){if(!item||item.classList.contains('out'))return;item.classList.add('out');setTimeout(()=>item.remove(),220)}
function showToast(kind,title,detail){const stack=$('toast-stack');while(stack.children.length>=4)stack.firstElementChild.remove();const toast=document.createElement('div');toast.className='toast '+(kind==='error'?'error':'success');toast.setAttribute('role','status');toast.innerHTML='<div class="toast-mark">'+svgIcon(kind==='error'?'troubleshoot':'check')+'</div><div class="toast-copy"><strong>'+escapeHtml(title)+'</strong><span>'+escapeHtml(detail||'')+'</span></div><button class="toast-close" aria-label="Close">'+svgIcon('close')+'</button><div class="toast-bar"></div>';toast.querySelector('button').addEventListener('click',()=>dismissToast(toast));stack.append(toast);setTimeout(()=>dismissToast(toast),4200)}
function openModal(kind){modalReturnFocus=document.activeElement;const isVi=language==='vi',publish=kind==='publish';$('modal-icon').innerHTML=svgIcon(publish?'publish':'help');$('modal-close').innerHTML=svgIcon('close');$('modal-title').textContent=publish?(isVi?'Xuất bản tài liệu':'Publish documentation'):(isVi?'Trợ giúp & phím tắt':'Help & shortcuts');$('modal-sub').textContent=publish?(isVi?'GitHub Pages · 3 bước':'GitHub Pages · 3 steps'):(isVi?'Di chuyển nhanh hơn':'A faster way around');$('modal-body').innerHTML=publish?(isVi?'<ol><li>Thêm <code>docs/index.html</code> và workflow Pages vào repository.</li><li>Push lên nhánh <code>main</code>, rồi chọn <strong>GitHub Actions</strong> trong Settings → Pages.</li><li>Chờ workflow thành công trước khi mở URL trang.</li></ol><p>Trang chỉ là tài liệu; file main phải được cập nhật riêng.</p>':'<ol><li>Add <code>docs/index.html</code> and the Pages workflow to your repository.</li><li>Push to <code>main</code>, then select <strong>GitHub Actions</strong> in Settings → Pages.</li><li>Wait for the workflow to finish before opening the site URL.</li></ol><p>The docs do not update the library file automatically.</p>'):(isVi?'<p><kbd>/</kbd> &nbsp; Tìm trong các mục tài liệu<br><kbd>?</kbd> &nbsp; Mở bảng trợ giúp<br><kbd>Esc</kbd> &nbsp; Đóng bảng hoặc menu</p><p>Chuyển ngôn ngữ ở thanh trên cùng. Dùng nút Copy trong mỗi khối code để sao chép.</p>':'<p><kbd>/</kbd> &nbsp; Search the documentation<br><kbd>?</kbd> &nbsp; Open this help panel<br><kbd>Esc</kbd> &nbsp; Close the panel or menu</p><p>Switch languages in the top bar. Use Copy on any code block to copy it.</p>');$('modal-foot').innerHTML='<button class="modal-action modal-secondary" id="modal-done">'+(isVi?'Đã hiểu':'Got it')+'</button>';if(publish){let btn=document.createElement('button');btn.className='modal-action';btn.textContent=isVi?'Sao chép URL dự kiến':'Copy expected URL';btn.addEventListener('click',async()=>{const url='https://xngotzume123.github.io/xNgotLibrary/';let ok=false;try{await navigator.clipboard.writeText(url);ok=true}catch(e){try{const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}}showToast(ok?'success':'error',ok?(isVi?'Đã sao chép URL':'URL copied'):(isVi?'Không thể sao chép':'Could not copy'),ok?(isVi?'URL chỉ hoạt động sau khi xuất bản.':'URL works after deployment.'):(isVi?'Hãy chép URL trong hướng dẫn.':'Copy the URL from the guide.'))});$('modal-foot').append(btn)}$('modal-done').addEventListener('click',closeModal);$('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false');$('modal-close').focus()}
function closeModal(){if(!$('modal').classList.contains('open'))return;$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true');if(modalReturnFocus&&modalReturnFocus.focus)modalReturnFocus.focus()}

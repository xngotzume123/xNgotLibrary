2,\n}, true)\nWindow:ApplyUIPreset(\"Midnight\", true)\nWindow:SaveUIProfile(\"My theme\")\n\n\nUse GetUISettings, GetUIPresets, UseOriginalUI, ExportUISettings, ImportUISettings, LoadUIProfile and DeleteUIProfile to manage appearance. The gate reads saved xNgot theme settings when it starts; selecting an independent Ophyn theme can override that synchronization.\n\n Configuration files\n\nlua\nprint(Window:GetConfigPath())\nWindow:SaveConfig()\n-- Window:DeleteConfig() -- deletes saved UI/component settings\n\n\nThe configuration is grouped by tab and component titles. Changing a title changes the associated key. Saving depends on executor file APIs; the key file is separate from the window configuration.\n","vi":" Giao diện và lưu trữ\n\nNgười dùng có thể đổi giao diện trong Settings UI, hoặc script điều khiển theme và profile.\n\nlua\nWindow:SetUISettings({\n    AccentColor = Color3.fromRGB(10, 135, 213),\n    CornerRadius = 12,\n}, true)\nWindow:ApplyUIPreset(\"Midnight\", true)\nWindow:SaveUIProfile(\"My theme\")\n\n\nDùng GetUISettings, GetUIPresets, UseOriginalUI, ExportUISettings, ImportUISettings, LoadUIProfile và DeleteUIProfile để quản lý giao diện. Màn hình key đọc theme xNgot đã lưu khi khởi động; theme Ophyn riêng có thể ghi đè chế độ đồng bộ.\n\n File cấu hình\n\nlua\nprint(Window:GetConfigPath())\nWindow:SaveConfig()\n-- Window:DeleteConfig() -- xóa cấu hình UI/thành phần đã lưu\n\n\nCấu hình được nhóm theo Title của tab và thành phần. Đổi tên sẽ đổi khóa lưu tương ứng. Việc lưu phụ thuộc API file của executor; file key là file riêng với cấu hình cửa sổ.\n"}},{"id":"troubleshoot","num":"13","group":{"en":"REFERENCE","vi":"THAM KHẢO"},"title":{"en":"Troubleshooting","vi":"Xử lý sự cố"},"html":{"en":"<h1>Troubleshooting<\/h1>\n<h2><code>failed to read file<\/code><\/h2>\n<p>Check the file is in the executor's <strong>workspace<\/strong>, not only the device Downloads folder. The name in <code>readfile(&quot;main.lua&quot;)<\/code> must match exactly, including the extension.<\/p>\n<h2><code>Out of local registers ... limit 200<\/code><\/h2>\n<p>This is a compile-time error, so in-script debug UI cannot run. Use the updated build, which was checked with an older 200-register Luau compiler. If it persists, capture the exact error and file name.<\/p>\n<h2>The menu or key screen does not appear<\/h2>\n<ul>\n<li>Check <code>xNgotLibraryOnly<\/code>: when <code>true<\/code>, load the library and call <code>LIB:CreateWindow(...)<\/code> yourself.<\/li>\n<li>A saved key may auto-validate. Set <code>SaveKey = false<\/code> to test manual entry.<\/li>\n<li>The key screen may wait for assets; the integrated build includes a preload timeout.<\/li>\n<li>If the user closes the gate before validation, the window is closed.<\/li>\n<li>Verify that the executor can create UI and load Roblox assets; share any debug log.<\/li>\n<\/ul>\n<h2>A provider rejects a key<\/h2>\n<p>Check service identifiers, provider status, internet access and executor HTTP support. Test a known valid and invalid key. Provider authentication has not been verified with your account by this documentation build.<\/p>\n<h2>Music does not play<\/h2>\n<p>Run <code>_G.xNgotMusicDoctor()<\/code> and inspect <code>checks<\/code>; also test file access, custom assets and the actual playback flow. A warning alone does not identify the cause.<\/p>\n","vi":"<h1>Xử lý sự cố<\/h1>\n<h2><code>failed to read file<\/code><\/h2>\n<p>Kiểm tra file nằm trong <strong>workspace của executor<\/strong>, không chỉ trong Downloads. Tên trong <code>readfile(&quot;main.lua&quot;)<\/code> phải trùng chính xác, kể cả đuôi file.<\/p>\n<h2><code>Out of local registers ... limit 200<\/code><\/h2>\n<p>Đây là lỗi biên dịch nên bảng debug bên trong script chưa thể chạy. Dùng bản cập nhật đã được kiểm tra bằng Luau cũ với giới hạn 200 registers. Nếu vẫn lỗi, chụp chính xác thông báo và tên file.<\/p>\n<h2>Không thấy menu hoặc màn hình key<\/h2>\n<ul>\n<li>Kiểm tra <code>xNgotLibraryOnly<\/code>: nếu là <code>true<\/code>, bạn phải tự gọi <code>LIB:CreateWindow(...)<\/code>.<\/li>\n<li>Key đã lưu có thể được kiểm tra tự động. Đặt <code>SaveKey = false<\/code> để test nhập tay.<\/li>\n<li>Màn hình key có thể chờ asset; bản tích hợp có timeout preload.<\/li>\n<li>Đóng màn hình key trước khi xác thực sẽ đóng cửa sổ.<\/li>\n<li>Kiểm tra executor có tạo UI và tải asset Roblox được không; gửi log nếu có.<\/li>\n<\/ul>\n<h2>Provider từ chối key<\/h2>\n<p>Kiểm tra service ID, trạng thái provider, mạng và HTTP của executor. Test cả key đúng và key sai. Tài liệu này chưa xác minh xác thực với tài khoản của bạn.<\/p>\n<h2>Nhạc không phát<\/h2>\n<p>Chạy <code>_G.xNgotMusicDoctor()<\/code> và xem <code>checks<\/code>; kiểm tra thêm file, custom asset và luồng phát thực tế. Một dòng cảnh báo chưa đủ để kết luận nguyên nhân.<\/p>\n"},"plain":{"en":" Troubleshooting\n\n failed to read file\n\nCheck the file is in the executor's workspace, not only the device Downloads folder. The name in readfile(\"main.lua\") must match exactly, including the extension.\n\n Out of local registers ... limit 200\n\nThis is a compile-time error, so in-script debug UI cannot run. Use the updated build, which was checked with an older 200-register Luau compiler. If it persists, capture the exact error and file name.\n\n The menu or key screen does not appear\n\n- Check xNgotLibraryOnly: when true, load the library and call LIB:CreateWindow(...) yourself.\n- A saved key may auto-validate. Set SaveKey = false to test manual entry.\n- The key screen may wait for assets; the integrated build includes a preload timeout.\n- If the user closes the gate before validation, the window is closed.\n- Verify that the executor can create UI and load Roblox assets; share any debug log.\n\n A provider rejects a key\n\nCheck service identifiers, provider status, internet access and executor HTTP support. Test a known valid and invalid key. Provider authentication has not been verified with your account by this documentation build.\n\n Music does not play\n\nRun _G.xNgotMusicDoctor() and inspect checks; also test file access, custom assets and the actual playback flow. A warning alone does not identify the cause.\n","vi":" Xử lý sự cố\n\n failed to read file\n\nKiểm tra file nằm trong workspace của executor, không chỉ trong Downloads. Tên trong readfile(\"main.lua\") phải trùng chính xác, kể cả đuôi file.\n\n Out of local registers ... limit 200\n\nĐây là lỗi biên dịch nên bảng debug bên trong script chưa thể chạy. Dùng bản cập nhật đã được kiểm tra bằng Luau cũ với giới hạn 200 registers. Nếu vẫn lỗi, chụp chính xác thông báo và tên file.\n\n Không thấy menu hoặc màn hình key\n\n- Kiểm tra xNgotLibraryOnly: nếu là true, bạn phải tự gọi LIB:CreateWindow(...).\n- Key đã lưu có thể được kiểm tra tự động. Đặt SaveKey = false để test nhập tay.\n- Màn hình key có thể chờ asset; bản tích hợp có timeout preload.\n- Đóng màn hình key trước khi xác thực sẽ đóng cửa sổ.\n- Kiểm tra executor có tạo UI và tải asset Roblox được không; gửi log nếu có.\n\n Provider từ chối key\n\nKiểm tra service ID, trạng thái provider, mạng và HTTP của executor. Test cả key đúng và key sai. Tài liệu này chưa xác minh xác thực với tài khoản của bạn.\n\n Nhạc không phát\n\nChạy _G.xNgotMusicDoctor() và xem checks; kiểm tra thêm file, custom asset và luồng phát thực tế. Một dòng cảnh báo chưa đủ để kết luận nguyên nhân.\n"}},{"id":"reference","num":"14","group":{"en":"REFERENCE","vi":"THAM KHẢO"},"title":{"en":"API reference","vi":"Tham khảo API"},"html":{"en":"<h1>API reference<\/h1>\n<p>A compact index of the most useful entry points in this build.<\/p>\n<h2>Library and window<\/h2>\n<table>\n<thead>\n<tr>\n  <th>API<\/th>\n  <th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>LIB:CreateWindow(options)<\/code><\/td>\n  <td>Create a window.<\/td>\n<\/tr>\n<tr>\n  <td><code>LIB:Notify(options)<\/code><\/td>\n  <td>Show a notification.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Tab(options)<\/code><\/td>\n  <td>Add a tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Show()<\/code>, <code>Hide()<\/code>, <code>Toggle()<\/code><\/td>\n  <td>Control visibility.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:SelectTab(name)<\/code><\/td>\n  <td>Select a tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Dialog(options)<\/code><\/td>\n  <td>Show a dialog.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:GetDynamicIsland()<\/code><\/td>\n  <td>Return the island API or <code>nil<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:SaveConfig()<\/code>, <code>DeleteConfig()<\/code>, <code>GetConfigPath()<\/code><\/td>\n  <td>Manage configuration.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:ForgetSavedKey()<\/code><\/td>\n  <td>Remove a saved gate key when supported.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Destroy()<\/code><\/td>\n  <td>Destroy the window.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Components<\/h2>\n<p><code>Section<\/code>, <code>Button<\/code>, <code>Toggle<\/code>, <code>Slider<\/code>, <code>Input<\/code>, <code>Dropdown<\/code>, <code>Colorpicker<\/code>, <code>Paragraph<\/code>, <code>Code<\/code>, <code>Discord<\/code> and <code>InfoNguyenNhat<\/code> are created on a tab. Use icon names such as <code>house<\/code>, <code>sparkles<\/code>, <code>music-2<\/code>, <code>key-round<\/code>, <code>settings<\/code> or <code>triangle-alert<\/code>.<\/p>\n<h2>Important globals<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Global<\/th>\n  <th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>getgenv().xNgotLibraryOnly<\/code><\/td>\n  <td>Skip automatic demo startup.<\/td>\n<\/tr>\n<tr>\n  <td><code>getgenv().xNgotLoaderConfig<\/code><\/td>\n  <td>Override bundled demo loader settings before loading.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotMusicConfig<\/code><\/td>\n  <td>Music config API.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotMusicDoctor()<\/code><\/td>\n  <td>Return music diagnostics.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotStudio<\/code><\/td>\n  <td>Demo boot state, when started.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Credits<\/h2>\n<p>xNgot Library: Nguyễn Minh Nhật (xNgot Zume). Key-system interface and engine: <a href=\"https://github.com/snowdevlol/OphynUI\">Ophyn UI<\/a>. Window UI originates from <a href=\"https://github.com/Footagesus/WindUI\">Wind UI<\/a>.<\/p>\n","vi":"<h1>Tham khảo API<\/h1>\n<p>Danh mục nhanh các điểm gọi thường dùng trong bản này.<\/p>\n<h2>Library và cửa sổ<\/h2>\n<table>\n<thead>\n<tr>\n  <th>API<\/th>\n  <th>Công dụng<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>LIB:CreateWindow(options)<\/code><\/td>\n  <td>Tạo cửa sổ.<\/td>\n<\/tr>\n<tr>\n  <td><code>LIB:Notify(options)<\/code><\/td>\n  <td>Hiện thông báo.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Tab(options)<\/code><\/td>\n  <td>Thêm tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Show()<\/code>, <code>Hide()<\/code>, <code>Toggle()<\/code><\/td>\n  <td>Điều khiển hiển thị.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:SelectTab(name)<\/code><\/td>\n  <td>Chọn tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Dialog(options)<\/code><\/td>\n  <td>Hiện hộp thoại.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:GetDynamicIsland()<\/code><\/td>\n  <td>Trả về API island hoặc <code>nil<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:SaveConfig()<\/code>, <code>DeleteConfig()<\/code>, <code>GetConfigPath()<\/code><\/td>\n  <td>Quản lý cấu hình.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:ForgetSavedKey()<\/code><\/td>\n  <td>Xóa key đã lưu nếu executor hỗ trợ.<\/td>\n<\/tr>\n<tr>\n  <td><code>Window:Destroy()<\/code><\/td>\n  <td>Đóng cửa sổ.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Thành phần<\/h2>\n<p>Tạo <code>Section<\/code>, <code>Button<\/code>, <code>Toggle<\/code>, <code>Slider<\/code>, <code>Input<\/code>, <code>Dropdown<\/code>, <code>Colorpicker<\/code>, <code>Paragraph<\/code>, <code>Code<\/code>, <code>Discord<\/code> và <code>InfoNguyenNhat<\/code> trên tab. Ví dụ tên icon: <code>house<\/code>, <code>sparkles<\/code>, <code>music-2<\/code>, <code>key-round<\/code>, <code>settings<\/code>, <code>triangle-alert<\/code>.<\/p>\n<h2>Global quan trọng<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Global<\/th>\n  <th>Công dụng<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>getgenv().xNgotLibraryOnly<\/code><\/td>\n  <td>Bỏ tự mở demo.<\/td>\n<\/tr>\n<tr>\n  <td><code>getgenv().xNgotLoaderConfig<\/code><\/td>\n  <td>Ghi đè cài đặt loader demo trước khi nạp.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotMusicConfig<\/code><\/td>\n  <td>API cấu hình nhạc.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotMusicDoctor()<\/code><\/td>\n  <td>Trả về chẩn đoán nhạc.<\/td>\n<\/tr>\n<tr>\n  <td><code>_G.xNgotStudio<\/code><\/td>\n  <td>Trạng thái khởi động demo, nếu đã chạy.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Credit<\/h2>\n<p>xNgot Library: Nguyễn Minh Nhật (xNgot Zume). Giao diện và engine key: <a href=\"https://github.com/snowdevlol/OphynUI\">Ophyn UI<\/a>. UI cửa sổ phát triển từ <a href=\"https://github.com/Footagesus/WindUI\">Wind UI<\/a>.<\/p>\n"},"plain":{"en":" API reference\n\nA compact index of the most useful entry points in this build.\n\n Library and window\n\n| API | Purpose |\n| --- | --- |\n| LIB:CreateWindow(options) | Create a window. |\n| LIB:Notify(options) | Show a notification. |\n| Window:Tab(options) | Add a tab. |\n| Window:Show(), Hide(), Toggle() | Control visibility. |\n| Window:SelectTab(name) | Select a tab. |\n| Window:Dialog(options) | Show a dialog. |\n| Window:GetDynamicIsland() | Return the island API or nil. |\n| Window:SaveConfig(), DeleteConfig(), GetConfigPath() | Manage configuration. |\n| Window:ForgetSavedKey() | Remove a saved gate key when supported. |\n| Window:Destroy() | Destroy the window. |\n\n Components\n\nSection, Button, Toggle, Slider, Input, Dropdown, Colorpicker, Paragraph, Code, Discord and InfoNguyenNhat are created on a tab. Use icon names such as house, sparkles, music-2, key-round, settings or triangle-alert.\n\n Important globals\n\n| Global | Use |\n| --- | --- |\n| getgenv().xNgotLibraryOnly | Skip automatic demo startup. |\n| getgenv().xNgotLoaderConfig | Override bundled demo loader settings before loading. |\n| _G.xNgotMusicConfig | Music config API. |\n| _G.xNgotMusicDoctor() | Return music diagnostics. |\n| _G.xNgotStudio | Demo boot state, when started. |\n\n Credits\n\nxNgot Library: Nguyễn Minh Nhật (xNgot Zume). Key-system interface and engine: [Ophyn UI](https://github.com/snowdevlol/OphynUI). Window UI originates from [Wind UI](https://github.com/Footagesus/WindUI).\n","vi":" Tham khảo API\n\nDanh mục nhanh các điểm gọi thường dùng trong bản này.\n\n Library và cửa sổ\n\n| API | Công dụng |\n| --- | --- |\n| LIB:CreateWindow(options) | Tạo cửa sổ. |\n| LIB:Notify(options) | Hiện thông báo. |\n| Window:Tab(options) | Thêm tab. |\n| Window:Show(), Hide(), Toggle() | Điều khiển hiển thị. |\n| Window:SelectTab(name) | Chọn tab. |\n| Window:Dialog(options) | Hiện hộp thoại. |\n| Window:GetDynamicIsland() | Trả về API island hoặc nil. |\n| Window:SaveConfig(), DeleteConfig(), GetConfigPath() | Quản lý cấu hình. |\n| Window:ForgetSavedKey() | Xóa key đã lưu nếu executor hỗ trợ. |\n| Window:Destroy() | Đóng cửa sổ. |\n\n Thành phần\n\nTạo Section, Button, Toggle, Slider, Input, Dropdown, Colorpicker, Paragraph, Code, Discord và InfoNguyenNhat trên tab. Ví dụ tên icon: house, sparkles, music-2, key-round, settings, triangle-alert.\n\n Global quan trọng\n\n| Global | Công dụng |\n| --- | --- |\n| getgenv().xNgotLibraryOnly | Bỏ tự mở demo. |\n| getgenv().xNgotLoaderConfig | Ghi đè cài đặt loader demo trước khi nạp. |\n| _G.xNgotMusicConfig | API cấu hình nhạc. |\n| _G.xNgotMusicDoctor() | Trả về chẩn đoán nhạc. |\n| _G.xNgotStudio | Trạng thái khởi động demo, nếu đã chạy. |\n\n Credit\n\nxNgot Library: Nguyễn Minh Nhật (xNgot Zume). Giao diện và engine key: [Ophyn UI](https://github.com/snowdevlol/OphynUI). UI cửa sổ phát triển từ [Wind UI](https://github.com/Footagesus/WindUI).\n"}},{"id":"full-example","num":"15","group":{"en":"GUIDES","vi":"HƯỚNG DẪN"},"title":{"en":"Complete hub example","vi":"Ví dụ hub hoàn chỉnh"},"html":{"en":"<h1>Complete hub example<\/h1>\n<p>This is a single script, not a set of independent snippets. Put the <strong>updated<\/strong> <code>main.lua<\/code> in the executor workspace first. The example does not use the demo boot and does not depend on GitHub. It deliberately has no key gate; see the key pages to add one.<\/p>\n<pre><code class=\"language-lua\">getgenv().xNgotLibraryOnly = true\nlocal chunk, err = loadstring(readfile(&quot;main.lua&quot;))\nassert(chunk, err)\nlocal LIB = chunk()\n\nlocal Window = LIB:CreateWindow({\n    Title = &quot;My Hub&quot;, Author = &quot;Example&quot;, Icon = &quot;sparkles&quot;,\n    Size = UDim2.fromOffset(580, 420),\n    Folder = &quot;MyHub&quot;, FileSaveName = &quot;settings.json&quot;,\n    AutoSave = true, SettingsUI = true, Loading = false,\n})\nlocal Main = Window:Tab({ Title = &quot;Main&quot;, Icon = &quot;house&quot; })\nMain:Section({ Title = &quot;Controls&quot;, Default = true })\nlocal status = Main:Paragraph({ Title = &quot;Status&quot;, Desc = &quot;Ready&quot; })\nlocal enabled = Main:Toggle({\n    Title = &quot;Enabled&quot;, Default = false,\n    Callback = function(value) status:SetDesc(value and &quot;Enabled&quot; or &quot;Disabled&quot;) end,\n})\nMain:Slider({\n    Title = &quot;Amount&quot;, Value = { Min = 0, Max = 100, Default = 25 }, Step = 5,\n    Callback = function(value) print(&quot;Amount:&quot;, value) end,\n})\nMain:Input({ Title = &quot;Name&quot;, Placeholder = &quot;Enter text&quot;,\n    Callback = function(text) print(&quot;Name:&quot;, text) end,\n})\nMain:Dropdown({ Title = &quot;Mode&quot;, Values = {&quot;Normal&quot;, &quot;Fast&quot;}, Value = &quot;Normal&quot;,\n    Callback = function(value) print(&quot;Mode:&quot;, value) end,\n})\nMain:Button({ Title = &quot;Test notification&quot;, Callback = function()\n    LIB:Notify({ Title = &quot;xNgot&quot;, Content = &quot;Hello!&quot;, Kind = &quot;success&quot;, Duration = 3 })\nend })\nWindow:SelectTab(&quot;Main&quot;)\n<\/code><\/pre>\n<h2>What happens on startup<\/h2>\n<ol>\n<li>Library-only mode returns <code>LIB<\/code> instead of running the bundled demo.<\/li>\n<li><code>CreateWindow<\/code> replaces the previous active xNgot window; it does not intentionally remove unrelated game UI.<\/li>\n<li><code>Window:Tab<\/code> returns a tab. <code>Section<\/code> becomes the container for later controls on that tab.<\/li>\n<li>State callbacks can run immediately with default or restored values. Build dependencies such as <code>status<\/code> <strong>before<\/strong> callbacks that use them.<\/li>\n<li><code>SettingsUI = true<\/code> creates Settings and, if initialization succeeds, the integrated island. <code>Loading = false<\/code> disables the loader when there is no enabled key gate.<\/li>\n<\/ol>\n<blockquote>\n<p>This code has not been validated in every Roblox experience or executor. The library uses executor APIs, which differ across environments.<\/p>\n<\/blockquote>\n","vi":"<h1>Ví dụ hub hoàn chỉnh<\/h1>\n<p>Đây là <strong>một script hoàn chỉnh<\/strong>, không phải các đoạn rời. Trước tiên đặt <code>main.lua<\/code> <strong>mới<\/strong> vào workspace của executor. Ví dụ không mở demo, không phụ thuộc GitHub và chưa bật key; xem mục Key system nếu cần khóa.<\/p>\n<pre><code class=\"language-lua\">getgenv().xNgotLibraryOnly = true\nlocal chunk, err = loadstring(readfile(&quot;main.lua&quot;))\nassert(chunk, err)\nlocal LIB = chunk()\n\nlocal Window = LIB:CreateWindow({\n    Title = &quot;Hub của tôi&quot;, Author = &quot;Ví dụ&quot;, Icon = &quot;sparkles&quot;,\n    Size = UDim2.fromOffset(580, 420),\n    Folder = &quot;MyHub&quot;, FileSaveName = &quot;settings.json&quot;,\n    AutoSave = true, SettingsUI = true, Loading = false,\n})\nlocal Main = Window:Tab({ Title = &quot;Main&quot;, Icon = &quot;house&quot; })\nMain:Section({ Title = &quot;Điều khiển&quot;, Default = true })\nlocal status = Main:Paragraph({ Title = &quot;Trạng thái&quot;, Desc = &quot;Sẵn sàng&quot; })\nlocal enabled = Main:Toggle({\n    Title = &quot;Bật tính năng&quot;, Default = false,\n    Callback = function(value) status:SetDesc(value and &quot;Đã bật&quot; or &quot;Đã tắt&quot;) end,\n})\nMain:Slider({\n    Title = &quot;Giá trị&quot;, Value = { Min = 0, Max = 100, Default = 25 }, Step = 5,\n    Callback = function(value) print(&quot;Giá trị:&quot;, value) end,\n})\nMain:Input({ Title = &quot;Tên&quot;, Placeholder = &quot;Nhập nội dung&quot;,\n    Callback = function(text) print(&quot;Tên:&quot;, text) end,\n})\nMain:Dropdown({ Title = &quot;Chế độ&quot;, Values = {&quot;Normal&quot;, &quot;Fast&quot;}, Value = &quot;Normal&quot;,\n    Callback = function(value) print(&quot;Chế độ:&quot;, value) end,\n})\nMain:Button({ Title = &quot;Thử thông báo&quot;, Callback = function()\n    LIB:Notify({ Title = &quot;xNgot&quot;, Content = &quot;Xin chào!&quot;, Kind = &quot;success&quot;, Duration = 3 })\nend })\nWindow:SelectTab(&quot;Main&quot;)\n<\/code><\/pre>\n<h2>Khi chạy sẽ xảy ra gì?<\/h2>\n<ol>\n<li>Chế độ library-only trả về <code>LIB<\/code>, không chạy demo đi kèm.<\/li>\n<li><code>CreateWindow<\/code> thay cửa sổ xNgot đang hoạt động; không chủ đích xóa UI khác của game.<\/li>\n<li><code>Window:Tab<\/code> trả về tab; <code>Section<\/code> trở thành nơi chứa các control tạo sau đó trên tab.<\/li>\n<li>Callback của control có trạng thái có thể chạy ngay với mặc định hoặc dữ liệu đã lưu. Tạo các đối tượng được callback dùng, như <code>status<\/code>, <strong>trước<\/strong> control.<\/li>\n<li><code>SettingsUI = true<\/code> tạo tab Settings và Island nếu khởi tạo thành công. <code>Loading = false<\/code> tắt loader khi không bật key gate.<\/li>\n<\/ol>\n<blockquote>\n<p>Ví dụ chưa được kiểm chứng trên mọi game/executor Roblox. API của executor có thể khác nhau.<\/p>\n<\/blockquote>\n"},"plain":{"en":" Complete hub example\n\nThis is a single script, not a set of independent snippets. Put the updated main.lua in the executor workspace first. The example does not use the demo boot and does not depend on GitHub. It deliberately has no key gate; see the key pages to add one.\n\nlua\ngetgenv().xNgotLibraryOnly = true\nlocal chunk, err = loadstring(readfile(\"main.lua\"))\nassert(chunk, err)\nlocal LIB = chunk()\n\nlocal Window = LIB:CreateWindow({\n    Title = \"My Hub\", Author = \"Example\", Icon = \"sparkles\",\n    Size = UDim2.fromOffset(580, 420),\n    Folder = \"MyHub\", FileSaveName = \"settings.json\",\n    AutoSave = true, SettingsUI = true, Loading = false,\n})\nlocal Main = Window:Tab({ Title = \"Main\", Icon = \"house\" })\nMain:Section({ Title = \"Controls\", Default = true })\nlocal status = Main:Paragraph({ Title = \"Status\", Desc = \"Ready\" })\nlocal enabled = Main:Toggle({\n    Title = \"Enabled\", Default = false,\n    Callback = function(value) status:SetDesc(value and \"Enabled\" or \"Disabled\") end,\n})\nMain:Slider({\n    Title = \"Amount\", Value = { Min = 0, Max = 100, Default = 25 }, Step = 5,\n    Callback = function(value) print(\"Amount:\", value) end,\n})\nMain:Input({ Title = \"Name\", Placeholder = \"Enter text\",\n    Callback = function(text) print(\"Name:\", text) end,\n})\nMain:Dropdown({ Title = \"Mode\", Values = {\"Normal\", \"Fast\"}, Value = \"Normal\",\n    Callback = function(value) print(\"Mode:\", value) end,\n})\nMain:Button({ Title = \"Test notification\", Callback = function()\n    LIB:Notify({ Title = \"xNgot\", Content = \"Hello!\", Kind = \"success\", Duration = 3 })\nend })\nWindow:SelectTab(\"Main\")\n\n\n What happens on startup\n\n1. Library-only mode returns LIB instead of running the bundled demo.\n2. CreateWindow replaces the previous active xNgot window; it does not intentionally remove unrelated game UI.\n3. Window:Tab returns a tab. Section becomes the container for later controls on that tab.\n4. State callbacks can run immediately with default or restored values. Build dependencies such as status before callbacks that use them.\n5. SettingsUI = true creates Settings and, if initialization succeeds, the integrated island. Loading = false disables the loader when there is no enabled key gate.\n\n> This code has not been validated in every Roblox experience or executor. The library uses executor APIs, which differ across environments.\n","vi":" Ví dụ hub hoàn chỉnh\n\nĐây là một script hoàn chỉnh, không phải các đoạn rời. Trước tiên đặt main.lua mới vào workspace của executor. Ví dụ không mở demo, không phụ thuộc GitHub và chưa bật key; xem mục Key system nếu cần khóa.\n\nlua\ngetgenv().xNgotLibraryOnly = true\nlocal chunk, err = loadstring(readfile(\"main.lua\"))\nassert(chunk, err)\nlocal LIB = chunk()\n\nlocal Window = LIB:CreateWindow({\n    Title = \"Hub của tôi\", Author = \"Ví dụ\", Icon = \"sparkles\",\n    Size = UDim2.fromOffset(580, 420),\n    Folder = \"MyHub\", FileSaveName = \"settings.json\",\n    AutoSave = true, SettingsUI = true, Loading = false,\n})\nlocal Main = Window:Tab({ Title = \"Main\", Icon = \"house\" })\nMain:Section({ Title = \"Điều khiển\", Default = true })\nlocal status = Main:Paragraph({ Title = \"Trạng thái\", Desc = \"Sẵn sàng\" })\nlocal enabled = Main:Toggle({\n    Title = \"Bật tính năng\", Default = false,\n    Callback = function(value) status:SetDesc(value and \"Đã bật\" or \"Đã tắt\") end,\n})\nMain:Slider({\n    Title = \"Giá trị\", Value = { Min = 0, Max = 100, Default = 25 }, Step = 5,\n    Callback = function(value) print(\"Giá trị:\", value) end,\n})\nMain:Input({ Title = \"Tên\", Placeholder = \"Nhập nội dung\",\n    Callback = function(text) print(\"Tên:\", text) end,\n})\nMain:Dropdown({ Title = \"Chế độ\", Values = {\"Normal\", \"Fast\"}, Value = \"Normal\",\n    Callback = function(value) print(\"Chế độ:\", value) end,\n})\nMain:Button({ Title = \"Thử thông báo\", Callback = function()\n    LIB:Notify({ Title = \"xNgot\", Content = \"Xin chào!\", Kind = \"success\", Duration = 3 })\nend })\nWindow:SelectTab(\"Main\")\n\n\n Khi chạy sẽ xảy ra gì?\n\n1. Chế độ library-only trả về LIB, không chạy demo đi kèm.\n2. CreateWindow thay cửa sổ xNgot đang hoạt động; không chủ đích xóa UI khác của game.\n3. Window:Tab trả về tab; Section trở thành nơi chứa các control tạo sau đó trên tab.\n4. Callback của control có trạng thái có thể chạy ngay với mặc định hoặc dữ liệu đã lưu. Tạo các đối tượng được callback dùng, như status, trước control.\n5. SettingsUI = true tạo tab Settings và Island nếu khởi tạo thành công. Loading = false tắt loader khi không bật key gate.\n\n> Ví dụ chưa được kiểm chứng trên mọi game/executor Roblox. API của executor có thể khác nhau.\n"}},{"id":"component-reference","num":"16","group":{"en":"DETAILED REFERENCE","vi":"THAM KHẢO CHI TIẾT"},"title":{"en":"Component reference","vi":"Chi tiết từng control"},"html":{"en":"<h1>Component reference<\/h1>\n<p>All constructors below are called on a <code>Tab<\/code>. Their <code>Title<\/code> values should be unique within a tab because stateful controls use the original title as a config key. Renaming a control later does <strong>not<\/strong> migrate that key.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Constructor<\/th>\n  <th>Options<\/th>\n  <th>Callback / behavior<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Button<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>Invoked on activation. This build does not read an <code>Icon<\/code> option for Button.<\/td>\n<\/tr>\n<tr>\n  <td><code>Toggle<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Default<\/code> or <code>Value<\/code>, <code>Icon<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>Boolean; callback fires at creation and on <code>:Set<\/code>. Avoid specifying conflicting <code>Default<\/code> and <code>Value<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Slider<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Value = {Min, Max, Default}<\/code>, <code>Step<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>Number; clamped, stepped; callbacks at initialization and changes. <code>:Set<\/code> returns the value or <code>nil<\/code> if outside bounds.<\/td>\n<\/tr>\n<tr>\n  <td><code>Input<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Placeholder<\/code>, <code>Default<\/code> / <code>Value<\/code>, <code>ClearTextOnFocus<\/code>, <code>MultiLine<\/code>, <code>NoSave<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>String; callback on initialization, focus loss, and <code>:Set<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Dropdown<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Values<\/code>, <code>Value<\/code> / <code>Default<\/code>, <code>Multi<\/code>, <code>AllowNone<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>A string for single-select, table for multi-select; callback may fire at creation.<\/td>\n<\/tr>\n<tr>\n  <td><code>Colorpicker<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Default<\/code> / <code>Value<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>Emits <code>Color3<\/code>; <code>:Get()<\/code> returns current value; initial callback runs.<\/td>\n<\/tr>\n<tr>\n  <td><code>Section<\/code><\/td>\n  <td><code>Title<\/code>, <code>Default<\/code>, <code>TextXAlignment<\/code><\/td>\n  <td>Adds a collapsible group and makes it the parent for subsequent controls created through that tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>Paragraph<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>RichText<\/code><\/td>\n  <td>Noninteractive text.<\/td>\n<\/tr>\n<tr>\n  <td><code>Code<\/code><\/td>\n  <td><code>Title<\/code>, <code>Code<\/code><\/td>\n  <td>Displays code; it does not execute it.<\/td>\n<\/tr>\n<tr>\n  <td><code>Discord<\/code><\/td>\n  <td><code>Name<\/code>, <code>Desc<\/code>, <code>Avatar<\/code>, <code>InviteLink<\/code>, <code>InviteCode<\/code><\/td>\n  <td>Card for an invite; clipboard and joining depend on executor capabilities.<\/td>\n<\/tr>\n<tr>\n  <td><code>InfoNguyenNhat<\/code><\/td>\n  <td><code>Name<\/code>, <code>Bio<\/code>, <code>Avatar<\/code>, <code>Badges<\/code><\/td>\n  <td>Profile card.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object methods<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Object<\/th>\n  <th>Methods<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Button<\/td>\n  <td><code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Toggle<\/td>\n  <td><code>Set<\/code>, <code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Slider<\/td>\n  <td><code>Set<\/code>, <code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Input<\/td>\n  <td><code>Set<\/code>, <code>Get<\/code>, <code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>SetPlaceholder<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Dropdown<\/td>\n  <td><code>Select<\/code>, <code>Refresh<\/code>, <code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Colorpicker<\/td>\n  <td><code>Set<\/code>, <code>Get<\/code>, <code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Section<\/td>\n  <td><code>SetTitle<\/code>, <code>SetOpen<\/code>, <code>Toggle<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Paragraph<\/td>\n  <td><code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Code<\/td>\n  <td><code>SetTitle<\/code>, <code>SetCode<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Discord<\/td>\n  <td><code>SetInvite<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>InfoNguyenNhat<\/td>\n  <td><code>SetName<\/code>, <code>SetBio<\/code>, <code>SetAvatar<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Single and multiple choice<\/h2>\n<pre><code class=\"language-lua\">local picker = Main:Dropdown({\n    Title = &quot;Targets&quot;, Values = {&quot;A&quot;, &quot;B&quot;, &quot;C&quot;},\n    Multi = true, AllowNone = true, Value = {&quot;A&quot;},\n    Callback = function(values)\n        for _, value in ipairs(values) do print(value) end\n    end,\n})\npicker:Select({&quot;B&quot;}) -- toggles the given item in multi-select\npicker:Refresh({&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;}) -- rebuilds choices and resets selection\n<\/code><\/pre>\n<p><code>Refresh<\/code> resets the selection; call <code>Select<\/code> after refresh if needed. <code>AllowNone<\/code> applies differently to single and multi-select; a single-select None callback uses an empty string. Use existing values only. For mobile the selected option's persistent color represents selection, not a stuck press.<\/p>\n<h2>Grouping and text<\/h2>\n<pre><code class=\"language-lua\">local section = Main:Section({Title = &quot;Options&quot;, Default = true})\nMain:Paragraph({Title = &quot;Hint&quot;, Desc = &quot;&lt;b&gt;Bold&lt;/b&gt;&quot;, RichText = true})\nsection:SetOpen(false)\nsection:SetOpen(true)\nlocal card = Main:InfoNguyenNhat({Name = &quot;Developer&quot;, Bio = &quot;Hello&quot;, Badges = {&quot;Dev&quot;}})\ncard:SetBio(&quot;Updated&quot;)\n<\/code><\/pre>\n<p><code>Section<\/code> is not a separate tab object; continue using <code>Main:Button(...)<\/code> etc. To start a different group, create another section on the tab.<\/p>\n","vi":"<h1>Chi tiết từng control<\/h1>\n<p>Các hàm tạo bên dưới được gọi trên <code>Tab<\/code>. Đặt <code>Title<\/code> <strong>khác nhau trong cùng tab<\/strong>, vì control có trạng thái dùng tên ban đầu làm khóa lưu cấu hình. <code>SetTitle<\/code> sau đó không tự chuyển khóa cũ sang tên mới.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Thành phần<\/th>\n  <th>Tùy chọn<\/th>\n  <th>Callback / cách hoạt động<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Button<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>Chạy khi nhấn. Bản này không đọc <code>Icon<\/code> cho Button.<\/td>\n<\/tr>\n<tr>\n  <td><code>Toggle<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Default<\/code> hoặc <code>Value<\/code>, <code>Icon<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>Boolean; callback chạy lúc tạo và khi <code>:Set<\/code>. Tránh đặt <code>Default<\/code> và <code>Value<\/code> trái nhau.<\/td>\n<\/tr>\n<tr>\n  <td><code>Slider<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Value = {Min, Max, Default}<\/code>, <code>Step<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>Số; giới hạn theo khoảng và bước; callback chạy lúc tạo và thay đổi. <code>:Set<\/code> trả giá trị hoặc <code>nil<\/code> nếu ngoài khoảng.<\/td>\n<\/tr>\n<tr>\n  <td><code>Input<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Placeholder<\/code>, <code>Default<\/code> / <code>Value<\/code>, <code>ClearTextOnFocus<\/code>, <code>MultiLine<\/code>, <code>NoSave<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>Chuỗi; callback chạy lúc tạo, mất focus và <code>:Set<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Dropdown<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Values<\/code>, <code>Value<\/code> / <code>Default<\/code>, <code>Multi<\/code>, <code>AllowNone<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>Chọn một trả chuỗi; chọn nhiều trả bảng; callback có thể chạy khi tạo.<\/td>\n<\/tr>\n<tr>\n  <td><code>Colorpicker<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>Default<\/code> / <code>Value<\/code>, <code>Locked<\/code>, <code>Callback<\/code><\/td>\n  <td>Callback nhận <code>Color3<\/code>; <code>:Get()<\/code> lấy màu hiện tại; callback chạy lúc tạo.<\/td>\n<\/tr>\n<tr>\n  <td><code>Section<\/code><\/td>\n  <td><code>Title<\/code>, <code>Default<\/code>, <code>TextXAlignment<\/code><\/td>\n  <td>Nhóm thu gọn; trở thành container cho control tạo tiếp trên tab đó.<\/td>\n<\/tr>\n<tr>\n  <td><code>Paragraph<\/code><\/td>\n  <td><code>Title<\/code>, <code>Desc<\/code>, <code>RichText<\/code><\/td>\n  <td>Nội dung chữ, không tương tác.<\/td>\n<\/tr>\n<tr>\n  <td><code>Code<\/code><\/td>\n  <td><code>Title<\/code>, <code>Code<\/code><\/td>\n  <td>Hiển thị code, không thực thi.<\/td>\n<\/tr>\n<tr>\n  <td><code>Discord<\/code><\/td>\n  <td><code>Name<\/code>, <code>Desc<\/code>, <code>Avatar<\/code>, <code>InviteLink<\/code>, <code>InviteCode<\/code><\/td>\n  <td>Thẻ mời; copy/tham gia tùy executor.<\/td>\n<\/tr>\n<tr>\n  <td><code>InfoNguyenNhat<\/code><\/td>\n  <td><code>Name<\/code>, <code>Bio<\/code>, <code>Avatar<\/code>, <code>Badges<\/code><\/td>\n  <td>Thẻ thông tin.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Các hàm của object trả về<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Object<\/th>\n  <th>Hàm<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Button<\/td>\n  <td><code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Toggle<\/td>\n  <td><code>Set<\/code>, <code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Slider<\/td>\n  <td><code>Set<\/code>, <code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Input<\/td>\n  <td><code>Set<\/code>, <code>Get<\/code>, <code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>SetPlaceholder<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Dropdown<\/td>\n  <td><code>Select<\/code>, <code>Refresh<\/code>, <code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Colorpicker<\/td>\n  <td><code>Set<\/code>, <code>Get<\/code>, <code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Lock<\/code>, <code>Unlock<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Section<\/td>\n  <td><code>SetTitle<\/code>, <code>SetOpen<\/code>, <code>Toggle<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Paragraph<\/td>\n  <td><code>SetTitle<\/code>, <code>SetDesc<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Code<\/td>\n  <td><code>SetTitle<\/code>, <code>SetCode<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Discord<\/td>\n  <td><code>SetInvite<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<tr>\n  <td>InfoNguyenNhat<\/td>\n  <td><code>SetName<\/code>, <code>SetBio<\/code>, <code>SetAvatar<\/code>, <code>Destroy<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Chọn một hoặc nhiều<\/h2>\n<pre><code class=\"language-lua\">local picker = Main:Dropdown({\n    Title = &quot;Mục tiêu&quot;, Values = {&quot;A&quot;, &quot;B&quot;, &quot;C&quot;},\n    Multi = true, AllowNone = true, Value = {&quot;A&quot;},\n    Callback = function(values)\n        for _, value in ipairs(values) do print(value) end\n    end,\n})\npicker:Select({&quot;B&quot;}) -- đảo trạng thái mục B khi chọn nhiều\npicker:Refresh({&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;}) -- dựng lại và reset lựa chọn\n<\/code><\/pre>\n<p><code>Refresh<\/code> reset lựa chọn; gọi <code>Select<\/code> sau đó nếu cần. <code>AllowNone<\/code> khác nhau giữa chọn một và nhiều; khi chọn một, callback cho None nhận chuỗi rỗng. Chỉ chọn giá trị có trong danh sách. Màu được giữ ở mục đã chọn thể hiện trạng thái lựa chọn, không phải hiệu ứng nhấn bị kẹt.<\/p>\n<h2>Nhóm và nội dung<\/h2>\n<pre><code class=\"language-lua\">local section = Main:Section({Title = &quot;Tùy chọn&quot;, Default = true})\nMain:Paragraph({Title = &quot;Gợi ý&quot;, Desc = &quot;&lt;b&gt;Chữ đậm&lt;/b&gt;&quot;, RichText = true})\nsection:SetOpen(false)\nsection:SetOpen(true)\nlocal card = Main:InfoNguyenNhat({Name = &quot;Developer&quot;, Bio = &quot;Xin chào&quot;, Badges = {&quot;Dev&quot;}})\ncard:SetBio(&quot;Đã cập nhật&quot;)\n<\/code><\/pre>\n<p><code>Section<\/code> không phải tab mới; tiếp tục gọi <code>Main:Button(...)<\/code> v.v. Muốn bắt đầu nhóm khác, tạo section khác trên cùng tab.<\/p>\n"},"plain":{"en":" Component reference\n\nAll constructors below are called on a Tab. Their Title values should be unique within a tab because stateful controls use the original title as a config key. Renaming a control later does not migrate that key.\n\n| Constructor | Options | Callback / behavior |\n| --- | --- | --- |\n| Button | Title, Desc, Locked, Callback | Invoked on activation. This build does not read an Icon option for Button. |\n| Toggle | Title, Desc, Default or Value, Icon, Locked, Callback | Boolean; callback fires at creation and on :Set. Avoid specifying conflicting Default and Value. |\n| Slider | Title, Desc, Value = {Min, Max, Default}, Step, Locked, Callback | Number; clamped, stepped; callbacks at initialization and changes. :Set returns the value or nil if outside bounds. |\n| Input | Title, Desc, Placeholder, Default / Value, ClearTextOnFocus, MultiLine, NoSave, Locked, Callback | String; callback on initialization, focus loss, and :Set. |\n| Dropdown | Title, Desc, Values, Value / Default, Multi, AllowNone, Locked, Callback | A string for single-select, table for multi-select; callback may fire at creation. |\n| Colorpicker | Title, Desc, Default / Value, Locked, Callback | Emits Color3; :Get() returns current value; initial callback runs. |\n| Section | Title, Default, TextXAlignment | Adds a collapsible group and makes it the parent for subsequent controls created through that tab. |\n| Paragraph | Title, Desc, RichText | Noninteractive text. |\n| Code | Title, Code | Displays code; it does not execute it. |\n| Discord | Name, Desc, Avatar, InviteLink, InviteCode | Card for an invite; clipboard and joining depend on executor capabilities. |\n| InfoNguyenNhat | Name, Bio, Avatar, Badges | Profile card. |\n\n Returned object methods\n\n| Object | Methods |\n| --- | --- |\n| Button | SetTitle, SetDesc, Lock, Unlock, Destroy |\n| Toggle | Set, SetTitle, SetDesc, Lock, Unlock, Destroy |\n| Slider | Set, SetTitle, SetDesc, Lock, Unlock, Destroy |\n| Input | Set, Get, SetTitle, SetDesc, SetPlaceholder, Lock, Unlock, Destroy |\n| Dropdown | Select, Refresh, SetTitle, SetDesc, Lock, Unlock, Destroy |\n| Colorpicker | Set, Get, SetTitle, SetDesc, Lock, Unlock, Destroy |\n| Section | SetTitle, SetOpen, Toggle, Destroy |\n| Paragraph | SetTitle, SetDesc, Destroy |\n| Code | SetTitle, SetCode, Destroy |\n| Discord | SetInvite, Destroy |\n| InfoNguyenNhat | SetName, SetBio, SetAvatar, Destroy |\n\n Single and multiple choice\n\nlua\nlocal picker = Main:Dropdown({\n    Title = \"Targets\", Values = {\"A\", \"B\", \"C\"},\n    Multi = true, AllowNone = true, Value = {\"A\"},\n    Callback = function(values)\n        for _, value in ipairs(values) do print(value) end\n    end,\n})\npicker:Select({\"B\"}) -- toggles the given item in multi-select\npicker:Refresh({\"A\", \"B\", \"C\", \"D\"}) -- rebuilds choices and resets selection\n\n\nRefresh resets the selection; call Select after refresh if needed. AllowNone applies differently to single and multi-select; a single-select None callback uses an empty string. Use existing values only. For mobile the selected option's persistent color represents selection, not a stuck press.\n\n Grouping and text\n\nlua\nlocal section = Main:Section({Title = \"Options\", Default = true})\nMain:Paragraph({Title = \"Hint\", Desc = \"<b>Bold<\/b>\", RichText = true})\nsection:SetOpen(false)\nsection:SetOpen(true)\nlocal card = Main:InfoNguyenNhat({Name = \"Developer\", Bio = \"Hello\", Badges = {\"Dev\"}})\ncard:SetBio(\"Updated\")\n\n\nSection is not a separate tab object; continue using Main:Button(...) etc. To start a different group, create another section on the tab.\n","vi":" Chi tiết từng control\n\nCác hàm tạo bên dưới được gọi trên Tab. Đặt Title khác nhau trong cùng tab, vì control có trạng thái dùng tên ban đầu làm khóa lưu cấu hình. SetTitle sau đó không tự chuyển khóa cũ sang tên mới.\n\n| Thành phần | Tùy chọn | Callback / cách hoạt động |\n| --- | --- | --- |\n| Button | Title, Desc, Locked, Callback | Chạy khi nhấn. Bản này không đọc Icon cho Button. |\n| Toggle | Title, Desc, Default hoặc Value, Icon, Locked, Callback | Boolean; callback chạy lúc tạo và khi :Set. Tránh đặt Default và Value trái nhau. |\n| Slider | Title, Desc, Value = {Min, Max, Default}, Step, Locked, Callback | Số; giới hạn theo khoảng và bước; callback chạy lúc tạo và thay đổi. :Set trả giá trị hoặc nil nếu ngoài khoảng. |\n| Input | Title, Desc, Placeholder, Default / Value, ClearTextOnFocus, MultiLine, NoSave, Locked, Callback | Chuỗi; callback chạy lúc tạo, mất focus và :Set. |\n| Dropdown | Title, Desc, Values, Value / Default, Multi, AllowNone, Locked, Callback | Chọn một trả chuỗi; chọn nhiều trả bảng; callback có thể chạy khi tạo. |\n| Colorpicker | Title, Desc, Default / Value, Locked, Callback | Callback nhận Color3; :Get() lấy màu hiện tại; callback chạy lúc tạo. |\n| Section | Title, Default, TextXAlignment | Nhóm thu gọn; trở thành container cho control tạo tiếp trên tab đó. |\n| Paragraph | Title, Desc, RichText | Nội dung chữ, không tương tác. |\n| Code | Title, Code | Hiển thị code, không thực thi. |\n| Discord | Name, Desc, Avatar, InviteLink, InviteCode | Thẻ mời; copy/tham gia tùy executor. |\n| InfoNguyenNhat | Name, Bio, Avatar, Badges | Thẻ thông tin. |\n\n Các hàm của object trả về\n\n| Object | Hàm |\n| --- | --- |\n| Button | SetTitle, SetDesc, Lock, Unlock, Destroy |\n| Toggle | Set, SetTitle, SetDesc, Lock, Unlock, Destroy |\n| Slider | Set, SetTitle, SetDesc, Lock, Unlock, Destroy |\n| Input | Set, Get, SetTitle, SetDesc, SetPlaceholder, Lock, Unlock, Destroy |\n| Dropdown | Select, Refresh, SetTitle, SetDesc, Lock, Unlock, Destroy |\n| Colorpicker | Set, Get, SetTitle, SetDesc, Lock, Unlock, Destroy |\n| Section | SetTitle, SetOpen, Toggle, Destroy |\n| Paragraph | SetTitle, SetDesc, Destroy |\n| Code | SetTitle, SetCode, Destroy |\n| Discord | SetInvite, Destroy |\n| InfoNguyenNhat | SetName, SetBio, SetAvatar, Destroy |\n\n Chọn một hoặc nhiều\n\nlua\nlocal picker = Main:Dropdown({\n    Title = \"Mục tiêu\", Values = {\"A\", \"B\", \"C\"},\n    Multi = true, AllowNone = true, Value = {\"A\"},\n    Callback = function(values)\n        for _, value in ipairs(values) do print(value) end\n    end,\n})\npicker:Select({\"B\"}) -- đảo trạng thái mục B khi chọn nhiều\npicker:Refresh({\"A\", \"B\", \"C\", \"D\"}) -- dựng lại và reset lựa chọn\n\n\nRefresh reset lựa chọn; gọi Select sau đó nếu cần. AllowNone khác nhau giữa chọn một và nhiều; khi chọn một, callback cho None nhận chuỗi rỗng. Chỉ chọn giá trị có trong danh sách. Màu được giữ ở mục đã chọn thể hiện trạng thái lựa chọn, không phải hiệu ứng nhấn bị kẹt.\n\n Nhóm và nội dung\n\nlua\nlocal section = Main:Section({Title = \"Tùy chọn\", Default = true})\nMain:Paragraph({Title = \"Gợi ý\", Desc = \"<b>Chữ đậm<\/b>\", RichText = true})\nsection:SetOpen(false)\nsection:SetOpen(true)\nlocal card = Main:InfoNguyenNhat({Name = \"Developer\", Bio = \"Xin chào\", Badges = {\"Dev\"}})\ncard:SetBio(\"Đã cập nhật\")\n\n\nSection không phải tab mới; tiếp tục gọi Main:Button(...) v.v. Muốn bắt đầu nhóm khác, tạo section khác trên cùng tab.\n"}},{"id":"window-reference","num":"17","group":{"en":"DETAILED REFERENCE","vi":"THAM KHẢO CHI TIẾT"},"title":{"en":"Window and storage APIs","vi":"API cửa sổ và lưu trữ"},"html":{"en":"<h1>Window and storage APIs<\/h1>\n<h2>Window lifecycle and navigation<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Method<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Window:Tab({Title, Icon})<\/code><\/td>\n  <td>Create a tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>SelectTab(nameOrIndex)<\/code><\/td>\n  <td>Select a tab by title or user-tab index; returns boolean.<\/td>\n<\/tr>\n<tr>\n  <td><code>Show()<\/code>, <code>Hide()<\/code>, <code>Toggle(state)<\/code><\/td>\n  <td>Show/hide; the key gate can prevent opening until passed.<\/td>\n<\/tr>\n<tr>\n  <td><code>SetToggleKey(key)<\/code><\/td>\n  <td>Accepts an <code>Enum.KeyCode<\/code> or its name; returns current key.<\/td>\n<\/tr>\n<tr>\n  <td><code>SetToggleButtonPlatform(&quot;Both&quot; or &quot;Mobile&quot;)<\/code><\/td>\n  <td>Controls availability of floating open button; other values normalize to Both.<\/td>\n<\/tr>\n<tr>\n  <td><code>GetToggleButtonPlatform()<\/code><\/td>\n  <td>Returns current setting.<\/td>\n<\/tr>\n<tr>\n  <td><code>EditOpenButton(options)<\/code><\/td>\n  <td>Edits floating button and returns its GUI object.<\/td>\n<\/tr>\n<tr>\n  <td><code>Divider()<\/code>, <code>OpenUISettings()<\/code><\/td>\n  <td>Add sidebar divider / select settings tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>Dialog(options)<\/code><\/td>\n  <td>Show modal; returned dialog has <code>:Close()<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Destroy()<\/code><\/td>\n  <td>Idempotent cleanup. Creating another xNgot window replaces this window.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-lua\">Window:SetToggleKey(Enum.KeyCode.RightShift)\nWindow:SetToggleButtonPlatform(&quot;Mobile&quot;)\nWindow:EditOpenButton({Title = &quot;Open&quot;, Icon = &quot;house&quot;, ShowText = true})\nWindow:Hide()\n<\/code><\/pre>\n<p><code>EditOpenButton<\/code> also accepts <code>OpenIcon<\/code>, <code>Size<\/code>, <code>Position<\/code>, <code>BackgroundColor3<\/code>, <code>TextColor3<\/code>, <code>IconColor3<\/code>, <code>OpenIconColor3<\/code>, <code>CornerRadius<\/code>.<\/p>\n<h2>Config persistence<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Method<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>GetConfigPath()<\/code><\/td>\n  <td>Returns the resolved path based on <code>Folder<\/code> and <code>FileSaveName<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>SaveConfig()<\/code><\/td>\n  <td>Forces a write and includes current UI settings; returns success.<\/td>\n<\/tr>\n<tr>\n  <td><code>DeleteConfig()<\/code><\/td>\n  <td>Deletes the file if supported; returns success/error. It does not reset already-loaded in-memory controls.<\/td>\n<\/tr>\n<tr>\n  <td><code>ForgetSavedKey()<\/code><\/td>\n  <td>Available when a key gate sets it up; deletes saved key if supported.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>With <code>AutoSave = false<\/code>, automatic writes are disabled; explicit <code>SaveConfig()<\/code> still attempts a write. Saved data is local, not encrypted, and depends on executor filesystem functions. The default configuration path is <code>xNgotLibrary/Config/&lt;FileSaveName&gt;<\/code>; existing valid root config is copied on first use without deleting it. Explicit custom <code>Folder<\/code> paths remain supported and may be outside the root. Default keys, AI and music are under <code>xNgotLibrary/Keys<\/code>, <code>xNgotLibrary/AI<\/code> and <code>xNgotLibrary/Music<\/code> (covers under <code>Music/Covers<\/code>); externally configured or third-party paths can differ. Files are not E2E protected: other scripts or users with executor workspace access can read or modify them. <code>DeleteConfig<\/code> does not delete downloaded music or the separately stored key.<\/p>\n<h2>Appearance APIs<\/h2>\n<p><code>SetUISettings(table, save)<\/code> starts from defaults and applies the supplied fields; it is <strong>not<\/strong> an incremental patch over all previous settings. Pass a complete settings table when preserving prior settings. <code>save = false<\/code> skips the corresponding save request.<\/p>\n<pre><code class=\"language-lua\">local settings = Window:GetUISettings()\nsettings.AccentColor = Color3.fromRGB(0, 170, 255)\nsettings.Overrides = nil -- derive overrides from supplied fields\nWindow:SetUISettings(settings, true)\nWindow:SetUISize(580, 420, true)\nprint(Window:ExportUISettings())\n<\/code><\/pre>\n<p>Additional Settings-only helpers include <code>GetUILanguage<\/code>, <code>SetUILanguage<\/code> (currently English-only) and <code>RefreshAdminAvatar<\/code> (when the admin card is built). Other methods: <code>GetUIOverrides<\/code>, <code>ClearUIOverride(key, save)<\/code>, <code>GetUIPresets<\/code>, <code>ApplyUIPreset(name, save)<\/code>, <code>UseOriginalUI(save)<\/code>, <code>GetUISize<\/code>, <code>ResetUISize(save)<\/code>, <code>SaveUISettings<\/code>, <code>ImportUISettings(json, save)<\/code>, <code>ResetUISettings(save)<\/code>, <code>SaveUIProfile(name)<\/code>, <code>LoadUIProfile(name, save)<\/code>, <code>GetUIProfileNames<\/code>, <code>DeleteUIProfile(name)<\/code>. Profiles and exports use the current versioned format; legacy profiles can be rejected. Query <code>GetUIPresets()<\/code> rather than assuming names.<\/p>\n<p><code>SetUISize<\/code> clamps width to 420–1000 and height to 300–800. UI language is English-only in this build; methods under Settings such as <code>GetUILanguage<\/code> are not necessarily available with <code>SettingsUI = false<\/code>.<\/p>\n","vi":"<h1>API cửa sổ và lưu trữ<\/h1>\n<h2>Vòng đời và điều hướng<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Hàm<\/th>\n  <th>Công dụng<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Window:Tab({Title, Icon})<\/code><\/td>\n  <td>Tạo tab.<\/td>\n<\/tr>\n<tr>\n  <td><code>SelectTab(nameOrIndex)<\/code><\/td>\n  <td>Chọn theo tên hoặc số thứ tự tab người dùng; trả boolean.<\/td>\n<\/tr>\n<tr>\n  <td><code>Show()<\/code>, <code>Hide()<\/code>, <code>Toggle(state)<\/code><\/td>\n  <td>Hiện/ẩn; key gate có thể chặn mở trước khi xác thực xong.<\/td>\n<\/tr>\n<tr>\n  <td><code>SetToggleKey(key)<\/code><\/td>\n  <td>Nhận <code>Enum.KeyCode<\/code> hoặc tên phím, trả phím hiện tại.<\/td>\n<\/tr>\n<tr>\n  <td><code>SetToggleButtonPlatform(&quot;Both&quot; hoặc &quot;Mobile&quot;)<\/code><\/td>\n  <td>Chọn nền tảng cho nút nổi; giá trị khác được đưa về Both.<\/td>\n<\/tr>\n<tr>\n  <td><code>GetToggleButtonPlatform()<\/code><\/td>\n  <td>Lấy cài đặt hiện tại.<\/td>\n<\/tr>\n<tr>\n  <td><code>EditOpenButton(options)<\/code><\/td>\n  <td>Chỉnh nút nổi, trả về GUI object.<\/td>\n<\/tr>\n<tr>\n  <td><code>Divider()<\/code>, <code>OpenUISettings()<\/code><\/td>\n  <td>Thêm đường phân cách sidebar / mở tab Settings.<\/td>\n<\/tr>\n<tr>\n  <td><code>Dialog(options)<\/code><\/td>\n  <td>Mở hộp thoại; object trả về có <code>:Close()<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Destroy()<\/code><\/td>\n  <td>Dọn cửa sổ, gọi lại an toàn. Tạo cửa sổ xNgot mới sẽ thay cửa sổ cũ.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-lua\">Window:SetToggleKey(Enum.KeyCode.RightShift)\nWindow:SetToggleButtonPlatform(&quot;Mobile&quot;)\nWindow:EditOpenButton({Title = &quot;Mở&quot;, Icon = &quot;house&quot;, ShowText = true})\nWindow:Hide()\n<\/code><\/pre>\n<p><code>EditOpenButton<\/code> còn nhận <code>OpenIcon<\/code>, <code>Size<\/code>, <code>Position<\/code>, <code>BackgroundColor3<\/code>, <code>TextColor3<\/code>, <code>IconColor3<\/code>, <code>OpenIconColor3<\/code>, <code>CornerRadius<\/code>.<\/p>\n<h2>Lưu cấu hình<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Hàm<\/th>\n  <th>Công dụng<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>GetConfigPath()<\/code><\/td>\n  <td>Trả đường dẫn thực tế theo <code>Folder<\/code> và <code>FileSaveName<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>SaveConfig()<\/code><\/td>\n  <td>Chủ động ghi, gồm UI settings; trả kết quả thành công.<\/td>\n<\/tr>\n<tr>\n  <td><code>DeleteConfig()<\/code><\/td>\n  <td>Xóa file nếu executor hỗ trợ; trả kết quả/lỗi. Không tự reset control đang nằm trong bộ nhớ.<\/td>\n<\/tr>\n<tr>\n  <td><code>ForgetSavedKey()<\/code><\/td>\n  <td>Có khi key gate thiết lập hàm; xóa key đã lưu nếu được hỗ trợ.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>AutoSave = false<\/code> tắt ghi tự động; <code>SaveConfig()<\/code> vẫn chủ động thử ghi. Dữ liệu lưu local, không mã hóa, phụ thuộc API file của executor. Mặc định config ở <code>xNgotLibrary/Config/&lt;FileSaveName&gt;<\/code>; file config cũ hợp lệ ở gốc được sao chép khi cần, không xóa bản cũ. <code>Folder<\/code> do script tự chỉ định vẫn được giữ, có thể nằm ngoài thư mục mẹ. Mặc định key, AI và nhạc nằm trong <code>xNgotLibrary/Keys<\/code>, <code>xNgotLibrary/AI<\/code> và <code>xNgotLibrary/Music<\/code> (ảnh ở <code>Music/Covers<\/code>); đường dẫn tùy chỉnh hoặc dịch vụ ngoài có thể khác. File không được bảo vệ E2E: script khác hoặc người có quyền workspace executor có thể đọc/sửa. <code>DeleteConfig<\/code> không xóa nhạc đã tải hay key được lưu riêng.<\/p>\n<h2>API giao diện<\/h2>\n<p><code>SetUISettings(table, save)<\/code> khởi đầu từ mặc định và áp các trường đã đưa vào; đây <strong>không phải<\/strong> thao tác vá từng trường lên toàn bộ cài đặt trước đó. Khi muốn giữ, hãy truyền bảng đầy đủ. <code>save = false<\/code> bỏ qua yêu cầu lưu tương ứng.<\/p>\n<pre><code class=\"language-lua\">local settings = Window:GetUISettings()\nsettings.AccentColor = Color3.fromRGB(0, 170, 255)\nsettings.Overrides = nil -- tự xác định các trường cần override\nWindow:SetUISettings(settings, true)\nWindow:SetUISize(580, 420, true)\nprint(Window:ExportUISettings())\n<\/code><\/pre>\n<p>Các helper khác thuộc Settings gồm <code>GetUILanguage<\/code>, <code>SetUILanguage<\/code> (hiện chỉ tiếng Anh) và <code>RefreshAdminAvatar<\/code> (khi thẻ admin được tạo). Các hàm khác: <code>GetUIOverrides<\/code>, <code>ClearUIOverride(key, save)<\/code>, <code>GetUIPresets<\/code>, <code>ApplyUIPreset(name, save)<\/code>, <code>UseOriginalUI(save)<\/code>, <code>GetUISize<\/code>, <code>ResetUISize(save)<\/code>, <code>SaveUISettings<\/code>, <code>ImportUISettings(json, save)<\/code>, <code>ResetUISettings(save)<\/code>, <code>SaveUIProfile(name)<\/code>, <code>LoadUIProfile(name, save)<\/code>, <code>GetUIProfileNames<\/code>, <code>DeleteUIProfile(name)<\/code>. Profile/export có version; profile cũ có thể bị từ chối. Hãy dùng <code>GetUIPresets()<\/code> để lấy tên thật.<\/p>\n<p><code>SetUISize<\/code> giới hạn rộng 420–1000, cao 300–800. UI bản này hiện chỉ tiếng Anh; hàm thuộc phần Settings như <code>GetUILanguage<\/code> có thể không tồn tại khi <code>SettingsUI = false<\/code>.<\/p>\n"},"plain":{"en":" Window and storage APIs\n\n Window lifecycle and navigation\n\n| Method | Meaning |\n| --- | --- |\n| Window:Tab({Title, Icon}) | Create a tab. |\n| SelectTab(nameOrIndex) | Select a tab by title or user-tab index; returns boolean. |\n| Show(), Hide(), Toggle(state) | Show/hide; the key gate can prevent opening until passed. |\n| SetToggleKey(key) | Accepts an Enum.KeyCode or its name; returns current key. |\n| SetToggleButtonPlatform(\"Both\" or \"Mobile\") | Controls availability of floating open button; other values normalize to Both. |\n| GetToggleButtonPlatform() | Returns current setting. |\n| EditOpenButton(options) | Edits floating button and returns its GUI object. |\n| Divider(), OpenUISettings() | Add sidebar divider / select settings tab. |\n| Dialog(options) | Show modal; returned dialog has :Close(). |\n| Destroy() | Idempotent cleanup. Creating another xNgot window replaces this window. |\n\nlua\nWindow:SetToggleKey(Enum.KeyCode.RightShift)\nWindow:SetToggleButtonPlatform(\"Mobile\")\nWindow:EditOpenButton({Title = \"Open\", Icon = \"house\", ShowText = true})\nWindow:Hide()\n\n\nEditOpenButton also accepts OpenIcon, Size, Position, BackgroundColor3, TextColor3, IconColor3, OpenIconColor3, CornerRadius.\n\n Config persistence\n\n| Method | Meaning |\n| --- | --- |\n| GetConfigPath() | Returns the resolved path based on Folder and FileSaveName. |\n| SaveConfig() | Forces a write and includes current UI settings; returns success. |\n| DeleteConfig() | Deletes the file if supported; returns success/error. It does not reset already-loaded in-memory controls. |\n| ForgetSavedKey() | Available when a key gate sets it up; deletes saved key if supported. |\n\nWith AutoSave = false, automatic writes are disabled; explicit SaveConfig() still attempts a write. Saved data is local, not encrypted, and depends on executor filesystem functions. The default configuration path is xNgotLibrary/Config/<FileSaveName>; existing valid root config is copied on first use without deleting it. Explicit custom Folder paths remain supported and may be outside the root. Default keys, AI and music are under xNgotLibrary/Keys, xNgotLibrary/AI and xNgotLibrary/Music (covers under Music/Covers); externally configured or third-party paths can differ. Files are not E2E protected: other scripts or users with executor workspace access can read or modify them. DeleteConfig does not delete downloaded music or the separately stored key.\n\n Appearance APIs\n\nSetUISettings(table, save) starts from defaults and applies the supplied fields; it is not an incremental patch over all previous settings. Pass a complete settings table when preserving prior settings. save = false skips the corresponding save request.\n\nlua\nlocal settings = Window:GetUISettings()\nsettings.AccentColor = Color3.fromRGB(0, 170, 255)\nsettings.Overrides = nil -- derive overrides from supplied fields\nWindow:SetUISettings(settings, true)\nWindow:SetUISize(580, 420, true)\nprint(Window:ExportUISettings())\n\n\nAdditional Settings-only helpers include GetUILanguage, SetUILanguage (currently English-only) and RefreshAdminAvatar (when the admin card is built). Other methods: GetUIOverrides, ClearUIOverride(key, save), GetUIPresets, ApplyUIPreset(name, save), UseOriginalUI(save), GetUISize, ResetUISize(save), SaveUISettings, ImportUISettings(json, save), ResetUISettings(save), SaveUIProfile(name), LoadUIProfile(name, save), GetUIProfileNames, DeleteUIProfile(name). Profiles and exports use the current versioned format; legacy profiles can be rejected. Query GetUIPresets() rather than assuming names.\n\nSetUISize clamps width to 420–1000 and height to 300–800. UI language is English-only in this build; methods under Settings such as GetUILanguage are not necessarily available with SettingsUI = false.\n","vi":" API cửa sổ và lưu trữ\n\n Vòng đời và điều hướng\n\n| Hàm | Công dụng |\n| --- | --- |\n| Window:Tab({Title, Icon}) | Tạo tab. |\n| SelectTab(nameOrIndex) | Chọn theo tên hoặc số thứ tự tab người dùng; trả boolean. |\n| Show(), Hide(), Toggle(state) | Hiện/ẩn; key gate có thể chặn mở trước khi xác thực xong. |\n| SetToggleKey(key) | Nhận Enum.KeyCode hoặc tên phím, trả phím hiện tại. |\n| SetToggleButtonPlatform(\"Both\" hoặc \"Mobile\") | Chọn nền tảng cho nút nổi; giá trị khác được đưa về Both. |\n| GetToggleButtonPlatform() | Lấy cài đặt hiện tại. |\n| EditOpenButton(options) | Chỉnh nút nổi, trả về GUI object. |\n| Divider(), OpenUISettings() | Thêm đường phân cách sidebar / mở tab Settings. |\n| Dialog(options) | Mở hộp thoại; object trả về có :Close(). |\n| Destroy() | Dọn cửa sổ, gọi lại an toàn. Tạo cửa sổ xNgot mới sẽ thay cửa sổ cũ. |\n\nlua\nWindow:SetToggleKey(Enum.KeyCode.RightShift)\nWindow:SetToggleButtonPlatform(\"Mobile\")\nWindow:EditOpenButton({Title = \"Mở\", Icon = \"house\", ShowText = true})\nWindow:Hide()\n\n\nEditOpenButton còn nhận OpenIcon, Size, Position, BackgroundColor3, TextColor3, IconColor3, OpenIconColor3, CornerRadius.\n\n Lưu cấu hình\n\n| Hàm | Công dụng |\n| --- | --- |\n| GetConfigPath() | Trả đường dẫn thực tế theo Folder và FileSaveName. |\n| SaveConfig() | Chủ động ghi, gồm UI settings; trả kết quả thành công. |\n| DeleteConfig() | Xóa file nếu executor hỗ trợ; trả kết quả/lỗi. Không tự reset control đang nằm trong bộ nhớ. |\n| ForgetSavedKey() | Có khi key gate thiết lập hàm; xóa key đã lưu nếu được hỗ trợ. |\n\nAutoSave = false tắt ghi tự động; SaveConfig() vẫn chủ động thử ghi. Dữ liệu lưu local, không mã hóa, phụ thuộc API file của executor. Mặc định config ở xNgotLibrary/Config/<FileSaveName>; file config cũ hợp lệ ở gốc được sao chép khi cần, không xóa bản cũ. Folder do script tự chỉ định vẫn được giữ, có thể nằm ngoài thư mục mẹ. Mặc định key, AI và nhạc nằm trong xNgotLibrary/Keys, xNgotLibrary/AI và xNgotLibrary/Music (ảnh ở Music/Covers); đường dẫn tùy chỉnh hoặc dịch vụ ngoài có thể khác. File không được bảo vệ E2E: script khác hoặc người có quyền workspace executor có thể đọc/sửa. DeleteConfig không xóa nhạc đã tải hay key được lưu riêng.\n\n API giao diện\n\nSetUISettings(table, save) khởi đầu từ mặc định và áp các trường đã đưa vào; đây không phải thao tác vá từng trường lên toàn bộ cài đặt trước đó. Khi muốn giữ, hãy truyền bảng đầy đủ. save = false bỏ qua yêu cầu lưu tương ứng.\n\nlua\nlocal settings = Window:GetUISettings()\nsettings.AccentColor = Color3.fromRGB(0, 170, 255)\nsettings.Overrides = nil -- tự xác định các trường cần override\nWindow:SetUISettings(settings, true)\nWindow:SetUISize(580, 420, true)\nprint(Window:ExportUISettings())\n\n\nCác helper khác thuộc Settings gồm GetUILanguage, SetUILanguage (hiện chỉ tiếng Anh) và RefreshAdminAvatar (khi thẻ admin được tạo). Các hàm khác: GetUIOverrides, ClearUIOverride(key, save), GetUIPresets, ApplyUIPreset(name, save), UseOriginalUI(save), GetUISize, ResetUISize(save), SaveUISettings, ImportUISettings(json, save), ResetUISettings(save), SaveUIProfile(name), LoadUIProfile(name, save), GetUIProfileNames, DeleteUIProfile(name). Profile/export có version; profile cũ có thể bị từ chối. Hãy dùng GetUIPresets() để lấy tên thật.\n\nSetUISize giới hạn rộng 420–1000, cao 300–800. UI bản này hiện chỉ tiếng Anh; hàm thuộc phần Settings như GetUILanguage có thể không tồn tại khi SettingsUI = false.\n"}},{"id":"island-reference","num":"18","group":{"en":"DETAILED REFERENCE","vi":"THAM KHẢO CHI TIẾT"},"title":{"en":"Island API reference","vi":"API Dynamic Island"},"html":{"en":"<h1>Dynamic Island API<\/h1>\n<p>Use <code>local island = Window:GetDynamicIsland()<\/code> and check <code>if island then ... end<\/code>. The bridge is created when <code>SettingsUI<\/code> is enabled and initialization succeeds. Display waits for the menu and startup/key gate. Calling <code>Enable(true)<\/code> does not bypass that gate.<\/p>\n<h2>Display and activity<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Method<\/th>\n  <th>Behavior<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Notify(title, message, kind, duration)<\/code><\/td>\n  <td>Island notice; returns <code>false<\/code> when disabled.<\/td>\n<\/tr>\n<tr>\n  <td><code>GameplayActivity(title, message, duration, kind)<\/code><\/td>\n  <td>Temporary activity, duration clamped to 3–30 seconds.<\/td>\n<\/tr>\n<tr>\n  <td><code>Enable(boolean)<\/code><\/td>\n  <td>Enable or hide the island.<\/td>\n<\/tr>\n<tr>\n  <td><code>Expand(page)<\/code>, <code>Collapse()<\/code><\/td>\n  <td>Open a page or close the expanded view. Common pages: <code>Home<\/code>, <code>Music<\/code>, <code>Cross<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Set(&quot;Fps&quot; / &quot;Ping&quot; / &quot;Clock&quot;, boolean)<\/code><\/td>\n  <td>Toggle activity. Other existing Settings keys may be set by name.<\/td>\n<\/tr>\n<tr>\n  <td><code>Theme(index)<\/code>, <code>Accent(index)<\/code><\/td>\n  <td>Set palette/accent by numeric index, clamped.<\/td>\n<\/tr>\n<tr>\n  <td><code>State()<\/code><\/td>\n  <td>Table with <code>Cross<\/code>, <code>Playing<\/code>, <code>MusicIndex<\/code>, <code>FPS<\/code>, <code>Ping<\/code>, <code>Timer<\/code>, <code>Island<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Destroy()<\/code><\/td>\n  <td>Shut down this island; use <code>Window:Destroy()<\/code> for full window cleanup.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>Window:NotifyIsland(title, message, kind, duration)<\/code> and <code>Window:IslandActivity(title, message, duration, kind)<\/code> are safe bridge helpers that return false if the island is unavailable. Notice that the order of <strong>kind and duration<\/strong> differs between the two methods.<\/p>\n<h2>Timers and stopwatch<\/h2>\n<pre><code class=\"language-lua\">local island = Window:GetDynamicIsland()\nif island then\n    island:Timer(120)       -- 1–86400 seconds\n    island:ExtendTimer(30)\n    island:StopTimer()\n    island:WatchToggle()    -- start/pause\n    island:WatchLap()\n    island:WatchReset()\nend\n<\/code><\/pre>\n<h2>Cross assistant<\/h2>\n<p>In <strong>Settings → Open Dynamic Island Settings → Cross AI Assistant<\/strong>, turn on <strong>Enable Cross AI<\/strong>, enter a command such as <code>next song<\/code> or <code>timer 60<\/code>, and press <strong>Send to Cross AI<\/strong>. The response appears in the section. <strong>Open Cross AI on Island<\/strong> opens the island interface (enable the island first); <strong>Clear Cross AI chat<\/strong> clears the session. The input is not written to window config, but music-search commands may be sent to third-party search services; never enter secrets. This is a local, rule-based assistant, not a general online AI chatbot.<\/p>\n<p><code>AiState()<\/code> returns a snapshot with <code>Enabled<\/code>, <code>Thinking<\/code>, <code>Reply<\/code>, <code>Version<\/code> and <code>Pending<\/code> (latest assistant response, not the full chat). <code>AiAsk<\/code> may yield during music resolution; use a task when needed.<\/p>\n<p><code>AiEnable(boolean)<\/code>, <code>AiOpen()<\/code>, <code>AiAsk(text)<\/code>, <code>AiClear()<\/code> and <code>AiPermission(name, boolean)<\/code> control the local assistant. <code>Ui<\/code>, <code>Key<\/code>, and <code>Body<\/code> permissions can be configured. <code>Body<\/code> defaults on for confirmed local-character movement commands; calling <code>AiPermission(&quot;Body&quot;, false)<\/code> immediately stops them. <code>Free<\/code> remains forced off. <code>MusicAiLearn(title, good)<\/code> records feedback when supported; <code>DemoDownload()<\/code> displays simulated progress rather than downloading a real file. <code>MusicAiOnline(true)<\/code> does not enable an online model in this build; <code>MusicAiOnlineState()<\/code> reports removed/local. Do not assume it calls an external AI service.<\/p>\n<p><code>SetLanguage<\/code> / <code>Set(&quot;Language&quot;, ...)<\/code> currently force English. The documentation language switch is independent of the library UI language.<\/p>\n","vi":"<h1>API Dynamic Island<\/h1>\n<p>Dùng <code>local island = Window:GetDynamicIsland()<\/code> và kiểm tra <code>if island then ... end<\/code>. Bridge được tạo khi bật <code>SettingsUI<\/code> và khởi tạo thành công. Island chỉ hiện sau khi menu và loader/key gate hoàn tất; <code>Enable(true)<\/code> không vượt qua key gate.<\/p>\n<h2>Hiển thị và hoạt động<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Hàm<\/th>\n  <th>Cách hoạt động<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Notify(title, message, kind, duration)<\/code><\/td>\n  <td>Thông báo; trả <code>false<\/code> khi island tắt.<\/td>\n<\/tr>\n<tr>\n  <td><code>GameplayActivity(title, message, duration, kind)<\/code><\/td>\n  <td>Hoạt động tạm thời, thời lượng giới hạn 3–30 giây.<\/td>\n<\/tr>\n<tr>\n  <td><code>Enable(boolean)<\/code><\/td>\n  <td>Bật hoặc ẩn island.<\/td>\n<\/tr>\n<tr>\n  <td><code>Expand(page)<\/code>, <code>Collapse()<\/code><\/td>\n  <td>Mở trang hoặc thu gọn. Trang thường dùng: <code>Home<\/code>, <code>Music<\/code>, <code>Cross<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Set(&quot;Fps&quot; / &quot;Ping&quot; / &quot;Clock&quot;, boolean)<\/code><\/td>\n  <td>Bật/tắt hoạt động. Một số key đã có trong Settings cũng có thể chỉnh bằng tên.<\/td>\n<\/tr>\n<tr>\n  <td><code>Theme(index)<\/code>, <code>Accent(index)<\/code><\/td>\n  <td>Chọn bảng màu/màu nhấn bằng chỉ số, có giới hạn.<\/td>\n<\/tr>\n<tr>\n  <td><code>State()<\/code><\/td>\n  <td>Trả bảng <code>Cross<\/code>, <code>Playing<\/code>, <code>MusicIndex<\/code>, <code>FPS<\/code>, <code>Ping<\/code>, <code>Timer<\/code>, <code>Island<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Destroy()<\/code><\/td>\n  <td>Dọn island; dùng <code>Window:Destroy()<\/code> để dọn toàn bộ cửa sổ.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>Window:NotifyIsland(title, message, kind, duration)<\/code> và <code>Window:IslandActivity(title, message, duration, kind)<\/code> là bridge trả false nếu island không sẵn sàng. Chú ý thứ tự <strong>kind và duration<\/strong> khác nhau giữa hai hàm.<\/p>\n<h2>Hẹn giờ và đồng hồ bấm giờ<\/h2>\n<pre><code class=\"language-lua\">local island = Window:GetDynamicIsland()\nif island then\n    island:Timer(120)       -- 1–86400 giây\n    island:ExtendTimer(30)\n    island:StopTimer()\n    island:WatchToggle()    -- chạy/tạm dừng\n    island:WatchLap()\n    island:WatchReset()\nend\n<\/code><\/pre>\n<h2>Trợ lý Cross<\/h2>\n<p>Vào <strong>Settings → Open Dynamic Island Settings → Cross AI Assistant<\/strong>, bật <strong>Enable Cross AI<\/strong>, nhập lệnh như <code>next song<\/code> hoặc <code>hẹn giờ 60 giây<\/code> rồi nhấn <strong>Send to Cross AI<\/strong>. Câu trả lời hiện trong mục này. <strong>Open Cross AI on Island<\/strong> mở giao diện trên đảo (cần bật island trước); <strong>Clear Cross AI chat<\/strong> xóa hội thoại trong phiên. Ô nhập không ghi vào config cửa sổ, nhưng lệnh tìm nhạc có thể gửi đến dịch vụ tìm kiếm bên thứ ba; không nhập thông tin bí mật. Đây là trợ lý local theo quy tắc, không phải chatbot AI online tổng quát.<\/p>\n<p><code>AiState()<\/code> trả bảng <code>Enabled<\/code>, <code>Thinking<\/code>, <code>Reply<\/code>, <code>Version<\/code>, <code>Pending<\/code> (câu trả lời mới nhất, không phải toàn bộ lịch sử). <code>AiAsk<\/code> có thể yield khi xử lý nhạc; dùng task khi cần.<\/p>\n<p><code>AiEnable(boolean)<\/code>, <code>AiOpen()<\/code>, <code>AiAsk(text)<\/code>, <code>AiClear()<\/code> và <code>AiPermission(name, boolean)<\/code> điều khiển trợ lý local. Có thể cấu hình quyền <code>Ui<\/code>, <code>Key<\/code> và <code>Body<\/code>. <code>Body<\/code> mặc định bật cho các lệnh di chuyển nhân vật local sau xác nhận; <code>AiPermission(&quot;Body&quot;, false)<\/code> dừng ngay các lệnh đó. <code>Free<\/code> vẫn bị khóa tắt. <code>MusicAiLearn(title, good)<\/code> ghi nhận phản hồi nếu engine hỗ trợ; <code>DemoDownload()<\/code> chỉ mô phỏng tiến trình, không tải file thật. <code>MusicAiOnline(true)<\/code> không bật AI online ở bản này; <code>MusicAiOnlineState()<\/code> báo removed/local. Không nên hiểu tính năng này là gọi một AI online.<\/p>\n<p><code>SetLanguage<\/code> / <code>Set(&quot;Language&quot;, ...)<\/code> hiện ép về tiếng Anh. Nút đổi ngôn ngữ tài liệu là độc lập với ngôn ngữ UI thư viện.<\/p>\n"},"plain":{"en":" Dynamic Island API\n\nUse local island = Window:GetDynamicIsland() and check if island then ... end. The bridge is created when SettingsUI is enabled and initialization succeeds. Display waits for the menu and startup/key gate. Calling Enable(true) does not bypass that gate.\n\n Display and activity\n\n| Method | Behavior |\n| --- | --- |\n| Notify(title, message, kind, duration) | Island notice; returns false when disabled. |\n| GameplayActivity(title, message, duration, kind) | Temporary activity, duration clamped to 3–30 seconds. |\n| Enable(boolean) | Enable or hide the island. |\n| Expand(page), Collapse() | Open a page or close the expanded view. Common pages: Home, Music, Cross. |\n| Set(\"Fps\" / \"Ping\" / \"Clock\", boolean) | Toggle activity. Other existing Settings keys may be set by name. |\n| Theme(index), Accent(index) | Set palette/accent by numeric index, clamped. |\n| State() | Table with Cross, Playing, MusicIndex, FPS, Ping, Timer, Island. |\n| Destroy() | Shut down this island; use Window:Destroy() for full window cleanup. |\n\nWindow:NotifyIsland(title, message, kind, duration) and Window:IslandActivity(title, message, duration, kind) are safe bridge helpers that return false if the island is unavailable. Notice that the order of kind and duration differs between the two methods.\n\n Timers and stopwatch\n\nlua\nlocal island = Window:GetDynamicIsland()\nif island then\n    island:Timer(120)       -- 1–86400 seconds\n    island:ExtendTimer(30)\n    island:StopTimer()\n    island:WatchToggle()    -- start/pause\n    island:WatchLap()\n    island:WatchReset()\nend\n\n\n Cross assistant\n\nIn Settings → Open Dynamic Island Settings → Cross AI Assistant, turn on Enable Cross AI, enter a command such as next song or timer 60, and press Send to Cross AI. The response appears in the section. Open Cross AI on Island opens the island interface (enable the island first); Clear Cross AI chat clears the session. The input is not written to window config, but music-search commands may be sent to third-party search services; never enter secrets. This is a local, rule-based assistant, not a general online AI chatbot.\n\nAiState() returns a snapshot with Enabled, Thinking, Reply, Version and Pending (latest assistant response, not the full chat). AiAsk may yield during music resolution; use a task when needed.\n\nAiEnable(boolean), AiOpen(), AiAsk(text), AiClear() and AiPermission(name, boolean) control the local assistant. Ui, Key, and Body permissions can be configured. Body defaults on for confirmed local-character movement commands; calling AiPermission(\"Body\", false) immediately stops them. Free remains forced off. MusicAiLearn(title, good) records feedback when supported; DemoDownload() displays simulated progress rather than downloading a real file. MusicAiOnline(true) does not enable an online model in this build; MusicAiOnlineState() reports removed/local. Do not assume it calls an external AI service.\n\nSetLanguage / Set(\"Language\", ...) currently force English. The documentation language switch is independent of the library UI language.\n","vi":" API Dynamic Island\n\nDùng local island = Window:GetDynamicIsland() và kiểm tra if island then ... end. Bridge được tạo khi bật SettingsUI và khởi tạo thành công. Island chỉ hiện sau khi menu và loader/key gate hoàn tất; Enable(true) không vượt qua key gate.\n\n Hiển thị và hoạt động\n\n| Hàm | Cách hoạt động |\n| --- | --- |\n| Notify(title, message, kind, duration) | Thông báo; trả false khi island tắt. |\n| GameplayActivity(title, message, duration, kind) | Hoạt động tạm thời, thời lượng giới hạn 3–30 giây. |\n| Enable(boolean) | Bật hoặc ẩn island. |\n| Expand(page), Collapse() | Mở trang hoặc thu gọn. Trang thường dùng: Home, Music, Cross. |\n| Set(\"Fps\" / \"Ping\" / \"Clock\", boolean) | Bật/tắt hoạt động. Một số key đã có trong Settings cũng có thể chỉnh bằng tên. |\n| Theme(index), Accent(index) | Chọn bảng màu/màu nhấn bằng chỉ số, có giới hạn. |\n| State() | Trả bảng Cross, Playing, MusicIndex, FPS, Ping, Timer, Island. |\n| Destroy() | Dọn island; dùng Window:Destroy() để dọn toàn bộ cửa sổ. |\n\nWindow:NotifyIsland(title, message, kind, duration) và Window:IslandActivity(title, message, duration, kind) là bridge trả false nếu island không sẵn sàng. Chú ý thứ tự kind và duration khác nhau giữa hai hàm.\n\n Hẹn giờ và đồng hồ bấm giờ\n\nlua\nlocal island = Window:GetDynamicIsland()\nif island then\n    island:Timer(120)       -- 1–86400 giây\n    island:ExtendTimer(30)\n    island:StopTimer()\n    island:WatchToggle()    -- chạy/tạm dừng\n    island:WatchLap()\n    island:WatchReset()\nend\n\n\n Trợ lý Cross\n\nVào Settings → Open Dynamic Island Settings → Cross AI Assistant, bật Enable Cross AI, nhập lệnh như next song hoặc hẹn giờ 60 giây rồi nhấn Send to Cross AI. Câu trả lời hiện trong mục này. Open Cross AI on Island mở giao diện trên đảo (cần bật island trước); Clear Cross AI chat xóa hội thoại trong phiên. Ô nhập không ghi vào config cửa sổ, nhưng lệnh tìm nhạc có thể gửi đến dịch vụ tìm kiếm bên thứ ba; không nhập thông tin bí mật. Đây là trợ lý local theo quy tắc, không phả

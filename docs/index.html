\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(value)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Single: string or nil; multi: array<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>Select(value)<\/code> (returns selected value or nil), <code>Refresh(values)<\/code> (returns selection), <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Notes<\/h2>\n<p>Callback runs on creation and Select. For multi-select, Select toggles each named item rather than replacing the entire selection. Single AllowNone represents None as an empty string in callbacks; multi receives an array. Refresh resets the selection and saves it but does not call Callback. With multi and AllowNone=false, the first option is used if no initial selection exists.<\/p>\n","vi":"<h1>Dropdown<\/h1>\n<p>Chọn một hoặc nhiều mục.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local mode = Tab:Dropdown({\n    Title = &quot;Mode&quot;, Values = {&quot;Normal&quot;, &quot;Fast&quot;}, Value = &quot;Normal&quot;,\n    Callback = function(value) print(&quot;Mode:&quot;, value) end,\n})\nmode:Select(&quot;Fast&quot;)\nlocal colors = Tab:Dropdown({\n    Title = &quot;Colors&quot;, Values = {&quot;Red&quot;, &quot;Blue&quot;, &quot;Green&quot;},\n    Multi = true, AllowNone = true, Value = {&quot;Red&quot;},\n    Callback = function(values) print(&quot;Selected:&quot;, table.concat(values, &quot;, &quot;)) end,\n})\ncolors:Select({&quot;Blue&quot;, &quot;Green&quot;})\n-- mode:Refresh({&quot;Normal&quot;, &quot;Fast&quot;, &quot;Slow&quot;})\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Dropdown / nil<\/code><\/td>\n  <td>Nhãn và mô tả<\/td>\n<\/tr>\n<tr>\n  <td><code>Values<\/code><\/td>\n  <td>array of strings<\/td>\n  <td><code>{}<\/code><\/td>\n  <td>Danh sách lựa chọn<\/td>\n<\/tr>\n<tr>\n  <td><code>Value / Default<\/code><\/td>\n  <td>string or array<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Lựa chọn ban đầu<\/td>\n<\/tr>\n<tr>\n  <td><code>Multi<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Cho phép chọn nhiều<\/td>\n<\/tr>\n<tr>\n  <td><code>AllowNone<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Cho phép không chọn<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Khóa tương tác<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(value)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Một mục: string hoặc nil; nhiều mục: mảng<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>Select(value)<\/code> (returns selected value or nil), <code>Refresh(values)<\/code> (returns selection), <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Callback chạy khi tạo và Select. Với multi, Select đảo trạng thái từng mục được truyền, không thay toàn bộ lựa chọn. Một lựa chọn với AllowNone biểu diễn None bằng chuỗi rỗng trong callback; multi nhận mảng. Refresh đặt lại lựa chọn và lưu nhưng không gọi Callback. Multi với AllowNone=false chọn mục đầu nếu ban đầu chưa chọn.<\/p>\n"},"plain":{"en":" Dropdown\n\nPick one or multiple options.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal mode = Tab:Dropdown({\n    Title = \"Mode\", Values = {\"Normal\", \"Fast\"}, Value = \"Normal\",\n    Callback = function(value) print(\"Mode:\", value) end,\n})\nmode:Select(\"Fast\")\nlocal colors = Tab:Dropdown({\n    Title = \"Colors\", Values = {\"Red\", \"Blue\", \"Green\"},\n    Multi = true, AllowNone = true, Value = {\"Red\"},\n    Callback = function(values) print(\"Selected:\", table.concat(values, \", \")) end,\n})\ncolors:Select({\"Blue\", \"Green\"})\n-- mode:Refresh({\"Normal\", \"Fast\", \"Slow\"})\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Title / Desc | string | Dropdown / nil | Label and description |\n| Values | array of strings | {} | Available items |\n| Value / Default | string or array | nil | Initial selection |\n| Multi | boolean | false | Allow multiple selections |\n| AllowNone | boolean | false | Allow no selection |\n| Locked | boolean | false | Disable interaction |\n| Callback | function(value) | no-op | Single: string or nil; multi: array |\n\n Returned object\n\nSelect(value) (returns selected value or nil), Refresh(values) (returns selection), SetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Notes\n\nCallback runs on creation and Select. For multi-select, Select toggles each named item rather than replacing the entire selection. Single AllowNone represents None as an empty string in callbacks; multi receives an array. Refresh resets the selection and saves it but does not call Callback. With multi and AllowNone=false, the first option is used if no initial selection exists.\n","vi":" Dropdown\n\nChọn một hoặc nhiều mục.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal mode = Tab:Dropdown({\n    Title = \"Mode\", Values = {\"Normal\", \"Fast\"}, Value = \"Normal\",\n    Callback = function(value) print(\"Mode:\", value) end,\n})\nmode:Select(\"Fast\")\nlocal colors = Tab:Dropdown({\n    Title = \"Colors\", Values = {\"Red\", \"Blue\", \"Green\"},\n    Multi = true, AllowNone = true, Value = {\"Red\"},\n    Callback = function(values) print(\"Selected:\", table.concat(values, \", \")) end,\n})\ncolors:Select({\"Blue\", \"Green\"})\n-- mode:Refresh({\"Normal\", \"Fast\", \"Slow\"})\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Title / Desc | string | Dropdown / nil | Nhãn và mô tả |\n| Values | array of strings | {} | Danh sách lựa chọn |\n| Value / Default | string or array | nil | Lựa chọn ban đầu |\n| Multi | boolean | false | Cho phép chọn nhiều |\n| AllowNone | boolean | false | Cho phép không chọn |\n| Locked | boolean | false | Khóa tương tác |\n| Callback | function(value) | no-op | Một mục: string hoặc nil; nhiều mục: mảng |\n\n Đối tượng trả về\n\nSelect(value) (returns selected value or nil), Refresh(values) (returns selection), SetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Lưu ý\n\nCallback chạy khi tạo và Select. Với multi, Select đảo trạng thái từng mục được truyền, không thay toàn bộ lựa chọn. Một lựa chọn với AllowNone biểu diễn None bằng chuỗi rỗng trong callback; multi nhận mảng. Refresh đặt lại lựa chọn và lưu nhưng không gọi Callback. Multi với AllowNone=false chọn mục đầu nếu ban đầu chưa chọn.\n"}},{"id":"control-colorpicker","num":"29","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Colorpicker","vi":"Colorpicker"},"html":{"en":"<h1>Colorpicker<\/h1>\n<p>Pick and observe a Color3 value.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local color = Tab:Colorpicker({\n    Title = &quot;Accent example&quot;, Default = &quot;#66AAFF&quot;,\n    Callback = function(value) print(&quot;Color:&quot;, value) end,\n})\ncolor:Set(Color3.fromRGB(255, 120, 80))\nprint(color:Get())\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Color / empty<\/code><\/td>\n  <td>Label and description<\/td>\n<\/tr>\n<tr>\n  <td><code>Default / Value<\/code><\/td>\n  <td>Color3, hex string or RGB table<\/td>\n  <td><code>white<\/code><\/td>\n  <td>Initial color<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Disable interaction<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(Color3)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Receives Color3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>Set(value)<\/code>, <code>Get()<\/code> → Color3, <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Notes<\/h2>\n<p>Accepts Color3, <code>#RRGGBB<\/code>, or an RGB table. Invalid input falls back to white. Callback runs on creation and Set; this example does not change the global UI theme.<\/p>\n","vi":"<h1>Colorpicker<\/h1>\n<p>Chọn màu và nhận giá trị Color3.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local color = Tab:Colorpicker({\n    Title = &quot;Accent example&quot;, Default = &quot;#66AAFF&quot;,\n    Callback = function(value) print(&quot;Color:&quot;, value) end,\n})\ncolor:Set(Color3.fromRGB(255, 120, 80))\nprint(color:Get())\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Color / empty<\/code><\/td>\n  <td>Nhãn và mô tả<\/td>\n<\/tr>\n<tr>\n  <td><code>Default / Value<\/code><\/td>\n  <td>Color3, hex string or RGB table<\/td>\n  <td><code>white<\/code><\/td>\n  <td>Màu ban đầu<\/td>\n<\/tr>\n<tr>\n  <td><code>Locked<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Khóa tương tác<\/td>\n<\/tr>\n<tr>\n  <td><code>Callback<\/code><\/td>\n  <td>function(Color3)<\/td>\n  <td><code>no-op<\/code><\/td>\n  <td>Nhận Color3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>Set(value)<\/code>, <code>Get()<\/code> → Color3, <code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Lock()<\/code>, <code>Unlock()<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Nhận Color3, <code>#RRGGBB<\/code> hoặc bảng RGB. Đầu vào không hợp lệ trở về trắng. Callback chạy khi tạo và Set; ví dụ này không tự đổi theme toàn UI.<\/p>\n"},"plain":{"en":" Colorpicker\n\nPick and observe a Color3 value.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal color = Tab:Colorpicker({\n    Title = \"Accent example\", Default = \"66AAFF\",\n    Callback = function(value) print(\"Color:\", value) end,\n})\ncolor:Set(Color3.fromRGB(255, 120, 80))\nprint(color:Get())\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Title / Desc | string | Color / empty | Label and description |\n| Default / Value | Color3, hex string or RGB table | white | Initial color |\n| Locked | boolean | false | Disable interaction |\n| Callback | function(Color3) | no-op | Receives Color3 |\n\n Returned object\n\nSet(value), Get() → Color3, SetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Notes\n\nAccepts Color3, RRGGBB, or an RGB table. Invalid input falls back to white. Callback runs on creation and Set; this example does not change the global UI theme.\n","vi":" Colorpicker\n\nChọn màu và nhận giá trị Color3.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal color = Tab:Colorpicker({\n    Title = \"Accent example\", Default = \"66AAFF\",\n    Callback = function(value) print(\"Color:\", value) end,\n})\ncolor:Set(Color3.fromRGB(255, 120, 80))\nprint(color:Get())\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Title / Desc | string | Color / empty | Nhãn và mô tả |\n| Default / Value | Color3, hex string or RGB table | white | Màu ban đầu |\n| Locked | boolean | false | Khóa tương tác |\n| Callback | function(Color3) | no-op | Nhận Color3 |\n\n Đối tượng trả về\n\nSet(value), Get() → Color3, SetTitle(text), SetDesc(text), Lock(), Unlock(), Destroy()\n\n Lưu ý\n\nNhận Color3, RRGGBB hoặc bảng RGB. Đầu vào không hợp lệ trở về trắng. Callback chạy khi tạo và Set; ví dụ này không tự đổi theme toàn UI.\n"}},{"id":"control-paragraph","num":"30","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Paragraph","vi":"Paragraph"},"html":{"en":"<h1>Paragraph<\/h1>\n<p>Display a title and descriptive text.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local status = Tab:Paragraph({ Title = &quot;Status&quot;, Desc = &quot;Ready&quot; })\nstatus:SetDesc(&quot;Running&quot;)\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Paragraph<\/code><\/td>\n  <td>Heading<\/td>\n<\/tr>\n<tr>\n  <td><code>Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Body<\/td>\n<\/tr>\n<tr>\n  <td><code>RichText<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Interpret Roblox RichText tags<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Notes<\/h2>\n<p>This is a display element, not a persistent value control.<\/p>\n","vi":"<h1>Paragraph<\/h1>\n<p>Hiển thị tiêu đề và nội dung.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local status = Tab:Paragraph({ Title = &quot;Status&quot;, Desc = &quot;Ready&quot; })\nstatus:SetDesc(&quot;Running&quot;)\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Paragraph<\/code><\/td>\n  <td>Tiêu đề<\/td>\n<\/tr>\n<tr>\n  <td><code>Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>nil<\/code><\/td>\n  <td>Nội dung<\/td>\n<\/tr>\n<tr>\n  <td><code>RichText<\/code><\/td>\n  <td>boolean<\/td>\n  <td><code>false<\/code><\/td>\n  <td>Cho phép tag Roblox RichText<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>SetTitle(text)<\/code>, <code>SetDesc(text)<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Đây là phần hiển thị, không phải control lưu giá trị.<\/p>\n"},"plain":{"en":" Paragraph\n\nDisplay a title and descriptive text.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal status = Tab:Paragraph({ Title = \"Status\", Desc = \"Ready\" })\nstatus:SetDesc(\"Running\")\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Title | string | Paragraph | Heading |\n| Desc | string | nil | Body |\n| RichText | boolean | false | Interpret Roblox RichText tags |\n\n Returned object\n\nSetTitle(text), SetDesc(text), Destroy()\n\n Notes\n\nThis is a display element, not a persistent value control.\n","vi":" Paragraph\n\nHiển thị tiêu đề và nội dung.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal status = Tab:Paragraph({ Title = \"Status\", Desc = \"Ready\" })\nstatus:SetDesc(\"Running\")\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Title | string | Paragraph | Tiêu đề |\n| Desc | string | nil | Nội dung |\n| RichText | boolean | false | Cho phép tag Roblox RichText |\n\n Đối tượng trả về\n\nSetTitle(text), SetDesc(text), Destroy()\n\n Lưu ý\n\nĐây là phần hiển thị, không phải control lưu giá trị.\n"}},{"id":"control-code","num":"31","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Code","vi":"Code"},"html":{"en":"<h1>Code<\/h1>\n<p>Show a code block in the window.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local code = Tab:Code({ Title = &quot;Example&quot;, Code = 'print(&quot;Hello&quot;)' })\ncode:SetCode('print(&quot;Updated&quot;)')\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Code<\/code><\/td>\n  <td>Heading<\/td>\n<\/tr>\n<tr>\n  <td><code>Code<\/code><\/td>\n  <td>string<\/td>\n  <td><code>empty<\/code><\/td>\n  <td>Code content<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p><code>SetTitle(text)<\/code>, <code>SetCode(text)<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Notes<\/h2>\n<p>Displays text; it does not execute that text.<\/p>\n","vi":"<h1>Code<\/h1>\n<p>Hiển thị khối code trong cửa sổ.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local code = Tab:Code({ Title = &quot;Example&quot;, Code = 'print(&quot;Hello&quot;)' })\ncode:SetCode('print(&quot;Updated&quot;)')\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Code<\/code><\/td>\n  <td>Tiêu đề<\/td>\n<\/tr>\n<tr>\n  <td><code>Code<\/code><\/td>\n  <td>string<\/td>\n  <td><code>empty<\/code><\/td>\n  <td>Nội dung code<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p><code>SetTitle(text)<\/code>, <code>SetCode(text)<\/code>, <code>Destroy()<\/code><\/p>\n<h2>Lưu ý<\/h2>\n<p>Chỉ hiển thị văn bản; không thực thi đoạn đó.<\/p>\n"},"plain":{"en":" Code\n\nShow a code block in the window.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal code = Tab:Code({ Title = \"Example\", Code = 'print(\"Hello\")' })\ncode:SetCode('print(\"Updated\")')\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Title | string | Code | Heading |\n| Code | string | empty | Code content |\n\n Returned object\n\nSetTitle(text), SetCode(text), Destroy()\n\n Notes\n\nDisplays text; it does not execute that text.\n","vi":" Code\n\nHiển thị khối code trong cửa sổ.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal code = Tab:Code({ Title = \"Example\", Code = 'print(\"Hello\")' })\ncode:SetCode('print(\"Updated\")')\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Title | string | Code | Tiêu đề |\n| Code | string | empty | Nội dung code |\n\n Đối tượng trả về\n\nSetTitle(text), SetCode(text), Destroy()\n\n Lưu ý\n\nChỉ hiển thị văn bản; không thực thi đoạn đó.\n"}},{"id":"control-community","num":"32","group":{"en":"CONTROLS","vi":"CONTROL"},"title":{"en":"Discord & InfoNguyenNhat","vi":"Discord & InfoNguyenNhat"},"html":{"en":"<h1>Discord &amp; InfoNguyenNhat<\/h1>\n<p>Display community and profile cards.<\/p>\n<p>First see <strong>Control guides: start here<\/strong>; append this snippet below the setup.<\/p>\n<pre><code class=\"language-lua\">local discord = Tab:Discord({ Name = &quot;Community&quot;, Desc = &quot;Join us&quot;, InviteLink = &quot;discord.gg/example&quot; })\nlocal info = Tab:InfoNguyenNhat({ Name = &quot;Developer&quot;, Bio = &quot;Building a hub&quot; })\ninfo:SetBio(&quot;Welcome!&quot;)\n-- discord:SetInvite(&quot;discord.gg/example&quot;, &quot;example&quot;)\n<\/code><\/pre>\n<h2>Options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Name<\/th>\n  <th>Type<\/th>\n  <th>Default<\/th>\n  <th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Discord.Avatar<\/code><\/td>\n  <td>string<\/td>\n  <td><code>rbxassetid://0<\/code><\/td>\n  <td>Avatar asset<\/td>\n<\/tr>\n<tr>\n  <td><code>Discord.Name / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Discord Server / empty<\/code><\/td>\n  <td>Server text<\/td>\n<\/tr>\n<tr>\n  <td><code>Discord.InviteLink / InviteCode<\/code><\/td>\n  <td>string<\/td>\n  <td><code>discord.gg/xxxxxxx / nil<\/code><\/td>\n  <td>Invite URL and optional code<\/td>\n<\/tr>\n<tr>\n  <td><code>Info.Avatar / Name / Bio<\/code><\/td>\n  <td>string<\/td>\n  <td><code>rbxassetid://0 / Nguyen Nhat / empty<\/code><\/td>\n  <td>Profile fields<\/td>\n<\/tr>\n<tr>\n  <td><code>Info.Badges<\/code><\/td>\n  <td>table<\/td>\n  <td><code>{}<\/code><\/td>\n  <td>Badge list<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Returned object<\/h2>\n<p>Discord: <code>SetInvite(link, code)<\/code>, <code>Destroy()<\/code>. Info: <code>SetAvatar(id)<\/code>, <code>SetName(text)<\/code>, <code>SetBio(text)<\/code>, <code>Destroy()<\/code>, <code>Info.AddSocialIcon(icon, copyValue, order)<\/code> (dot call).<\/p>\n<h2>Notes<\/h2>\n<p>Invite and avatar/network behavior depends on the executor and live services; placeholders are not real invites.<\/p>\n","vi":"<h1>Discord &amp; InfoNguyenNhat<\/h1>\n<p>Hiển thị thẻ cộng đồng và hồ sơ.<\/p>\n<p>Trước tiên xem trang <strong>Control: bắt đầu tại đây<\/strong>; thêm đoạn này bên dưới phần khởi tạo.<\/p>\n<pre><code class=\"language-lua\">local discord = Tab:Discord({ Name = &quot;Community&quot;, Desc = &quot;Join us&quot;, InviteLink = &quot;discord.gg/example&quot; })\nlocal info = Tab:InfoNguyenNhat({ Name = &quot;Developer&quot;, Bio = &quot;Building a hub&quot; })\ninfo:SetBio(&quot;Welcome!&quot;)\n-- discord:SetInvite(&quot;discord.gg/example&quot;, &quot;example&quot;)\n<\/code><\/pre>\n<h2>Tùy chọn<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tên<\/th>\n  <th>Kiểu<\/th>\n  <th>Mặc định<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Discord.Avatar<\/code><\/td>\n  <td>string<\/td>\n  <td><code>rbxassetid://0<\/code><\/td>\n  <td>Asset avatar<\/td>\n<\/tr>\n<tr>\n  <td><code>Discord.Name / Desc<\/code><\/td>\n  <td>string<\/td>\n  <td><code>Discord Server / empty<\/code><\/td>\n  <td>Tên và mô tả server<\/td>\n<\/tr>\n<tr>\n  <td><code>Discord.InviteLink / InviteCode<\/code><\/td>\n  <td>string<\/td>\n  <td><code>discord.gg/xxxxxxx / nil<\/code><\/td>\n  <td>Link mời và code tùy chọn<\/td>\n<\/tr>\n<tr>\n  <td><code>Info.Avatar / Name / Bio<\/code><\/td>\n  <td>string<\/td>\n  <td><code>rbxassetid://0 / Nguyen Nhat / empty<\/code><\/td>\n  <td>Thông tin hồ sơ<\/td>\n<\/tr>\n<tr>\n  <td><code>Info.Badges<\/code><\/td>\n  <td>table<\/td>\n  <td><code>{}<\/code><\/td>\n  <td>Danh sách badge<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Đối tượng trả về<\/h2>\n<p>Discord: <code>SetInvite(link, code)<\/code>, <code>Destroy()<\/code>. Info: <code>SetAvatar(id)<\/code>, <code>SetName(text)<\/code>, <code>SetBio(text)<\/code>, <code>Destroy()<\/code>, <code>Info.AddSocialIcon(icon, copyValue, order)<\/code> (dot call).<\/p>\n<h2>Lưu ý<\/h2>\n<p>Hoạt động của invite, avatar và mạng phụ thuộc executor/dịch vụ; ví dụ link chỉ là placeholder.<\/p>\n"},"plain":{"en":" Discord & InfoNguyenNhat\n\nDisplay community and profile cards.\n\nFirst see Control guides: start here; append this snippet below the setup.\n\nlua\nlocal discord = Tab:Discord({ Name = \"Community\", Desc = \"Join us\", InviteLink = \"discord.gg/example\" })\nlocal info = Tab:InfoNguyenNhat({ Name = \"Developer\", Bio = \"Building a hub\" })\ninfo:SetBio(\"Welcome!\")\n-- discord:SetInvite(\"discord.gg/example\", \"example\")\n\n\n Options\n\n| Name | Type | Default | Meaning |\n| --- | --- | --- | --- |\n| Discord.Avatar | string | rbxassetid://0 | Avatar asset |\n| Discord.Name / Desc | string | Discord Server / empty | Server text |\n| Discord.InviteLink / InviteCode | string | discord.gg/xxxxxxx / nil | Invite URL and optional code |\n| Info.Avatar / Name / Bio | string | rbxassetid://0 / Nguyen Nhat / empty | Profile fields |\n| Info.Badges | table | {} | Badge list |\n\n Returned object\n\nDiscord: SetInvite(link, code), Destroy(). Info: SetAvatar(id), SetName(text), SetBio(text), Destroy(), Info.AddSocialIcon(icon, copyValue, order) (dot call).\n\n Notes\n\nInvite and avatar/network behavior depends on the executor and live services; placeholders are not real invites.\n","vi":" Discord & InfoNguyenNhat\n\nHiển thị thẻ cộng đồng và hồ sơ.\n\nTrước tiên xem trang Control: bắt đầu tại đây; thêm đoạn này bên dưới phần khởi tạo.\n\nlua\nlocal discord = Tab:Discord({ Name = \"Community\", Desc = \"Join us\", InviteLink = \"discord.gg/example\" })\nlocal info = Tab:InfoNguyenNhat({ Name = \"Developer\", Bio = \"Building a hub\" })\ninfo:SetBio(\"Welcome!\")\n-- discord:SetInvite(\"discord.gg/example\", \"example\")\n\n\n Tùy chọn\n\n| Tên | Kiểu | Mặc định | Ý nghĩa |\n| --- | --- | --- | --- |\n| Discord.Avatar | string | rbxassetid://0 | Asset avatar |\n| Discord.Name / Desc | string | Discord Server / empty | Tên và mô tả server |\n| Discord.InviteLink / InviteCode | string | discord.gg/xxxxxxx / nil | Link mời và code tùy chọn |\n| Info.Avatar / Name / Bio | string | rbxassetid://0 / Nguyen Nhat / empty | Thông tin hồ sơ |\n| Info.Badges | table | {} | Danh sách badge |\n\n Đối tượng trả về\n\nDiscord: SetInvite(link, code), Destroy(). Info: SetAvatar(id), SetName(text), SetBio(text), Destroy(), Info.AddSocialIcon(icon, copyValue, order) (dot call).\n\n Lưu ý\n\nHoạt động của invite, avatar và mạng phụ thuộc executor/dịch vụ; ví dụ link chỉ là placeholder.\n"}},{"id":"cross-control-guide","num":"33","group":{"en":"GUIDES","vi":"HƯỚNG DẪN"},"title":{"en":"Cross AI: control your UI","vi":"Cross AI: điều khiển UI"},"html":{"en":"<h1>Cross AI: control your UI<\/h1>\n<p>Cross is a <strong>local rule-based assistant<\/strong>, not a general-purpose language model. It indexes the controls created by this xNgot window, including controls created later by your script. It does not scan other Roblox GUIs. Labels are matched by name; it cannot infer the purpose of arbitrary code from a label.<\/p>\n<h2>Start and confirm<\/h2>\n<ol>\n<li>Open <strong>Settings → Open Dynamic Island Settings → Cross AI Assistant<\/strong> and turn on <strong>Enable Cross AI<\/strong>.<\/li>\n<li>Enter a request and press <strong>Send to Cross AI<\/strong>. For example, <code>bật Show FPS<\/code>.<\/li>\n<li>Read the proposed action, target name and tab. Reply <code>có<\/code>/<code>yes<\/code> or use <strong>Confirm Cross AI action<\/strong>; to reject, reply <code>không<\/code>/<code>no<\/code> or use <strong>Cancel Cross AI action<\/strong>.<\/li>\n<li>Confirm within 60 seconds. An expired or canceled request does nothing. Locked or destroyed controls are refused; renamed targets need a new request. The control may also change while confirmation is pending.<\/li>\n<\/ol>\n<p>You can use the Cross chat on the island too: open it with <strong>Open Cross AI on Island<\/strong>, then type the request and confirmation there.<\/p>\n<h2>Example requests<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Request<\/th>\n  <th>Behavior<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>danh sách chức năng<\/code> / <code>list controls<\/code><\/td>\n  <td>List indexed controls, 15 per page; append <code>2<\/code> for the next page.<\/td>\n<\/tr>\n<tr>\n  <td><code>bật Show FPS<\/code><\/td>\n  <td>Propose enabling that toggle.<\/td>\n<\/tr>\n<tr>\n  <td><code>tắt Main Auto Farm<\/code><\/td>\n  <td>Propose disabling <code>Auto Farm<\/code> in tab <code>Main<\/code>, if it exists.<\/td>\n<\/tr>\n<tr>\n  <td><code>đặt Sound Volume 40<\/code><\/td>\n  <td>Propose a slider value; it is rounded to the slider step.<\/td>\n<\/tr>\n<tr>\n  <td><code>chọn Mode &quot;Fast&quot;<\/code><\/td>\n  <td>Propose a dropdown option.<\/td>\n<\/tr>\n<tr>\n  <td><code>đổi Nickname &quot;Hana&quot;<\/code><\/td>\n  <td>Propose an input value; quotes are required.<\/td>\n<\/tr>\n<tr>\n  <td><code>đổi Accent #66AAFF<\/code><\/td>\n  <td>Propose a Colorpicker value.<\/td>\n<\/tr>\n<tr>\n  <td><code>bấm Rejoin<\/code><\/td>\n  <td>Propose a button click. Buttons may have side effects; confirm only after reading the target.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Names in examples must exist in your UI. If names are duplicated, include the tab name. Some Vietnamese aliases, such as <code>tốc độ<\/code> for <code>Speed<\/code>, are supported; this is not free-form AI and unfamiliar wording may not match. A name alone may propose a toggle/section's opposite state or a button action, but confirmation is still mandatory.<\/p>\n<p>The assistant supports Section (open/close), Toggle, Button, Slider, Input, Dropdown (including adding/removing one multi-select option), and Colorpicker. Paragraph and Code can have their displayed text changed with a quoted value; Info changes its bio and Discord changes its invite link. Code content is displayed, not executed. Assistant-owned controls are excluded to avoid recursive actions. For single-choice dropdowns, select an existing option; multi-select <code>bỏ<\/code> / <code>remove<\/code> removes one selected option.<\/p>\n<blockquote>\n<p>Only AI-proposed <strong>UI control changes<\/strong> have the confirmation gate. Existing music/timer chat commands remain immediate; music searches may contact third-party services. A confirmed button runs its original callback, which may do anything the original script allows. Errors can happen after a callback has partially acted.<\/p>\n<\/blockquote>\n<h2>Player and current session<\/h2>\n<p>Ask <code>What is my username?<\/code>, <code>player info<\/code>, <code>game name<\/code>, <code>place id<\/code>, <code>game id<\/code>, <code>job id<\/code>, <code>player count<\/code>, or <code>game info<\/code>. Cross reads the local player's Roblox <code>Name<\/code>, <code>DisplayName<\/code> and <code>UserId<\/code>; <code>PlaceId<\/code>, <code>GameId<\/code> (universe ID) and <code>JobId<\/code> come from the current Roblox session; player count and capacity come from <code>Players<\/code>. The game name is the <strong>current place's<\/strong> product name from <code>MarketplaceService<\/code>, which can differ from the overall experience name. That lookup may yield or fail; a missing value is reported as unavailable rather than guessed. An empty JobId, such as in some Studio sessions, is also unavailable. These replies do not teach or persist the identifiers in the Cross learning JSON; chat remains in the current session. Treat JobId as potentially sensitive if you do not want others to join or identify your server.<\/p>\n<p>These are read-only replies and do not require UI confirmation. If an action is already awaiting confirmation, resolve it first. The assistant recognizes supported phrases, not every possible wording.<\/p>\n<h2>Developer opt-out and API<\/h2>\n<p>Set <code>AIControl = false<\/code> on a control to keep it out of the assistant's index. <code>island:AiPermission(&quot;Ui&quot;, false)<\/code> disables UI listing and execution, including requests already pending. Exclude sensitive buttons or inputs whose callbacks should not be callable from chat.<\/p>\n<pre><code class=\"language-lua\">Tab:Button({\n    Title = &quot;Sensitive action&quot;,\n    AIControl = false,\n    Callback = function() print(&quot;Run only through the UI&quot;) end,\n})\n\nlocal island = Window:GetDynamicIsland()\nif island then\n    island:AiEnable(true)\n    island:AiAsk(&quot;bật Show FPS&quot;) -- proposes only\n    print(island:AiState().Pending)\n    island:AiAsk(&quot;no&quot;)            -- cancel, never execute\nend\n<\/code><\/pre>\n<p>The input and chat history are not saved as a full log, but some confirmed command phrases and control names may be stored in local JSON automatically. Do not enter secrets. See Cross automatic memory. <code>AiAsk<\/code> can yield for music searches or game-name lookup; use a task when appropriate. The chat confirmation path is not an authorization boundary against other scripts using the library API directly.<\/p>\n","vi":"<h1>Cross AI: điều khiển UI<\/h1>\n<p>Cross là <strong>trợ lý local theo quy tắc<\/strong>, không phải mô hình ngôn ngữ tổng quát. Nó lập danh sách control do cửa sổ xNgot này tạo, kể cả control được script thêm sau. Nó không quét GUI Roblox khác và không tự hiểu công dụng của code chỉ từ tên.<\/p>\n<h2>Bắt đầu và xác nhận<\/h2>\n<ol>\n<li>Vào <strong>Settings → Open Dynamic Island Settings → Cross AI Assistant<\/strong>, bật <strong>Enable Cross AI<\/strong>.<\/li>\n<li>Nhập lệnh rồi nhấn <strong>Send to Cross AI<\/strong>, ví dụ <code>bật Show FPS<\/code>.<\/li>\n<li>Đọc hành động, tên control và tab. Trả lời <code>có<\/code>/<code>yes<\/code> hoặc nhấn <strong>Confirm Cross AI action<\/strong>; để từ chối, trả lời <code>không<\/code>/<code>no<\/code> hoặc nhấn <strong>Cancel Cross AI action<\/strong>.<\/li>\n<li>Xác nhận trong 60 giây. Hết hạn hoặc hủy sẽ không thay đổi gì. Control bị khóa/đã xóa sẽ bị từ chối; nếu đổi tên, hãy ra lệnh lại. Trạng thái control có thể thay đổi trong lúc chờ.<\/li>\n<\/ol>\n<p>Bạn cũng có thể dùng chat Cross trên đảo: nhấn <strong>Open Cross AI on Island<\/strong>, rồi nhập lệnh và câu xác nhận tại đó.<\/p>\n<h2>Ví dụ lệnh<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Lệnh<\/th>\n  <th>Cách hoạt động<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>danh sách chức năng<\/code> / <code>list controls<\/code><\/td>\n  <td>Liệt kê control, 15 mục mỗi trang; thêm <code>2<\/code> để xem trang tiếp.<\/td>\n<\/tr>\n<tr>\n  <td><code>bật Show FPS<\/code><\/td>\n  <td>Đề xuất bật toggle đó.<\/td>\n<\/tr>\n<tr>\n  <td><code>tắt Main Auto Farm<\/code><\/td>\n  <td>Đề xuất tắt <code>Auto Farm<\/code> trong tab <code>Main<\/code>, nếu có.<\/td>\n<\/tr>\n<tr>\n  <td><code>đặt Sound Volume 40<\/code><\/td>\n  <td>Đề xuất giá trị slider, làm tròn theo Step.<\/td>\n<\/tr>\n<tr>\n  <td><code>chọn Mode &quot;Fast&quot;<\/code><\/td>\n  <td>Đề xuất lựa chọn dropdown.<\/td>\n<\/tr>\n<tr>\n  <td><code>đổi Nickname &quot;Hana&quot;<\/code><\/td>\n  <td>Đề xuất giá trị ô nhập; cần dấu ngoặc kép.<\/td>\n<\/tr>\n<tr>\n  <td><code>đổi Accent #66AAFF<\/code><\/td>\n  <td>Đề xuất màu cho Colorpicker.<\/td>\n<\/tr>\n<tr>\n  <td><code>bấm Rejoin<\/code><\/td>\n  <td>Đề xuất bấm nút. Nút có thể gây tác động khác; chỉ xác nhận sau khi đọc đúng mục.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Tên ví dụ phải tồn tại trong UI của bạn. Nếu trùng tên, hãy thêm tên tab. Có một số từ đồng nghĩa như <code>tốc độ<\/code> cho <code>Speed<\/code>; đây không phải AI hiểu mọi cách diễn đạt, nên câu lạ có thể không khớp. Chỉ nhập tên cũng có thể đề xuất đảo trạng thái toggle/section hoặc bấm nút, nhưng vẫn phải xác nhận.<\/p>\n<p>Hỗ trợ Section (mở/đóng), Toggle, Button, Slider, Input, Dropdown (thêm/bỏ một mục multi-select) và Colorpicker. Paragraph và Code có thể đổi nội dung hiển thị bằng chuỗi trong dấu ngoặc kép; Info đổi bio và Discord đổi link mời. Nội dung Code chỉ được hiển thị, không tự chạy. Control riêng của trợ lý được loại khỏi danh sách để tránh gọi lặp. Dropdown đơn chọn một mục có sẵn; với multi-select dùng <code>bỏ<\/code> / <code>remove<\/code> để bỏ một mục đang chọn.<\/p>\n<blockquote>\n<p>Chỉ các thay đổi <strong>control UI do AI đề xuất<\/strong> mới qua bước xác nhận. Lệnh chat nhạc/hẹn giờ có sẵn vẫn chạy ngay; tìm nhạc có thể gọi dịch vụ bên thứ ba. Khi xác nhận nút, callback gốc sẽ chạy và có thể làm mọi việc script cho phép. Nếu callback lỗi, một phần tác động có thể đã xảy ra.<\/p>\n<\/blockquote>\n<h2>Người chơi và phiên hiện tại<\/h2>\n<p>Bạn có thể hỏi <code>tên tôi là gì<\/code>, <code>thông tin người chơi<\/code>, <code>tên game<\/code>, <code>place id<\/code>, <code>game id<\/code>, <code>job id<\/code>, <code>bao nhiêu người chơi<\/code> hoặc <code>thông tin game<\/code>. Cross đọc <code>Name<\/code>, <code>DisplayName<\/code> và <code>UserId<\/code> của người chơi local; <code>PlaceId<\/code>, <code>GameId<\/code> (UniverseId) và <code>JobId<\/code> lấy từ phiên Roblox hiện tại; số người và sức chứa lấy từ <code>Players<\/code>. Tên game là <strong>tên place hiện tại<\/strong> lấy qua <code>MarketplaceService<\/code>, có thể khác tên trải nghiệm tổng thể. Tra cứu tên có thể chờ hoặc thất bại; khi không lấy được, Cross báo không có thay vì đoán. JobId rỗng, ví dụ trong một số phiên Studio, cũng được báo không lấy được. Các câu trả lời này không dạy hay lưu ID vào JSON học của Cross; chat chỉ tồn tại trong phiên. Cẩn thận khi chia sẻ JobId nếu không muốn người khác nhận diện hoặc tham gia server.<\/p>\n<p>Đây là thông tin chỉ đọc, không cần xác nhận UI. Nếu đang có hành động chờ xác nhận, hãy xử lý hành động đó trước. Cross nhận diện một số cách hỏi, không phải mọi câu tự do.<\/p>\n<h2>Loại control và API cho người viết script<\/h2>\n<p>Đặt <code>AIControl = false<\/code> để control không xuất hiện trong danh sách AI. <code>island:AiPermission(&quot;Ui&quot;, false)<\/code> tắt liệt kê và điều khiển UI, kể cả yêu cầu đang chờ. Nên loại các nút hoặc ô nhập nhạy cảm mà bạn không muốn gọi qua chat.<\/p>\n<pre><code class=\"language-lua\">Tab:Button({\n    Title = &quot;Sensitive action&quot;,\n    AIControl = false,\n    Callback = function() print(&quot;Chỉ chạy qua UI&quot;) end,\n})\n\nlocal island = Window:GetDynamicIsland()\nif island then\n    island:AiEnable(true)\n    island:AiAsk(&quot;bật Show FPS&quot;) -- chỉ đề xuất\n    print(island:AiState().Pending)\n    island:AiAsk(&quot;no&quot;)            -- hủy, không chạy\nend\n<\/code><\/pre>\n<p>Ô nhập và lịch sử chat không được lưu thành log đầy đủ, nhưng một số câu đã xác nhận và tên control có thể tự ghi vào JSON local. Đừng nhập thông tin bí mật; xem Cross tự ghi nhớ. <code>AiAsk<\/code> có thể yield khi tìm nhạc hoặc tra tên game; dùng task khi cần. Xác nhận trong chat không ngăn script khác trực tiếp gọi API của thư viện.<\/p>\n"},"plain":{"en":" Cross AI: control your UI\n\nCross is a local rule-based assistant, not a general-purpose language model. It indexes the controls created by this xNgot window, including controls created later by your script. It does not scan other Roblox GUIs. Labels are matched by name; it cannot infer the purpose of arbitrary code from a label.\n\n Start and confirm\n\n1. Open Settings → Open Dynamic Island Settings → Cross AI Assistant and turn on Enable Cross AI.\n2. Enter a request and press Send to Cross AI. For example, bật Show FPS.\n3. Read the proposed action, target name and tab. Reply có/yes or use Confirm Cross AI action; to reject, reply không/no or use Cancel Cross AI action.\n4. Confirm within 60 seconds. An expired or canceled request does nothing. Locked or destroyed controls are refused; renamed targets need a new request. The control may also change while confirmation is pending.\n\nYou can use the Cross chat on the island too: open it with Open Cross AI on Island, then type the request and confirmation there.\n\n Example requests\n\n| Request | Behavior |\n| --- | --- |\n| danh sách chức năng / list controls | List indexed controls, 15 per page; append 2 for the next page. |\n| bật Show FPS | Propose enabling that toggle. |\n| tắt Main Auto Farm | Propose disabling Auto Farm in tab Main, if it exists. |\n| đặt Sound Volume 40 | Propose a slider value; it is rounded to the slider step. |\n| chọn Mode \"Fast\" | Propose a dropdown option. |\n| đổi Nickname \"Hana\" | Propose an input value; quotes are required. |\n| đổi Accent 66AAFF | Propose a Colorpicker value. |\n| bấm Rejoin | Propose a button click. Buttons may have side effects; confirm only after reading the target. |\n\nNames in examples must exist in your UI. If names are duplicated, include the tab name. Some Vietnamese aliases, such as tốc độ for Speed, are supported; this is not free-form AI and unfamiliar wording may not match. A name alone may propose a toggle/section's opposite state or a button action, but confirmation is still mandatory.\n\nThe assistant supports Section (open/close), Toggle, Button, Slider, Input, Dropdown (including adding/removing one multi-select option), and Colorpicker. Paragraph and Code can have their displayed text changed with a quoted value; Info changes its bio and Discord changes its invite link. Code content is displayed, not executed. Assistant-owned controls are excluded to avoid recursive actions. For single-choice dropdowns, select an existing option; multi-select bỏ / remove removes one selected option.\n\n> Only AI-proposed UI control changes have the confirmation gate. Existing music/timer chat commands remain immediate; music searches may contact third-party services. A confirmed button runs its original callback, which may do anything the original script allows. Errors can happen after a callback has partially acted.\n\n Player and current session\n\nAsk What is my username?, player info, game name, place id, game id, job id, player count, or game info. Cross reads the local player's Roblox Name, DisplayName and UserId; PlaceId, GameId (universe ID) and JobId come from the current Roblox session; player count and capacity come from Players. The game name is the current place's product name from MarketplaceService, which can differ from the overall experience name. That lookup may yield or fail; a missing value is reported as unavailable rather than guessed. An empty JobId, such as in some Studio sessions, is also unavailable. These replies do not teach or persist the identifiers in the Cross learning JSON; chat remains in the current session. Treat JobId as potentially sensitive if you do not want others to join or identify your server.\n\nThese are read-only replies and do not require UI confirmation. If an action is already awaiting confirmation, resolve it first. The assistant recognizes supported phrases, not every possible wording.\n\n Developer opt-out and API\n\nSet AIControl = false on a control to keep it out of the assistant's index. island:AiPermission(\"Ui\", false) disables UI listing and execution, including requests already pending. Exclude sensitive buttons or inputs whose callbacks should not be callable from chat.\n\nlua\nTab:Button({\n    Title = \"Sensitive action\",\n    AIControl = false,\n    Callback = function() print(\"Run only through the UI\") end,\n})\n\nlocal island = Window:GetDynamicIsland()\nif island then\n    island:AiEnable(true)\n    island:AiAsk(\"bật Show FPS\") -- proposes only\n    print(island:AiState().Pending)\n    island:AiAsk(\"no\")            -- cancel, never execute\nend\n\n\nThe input and chat history are not saved as a full log, but some confirmed command phrases and control names may be stored in local JSON automatically. Do not enter secrets. See Cross automatic memory. AiAsk can yield for music searches or game-name lookup; use a task when appropriate. The chat confirmation path is not an authorization boundary against other scripts using the library API directly.\n","vi":" Cross AI: điều khiển UI\n\nCross là trợ lý local theo quy tắc, không phải mô hình ngôn ngữ tổng quát. Nó lập danh sách control do cửa sổ xNgot này tạo, kể cả control được script thêm sau. Nó không quét GUI Roblox khác và không tự hiểu công dụng của code chỉ từ tên.\n\n Bắt đầu và xác nhận\n\n1. Vào Settings → Open Dynamic Island Settings → Cross AI Assistant, bật Enable Cross AI.\n2. Nhập lệnh rồi nhấn Send to Cross AI, ví dụ bật Show FPS.\n3. Đọc hành động, tên control và tab. Trả lời có/yes hoặc nhấn Confirm Cross AI action; để từ chối, trả lời không/no hoặc nhấn Cancel Cross AI action.\n4. Xác nhận trong 60 giây. Hết hạn hoặc hủy sẽ không thay đổi gì. Control bị khóa/đã xóa sẽ bị từ chối; nếu đổi tên, hãy ra lệnh lại. Trạng thái control có thể thay đổi trong lúc chờ.\n\nBạn cũng có thể dùng chat Cross trên đảo: nhấn Open Cross AI on Island, rồi nhập lệnh và câu xác nhận tại đó.\n\n Ví dụ lệnh\n\n| Lệnh | Cách hoạt động |\n| --- | --- |\n| danh sách chức năng / list controls | Liệt kê control, 15 mục mỗi trang; thêm 2 để xem trang tiếp. |\n| bật Show FPS | Đề xuất bật toggle đó. |\n| tắt Main Auto Farm | Đề xuất tắt Auto Farm trong tab Main, nếu có. |\n| đặt Sound Volume 40 | Đề xuất giá trị slider, làm tròn theo Step. |\n| chọn Mode \"Fast\" | Đề xuất lựa chọn dropdown. |\n| đổi Nickname \"Hana\" | Đề xuất giá trị ô nhập; cần dấu ngoặc kép. |\n| đổi Accent 66AAFF | Đề xuất màu cho Colorpicker. |\n| bấm Rejoin | Đề xuất bấm nút. Nút có thể gây tác động khác; chỉ xác nhận sau khi đọc đúng mục. |\n\nTên ví dụ phải tồn tại trong UI của bạn. Nếu trùng tên, hãy thêm tên tab. Có một số từ đồng nghĩa như tốc độ cho Speed; đây không phải AI hiểu mọi cách diễn đạt, nên câu lạ có thể không khớp. Chỉ nhập tên cũng có thể đề xuất đảo trạng thái toggle/section hoặc bấm nút, nhưng vẫn phải xác nhận.\n\nHỗ trợ Section (mở/đóng), Toggle, Button, Slider, Input, Dropdown (thêm/bỏ một mục multi-select) và Colorpicker. Paragraph và Code có thể đổi nội dung hiển thị bằng chuỗi trong dấu ngoặc kép; Info đổi bio và Discord đổi link mời. Nội dung Code chỉ được hiển thị, không tự chạy. Control riêng của trợ lý được loại khỏi danh sách để tránh gọi lặp. Dropdown đơn chọn một mục có sẵn; với multi-select dùng bỏ / remove để bỏ một mục đang chọn.\n\n> Chỉ các thay đổi control UI do AI đề xuất mới qua bước xác nhận. Lệnh chat nhạc/hẹn giờ có sẵn vẫn chạy ngay; tìm nhạc có thể gọi dịch vụ bên thứ ba. Khi xác nhận nút, callback gốc sẽ chạy và có thể làm mọi việc script cho phép. Nếu callback lỗi, một phần tác động có thể đã xảy ra.\n\n Người chơi và phiên hiện tại\n\nBạn có thể hỏi tên tôi là gì, thông tin người chơi, tên game, place id, game id, job id, bao nhiêu người chơi hoặc thông tin game. Cross đọc Name, DisplayName và UserId của người chơi local; PlaceId, GameId (UniverseId) và JobId lấy từ phiên Roblox hiện tại; số người và sức chứa lấy từ Players. Tên game là tên place hiện tại lấy qua MarketplaceService, có thể khác tên trải nghiệm tổng thể. Tra cứu tên có thể chờ hoặc thất bại; khi không lấy được, Cross báo không có thay vì đoán. JobId rỗng, ví dụ trong một số phiên Studio, cũng được báo không lấy được. Các câu trả lời này không dạy hay lưu ID vào JSON học của Cross; chat chỉ tồn tại trong phiên. Cẩn thận khi chia sẻ JobId nếu không muốn người khác nhận diện hoặc tham gia server.\n\nĐây là thông tin chỉ đọc, không cần xác nhận UI. Nếu đang có hành động chờ xác nhận, hãy xử lý hành động đó trước. Cross nhận diện một số cách hỏi, không phải mọi câu tự do.\n\n Loại control và API cho người viết script\n\nĐặt AIControl = false để control không xuất hiện trong danh sách AI. island:AiPermission(\"Ui\", false) tắt liệt kê và điều khiển UI, kể cả yêu cầu đang chờ. Nên loại các nút hoặc ô nhập nhạy cảm mà bạn không muốn gọi qua chat.\n\nlua\nTab:Button({\n    Title = \"Sensitive action\",\n    AIControl = false,\n    Callback = function() print(\"Chỉ chạy qua UI\") end,\n})\n\nlocal island = Window:GetDynamicIsland()\nif island then\n    island:AiEnable(true)\n    island:AiAsk(\"bật Show FPS\") -- chỉ đề xuất\n    print(island:AiState().Pending)\n    island:AiAsk(\"no\")            -- hủy, không chạy\nend\n\n\nÔ nhập và lịch sử chat không được lưu thành log đầy đủ, nhưng một số câu đã xác nhận và tên control có thể tự ghi vào JSON local. Đừng nhập thông tin bí mật; xem Cross tự ghi nhớ. AiAsk có thể yield khi tìm nhạc hoặc tra tên game; dùng task khi cần. Xác nhận trong chat không ngăn script khác trực tiếp gọi API của thư viện.\n"}},{"id":"cross-learning","num":"34","group":{"en":"GUIDES","vi":"HƯỚNG DẪN"},"title":{"en":"Cross automatic memory","vi":"Cross tự ghi nhớ"},"html":{"en":"<h1>Cross automatic memory<\/h1>\n<p>Cross remembers eligible confirmed UI requests automatically; there is no Learning section or setup switch in Settings. It is a local rule-based lookup and frequency counter, <strong>not model training<\/strong> or an online chatbot. It cannot infer every unfamiliar sentence.<\/p>\n<h2>How it learns<\/h2>\n<ol>\n<li>Enable Cross in <strong>Settings → Open Dynamic Island Settings → Cross AI Assistant<\/strong>.<\/li>\n<li>Ask for an existing control, for example <code>bật Show FPS<\/code>. Cross proposes an action; review the name and tab, then answer <code>có<\/code>/<code>yes<\/code> or <code>không<\/code>/<code>no<\/code>.<\/li>\n<li>A successful confirmed UI operation increases that control's use counter, up to 80 distinct controls. For eligible toggle, section and button phrases, Cross may save the phrase and its specific action (up to 80 learned phrases). Cancellation, expiry, blocked permissions or failed actions do not teach it.<\/li>\n<li>If Cross cannot match an action-like request, it may ask you to clarify the control and action. Give the existing tab and control name, for example <code>bật Main Auto Farm<\/code>, then confirm. If the direction agrees and the phrase is eligible, Cross remembers the first phrase for later use. It will <strong>still ask before acting<\/strong> on a learned phrase.<\/li>\n<\/ol>\n<p>For safety, automatic phrase learning is limited to short phrases without numbers, quotes, URLs or certain sensitive terms; these checks are imperfect. It only saves phrases for toggle, section and button actions, not arbitrary input text or code. It stores a normalized phrase and its mapped control/action; slider, dropdown, input, color and other controls can still be operated with confirmation and counted, but their value or arbitrary input is not automatically saved as a learned phrase. Manual clicks outside Cross are not counted.<\/p>\n<p>Duplicate names require the tab; a renamed, deleted, locked or duplicated target cannot be automatically run from an old mapping. Some existing music and timer chat commands remain immediate, rather than going through UI confirmation. Send <code>gợi ý<\/code> / <code>preferences<\/code> to see frequently confirmed controls; these are suggestions, not automatic actions.<\/p>\n<h2>Storage and privacy<\/h2>\n<p>The executor stores <code>xNgotLibrary/AI/xNgotCrossAI_user_&lt;UserId&gt;.json<\/code> in its workspace. This is local to the account and executor/device, not online synchronization. The legacy root file is read if the new file does not exist; the original is not deleted. Existing compatible learned phrases remain available; older files with remembering turned off are now read with automatic remembering on. Counts store tab, control name, type and frequency, not values. They may still reveal information if a control name itself contains personal data.<\/p>\n<p>The JSON is <strong>plain text<\/strong>, and can be read or altered by other scripts or anyone with workspace access. The phrase filter cannot reliably detect all personal data, so do not put passwords, keys or private information in Cross requests. Full chat history is not saved by this feature. The file can be removed manually in the executor workspace if needed; there is no Learning management section in the UI.<\/p>\n<p><code>isfile<\/code>, <code>readfile<\/code>, <code>writefile<\/code> and Roblox <code>HttpService<\/code> JSON support are required. If unavailable or a write fails, the assistant reports that learning is <strong>session only<\/strong>; it is not guaranteed to survive restart. An invalid, unreadable, oversized or wrong-user file is not silently overwritten. Back it up and inspect it before manually removing it. None of this prevents another script from directly calling the library API.<\/p>\n<p>Developers can inspect <code>island:AiLearningState()<\/code> for the local path and error status. The former <code>AiSetRemember(false)<\/code> switch cannot disable automatic learning in this build. Previously provided learning APIs remain for compatibility, but no setup or management controls are shown in Settings.<\/p>\n","vi":"<h1>Cross tự ghi nhớ<\/h1>\n<p>Cross tự ghi nhớ các yêu cầu UI phù hợp sau khi được xác nhận; không còn mục Learning hay nút cài đặt việc học. Đây là tra cứu local và đếm tần suất theo quy tắc, <strong>không phải huấn luyện mô hình<\/strong> hay chatbot online. Nó không thể tự hiểu mọi câu chưa biết.<\/p>\n<h2>Cách học<\/h2>\n<ol>\n<li>Bật Cross tại <strong>Settings → Open Dynamic Island Settings → Cross AI Assistant<\/strong>.<\/li>\n<li>Yêu cầu control đã có, ví dụ <code>bật Show FPS<\/code>. Cross đề xuất hành động; đọc tên và tab rồi trả lời <code>có<\/code>/<code>yes<\/code> hoặc <code>không<\/code>/<code>no<\/code>.<\/li>\n<li>Thao tác UI được xác nhận và gọi thành công sẽ tăng số lần dùng control, tối đa 80 control khác nhau. Với câu phù hợp dành cho toggle, section hoặc button, Cross có thể lưu câu và hành động tương ứng, tối đa 80 câu. Hủy, hết hạn, bị khóa quyền hoặc thao tác lỗi thì không học.<\/li>\n<li>Nếu chưa khớp một câu có ý định thao tác, Cross có thể hỏi lại tên chức năng và hành động. Hãy ghi rõ tab và control có sẵn, ví dụ <code>bật Main Auto Farm<\/code>, rồi xác nhận. Nếu hướng bật/tắt khớp và câu đủ điều kiện, Cross ghi nhớ cách gọi ban đầu. Lần sau dùng câu đó, AI <strong>vẫn hỏi trước khi thao tác<\/strong>.<\/li>\n<\/ol>\n<p>Để hạn chế dữ liệu nhạy cảm, chỉ một số câu ngắn không chứa số, dấu ngoặc kép, URL hoặc từ nhạy cảm được tự lưu; bộ lọc không hoàn hảo. Việc tự học câu chỉ áp dụng cho toggle, section và button, không lưu nội dung input/code tùy ý. File lưu câu đã chuẩn hóa và control/hành động tương ứng; slider, dropdown, input, color và control khác vẫn thao tác được sau xác nhận và được đếm lượt dùng, nhưng giá trị hoặc nội dung nhập tùy ý không được tự lưu thành câu học. Các lần bấm UI trực tiếp ngoài Cross không được đếm.<\/p>\n<p>Tên trùng cần chỉ rõ tab; mục đổi tên, bị xóa, khóa hoặc trùng không thể tự chạy qua mapping cũ. Một số lệnh nhạc/hẹn giờ có sẵn vẫn chạy ngay, không qua xác nhận control UI. Gửi <code>gợi ý<\/code> / <code>preferences<\/code> để xem các control thường được xác nhận; Cross chỉ gợi ý, không tự bật.<\/p>\n<h2>Lưu trữ và riêng tư<\/h2>\n<p>File <code>xNgotLibrary/AI/xNgotCrossAI_user_&lt;UserId&gt;.json<\/code> nằm trong workspace executor, riêng theo tài khoản và thiết bị/executor, không đồng bộ online. Nếu chưa có file mới, Cross đọc file cũ ở thư mục gốc và không tự xóa file cũ. Câu đã học tương thích từ bản trước vẫn có thể dùng; file cũ đang tắt ghi nhớ sẽ được đọc với chế độ tự ghi nhớ bật. Bộ đếm lưu tab, tên, loại control và số lần, không lưu giá trị. Tuy vậy, nếu chính tên control chứa dữ liệu cá nhân thì tên đó có thể bị lưu.<\/p>\n<p>JSON là <strong>văn bản thường<\/strong>; script khác hoặc người có quyền vào workspace có thể đọc/sửa. Bộ lọc câu không nhận diện được mọi thông tin cá nhân, nên không nhập mật khẩu, key hay nội dung riêng tư vào yêu cầu Cross. Tính năng này không lưu toàn bộ lịch sử chat. Nếu cần, bạn có thể tự xóa file trong workspace executor; UI không có mục quản lý Learning.<\/p>\n<p>Cần <code>isfile<\/code>, <code>readfile<\/code>, <code>writefile<\/code> và JSON của Roblox <code>HttpService<\/code>. Nếu thiếu hoặc ghi lỗi, trợ lý báo chỉ ghi nhớ <strong>trong phiên<\/strong>, không chắc còn sau khi chạy lại. File sai định dạng, không đọc được, quá lớn hoặc thuộc UserId khác không bị tự ghi đè; hãy sao lưu và kiểm tra trước khi tự xóa. Việc này không ngăn script khác gọi trực tiếp API thư viện.<\/p>\n<p>Người viết script có thể xem đường dẫn và lỗi bằng <code>island:AiLearningState()<\/code>. Công tắc API cũ <code>AiSetRemember(false)<\/code> không tắt tự ghi nhớ trong bản này. Các API học cũ vẫn giữ để tương thích, nhưng không có control cài đặt/quản lý trong Settings.<\/p>\n"},"plain":{"en":" Cross automatic memory\n\nCross remembers eligible confirmed UI requests automatically; there is no Learning section or setup switch in Settings. It is a local rule-based lookup and frequency counter, not model training or an online chatbot. It cannot infer every unfamiliar sentence.\n\n How it learns\n\n1. Enable Cross in Settings → Open Dynamic Island Settings → Cross AI Assistant.\n2. Ask for an existing control, for example bật Show FPS. Cross proposes an action; review the name and tab, then answer có/yes or không/no.\n3. A successful confirmed UI operation increases that control's use counter, up to 80 distinct controls. For eligible toggle, section and button phrases, Cross may save the phrase and its specific action (up to 80 learned phrases). Cancellation, expiry, blocked permissions or failed actions do not teach it.\n4. If Cross cannot match an action-like request, it may ask you to clarify the control and action. Give the existing tab and control name, for example bật Main Auto Farm, then confirm. If the direction agrees and the phrase is eligible, Cross remembers the first phrase for later use. It will still ask before acting on a learned phrase.\n\nFor safety, automatic phrase learning is limited to short phrases without numbers, quotes, URLs or certain sensitive terms; these checks are imperfect. It only saves phrases for toggle, section and button actions, not arbitrary input text or code. It stores a normalized phrase and its mapped control/action; slider, dropdown, input, color and other controls can still be operated with confirmation and counted, but their value or arbitrary input is not automatically saved as a learned phrase. Manual clicks outside Cross are not counted.\n\nDuplicate names require the tab; a renamed, deleted, locked or duplicated target cannot be automatically run from an old mapping. Some existing music and timer chat commands remain immediate, rather than going through UI confirmation. Send gợi ý / preferences to see frequently confirmed controls; these are suggestions, not automatic actions.\n\n Storage and privacy\n\nThe executor stores xNgotLibrary/AI/xNgotCrossAI_user_<UserId>.json in its workspace. This is local to the account and executor/device, not online synchronization. The legacy root file is read if the new file does not exist; the original is not deleted. Existing compatible learned phrases remain available; older files with remembering turned off are now read with automatic remembering on. Counts store tab, control name, type and frequency, not values. They may still reveal information if a control name itself contains personal data.\n\nThe JSON is plain text, and can be read or altered by other scripts or anyone with workspace access. The phrase filter cannot reliably detect all personal data, so do not put passwords, keys or private information in Cross requests. Full chat history is not saved by this feature. The file can be removed manually in the executor workspace if needed; there is no Learning management section in the UI.\n\nisfile, readfile, writefile and Roblox HttpService JSON support are required. If unavailable or a write fails, the assistant reports that learning is session only; it is not guaranteed to survive restart. An invalid, unreadable, oversized or wrong-user file is not silently overwritten. Back it up and inspect it before manually removing it. None of this prevents another script from directly calling the library API.\n\nDevelopers can inspect island:AiLearningState() for the local path and error status. The former AiSetRemember(false) switch cannot disable automatic learning in this build. Previously provided learning APIs remain for compatibility, but no setup or management controls are shown in Settings.\n","vi":" Cross tự ghi nhớ\n\nCross tự ghi nhớ các yêu cầu UI phù hợp sau khi được xác nhận; không còn mục Learning hay nút cài đặt việc học. Đây là tra cứu local và đếm tần suất theo quy tắc, không phải huấn luyện mô hình hay chatbot online. Nó không thể tự hiểu mọi câu chưa biết.\n\n Cách học\n\n1. Bật Cross tại Settings → Open Dynamic Island Settings → Cross AI Assistant.\n2. Yêu cầu control đã có, ví dụ bật Show FPS. Cross đề xuất hành động; đọc tên và tab rồi trả lời có/yes hoặc không/no.\n3. Thao tác UI được xác nhận và gọi thành công sẽ tăng số lần dùng control, tối đa 80 control khác nhau. Với câu phù hợp dành cho toggle, section hoặc button, Cross có thể lưu câu và hành động tương ứng, tối đa 80 câu. Hủy, hết hạn, bị khóa quyền hoặc thao tác lỗi thì không học.\n4. Nếu chưa khớp một câu có ý định thao tác, Cross có thể hỏi lại tên chức năng và hành động. Hãy ghi rõ tab và control có sẵn, ví dụ bật Main Auto Farm, rồi xác nhận. Nếu hướng bật/tắt khớp và câu đủ điều kiện, Cross ghi nhớ cách gọi ban đầu. Lần sau dùng câu đó, AI vẫn hỏi trước khi thao tác.\n\nĐể hạn chế dữ liệu nhạy cảm, chỉ một số câu ngắn không chứa số, dấu ngoặc kép, URL hoặc từ nhạy cảm được tự lưu; bộ lọc không hoàn hảo. Việc tự học câu chỉ áp dụng cho toggle, section và button, không lưu nội dung input/code tùy ý. File lưu câu đã chuẩn hóa và control/hành động tương ứng; slider, dropdown, input, color và control khác vẫn thao tác được sau xác nhận và được đếm lượt dùng, nhưng giá trị hoặc nội dung nhập tùy ý không được tự lưu thành câu học. Các lần bấm UI trực tiếp ngoài Cross không được đếm.\n\nTên trùng cần chỉ rõ tab; mục đổi tên, bị xóa, khóa hoặc trùng không thể tự chạy qua mapping cũ. Một số lệnh nhạc/hẹn giờ có sẵn vẫn chạy ngay, không qua xác nhận control UI. Gửi gợi ý / preferences để xem các control thường được xác nhận; Cross chỉ gợi ý, không tự bật.\n\n Lưu trữ và riêng tư\n\nFile xNgotLibrary/AI/xNgotCrossAI_user_<UserId>.json nằm trong workspace executor, riêng theo tài khoản và thiết bị/executor, không đồng bộ online. Nếu chưa có file mới, Cross đọc file cũ ở thư mục gốc và không tự xóa file cũ. Câu đã học tương thích từ bản trước vẫn có thể dùng; file cũ đang tắt ghi nhớ sẽ được đọc với chế độ tự ghi nhớ bật. Bộ đếm lưu tab, tên, loại control và số lần, không lưu giá trị. Tuy vậy, nếu chính tên control chứa dữ liệu cá nhân thì tên đó có thể bị lưu.\n\nJSON là văn bản thường; script khác hoặc người có quyền vào workspace có thể đọc/sửa. Bộ lọc câu không nhận diện được mọi thông tin cá nhân, nên không nhập mật khẩu, key hay nội dung riêng tư vào yêu cầu Cross. Tính năng này không lưu toàn bộ lịch sử chat. Nếu cần, bạn có thể tự xóa file trong workspace executor; UI không có mục quản lý Learning.\n\nCần isfile, readfile, writefile và JSON của Roblox HttpService. Nếu thiếu hoặc ghi lỗi, trợ lý báo chỉ ghi nhớ trong phiên, không chắc còn sau khi chạy lại. File sai định dạng, không đọc được, quá lớn hoặc thuộc UserId khác không bị tự ghi đè; hãy sao lưu và kiểm tra trước khi tự xóa. Việc này không ngăn script khác gọi trực tiếp API thư viện.\n\nNgười viết script có thể xem đường dẫn và lỗi bằng island:AiLearningState(). Công tắc API cũ AiSetRemember(false) không tắt tự ghi nhớ trong bản này. Các API học cũ vẫn giữ để tương thích, nhưng không có control cài đặt/quản lý trong Settings.\n"}},{"id":"local-ai-v2","num":"35","group":{"en":"GUIDES","vi":"HƯỚNG DẪN"},"title":{"en":"Cross: integrated offline intelligence","vi":"Cross: tích hợp xử lý offline"},"html":{"en":"<h1>Cross: integrated offline intelligence<\/h1>\n<p>The existing Cross chat in Dynamic Island is the only assistant interface; <strong>there is no additional Local AI tab<\/strong>. Offline rule-based V2 capabilities run behind Cross. This is not an LLM: it recognizes selected Vietnamese (with or without accents) and English patterns, not every free-form sentence. AI processing does not require an external model or AI key. Existing online music and other network features remain independent.<\/p>\n<h2>Everyday use<\/h2>\n<p>Open Cross as before and ask <code>bật Main Auto Farm<\/code>, <code>giải thích Main Auto Farm<\/code>, <code>mở tab Main<\/code>, <code>chẩn đoán<\/code>, or <code>fps ping<\/code>. Ordinary controls still use Cross's existing control support and confirmation. Say <code>có<\/code> / <code>yes<\/code> or <code>không<\/code> / <code>no<\/code>. Targets must be registered, unlocked, unambiguous and still valid; the UI permission switch and <code>AIControl=false<\/code> remain effective. Explaining describes the real control type, not unknown script-specific behavior. Diagnostics reports availability and errors observed by Cross or Local AI, not all failures; it does not modify source. FPS/Ping are sampled from existing metrics; no RAM is guessed. Alerts check every 15 seconds, at most one per minute, while Cross is enabled.<\/p>\n<h2>Automatic learning and local data<\/h2>\n<p>Cross automatically learns eligible confirmed commands and preferences, just as before. No additional learning settings or UI are required. Its file remains <code>xNgotLibrary/AI/xNgotCrossAI_user_&lt;UserId&gt;.json<\/code>. The integrated engine also uses its existing separate <code>xNgotLibrary/AI/LocalAI_v2_user_&lt;UserId&gt;.json<\/code> for its own macros, music favorites and history, and previous V2 data. On a new installation, its local persistence is enabled automatically when filesystem support exists. An existing V2 memory setting is respected; invalid or externally changed files are protected from overwriting. If filesystem access fails, data may last only for the session. Files are local plain JSON, not encrypted; filtering is imperfect, so <strong>do not enter secrets<\/strong>. No online sync is performed by AI memory. Individual old V2 phrases remain recognized when they do not conflict with Cross's learned commands.<\/p>\n<h2>Shell and Vietnamese replies<\/h2>\n<p>Open <strong>Shell<\/strong> inside Cross, type a request and press Send or Enter. It calls the same Cross handler as Chat: supported actions really run only after the same permission checks and confirmations. The scrollable activity log automatically jumps to the newest line when new activity arrives or Shell reopens. It mirrors actual Cross messages and responses, including pending confirmations and reported errors; it does not invent operating-system commands or claim completion before it is reported. Use <strong>Chat<\/strong> to return. Shell is not Windows PowerShell and cannot execute arbitrary Lua or OS commands. The last 80 wrapped lines are kept in session memory and cleared with Cross chat/window shutdown. Potential secrets and URLs are hidden from the log on a best-effort basis, not guaranteed; avoid entering them. Chat and Shell use the same assistant and confirmation state.<\/p>\n<p>Cross chooses Vietnamese or English based on recognizable words in the request; Vietnamese with and without accents is supported. Ambiguous short replies generally retain the previous language. Not every phrase or error from third-party callbacks can be translated automatically.<\/p>\n<h2>Several actions<\/h2>\n<p>For a one-time sequence, say <code>bật Main Auto Farm rồi tắt Main Auto Farm<\/code>. Each step needs a separate confirmation; <code>tạm dừng macro<\/code>, <code>tiếp tục macro<\/code>, and <code>hủy macro<\/code> control it. Steps already completed are not undone. The sequence supports registered Toggle/Section and Buttons whose author explicitly sets <code>AIAllowMacro=true<\/code>. Blocked/sensitive names are filtered on a best-effort basis; callbacks run original code and cannot be guaranteed harmless. Normal single-action Cross controls retain their existing wider support.<\/p>\n<p>Optionally use <code>tạo macro tên: bật Main Auto Farm; tắt Main Auto Farm<\/code>, <code>chạy macro tên<\/code>, <code>danh sách macro<\/code>, or <code>xóa macro tên<\/code>. These are optional chat requests, not setup needed for ordinary usage. Matching is rule-based and unsupported formats are not executed.<\/p>\n<h2>Local character movement<\/h2>\n<p>Cross or Shell accepts <code>speed 32<\/code>, <code>reset speed<\/code>, <code>fly<\/code>, <code>fly speed 50<\/code>, <code>disable fly<\/code>, <code>noclip<\/code>, <code>disable noclip<\/code>, or <code>stop movement<\/code>. Vietnamese equivalents include <code>tốc độ 32<\/code>, <code>đặt lại tốc độ<\/code>, <code>bật bay<\/code>, <code>tốc độ bay 50<\/code>, <code>tắt bay<\/code>, <code>bật noclip<\/code>, <code>tắt noclip<\/code> and <code>dừng tất cả di chuyển<\/code>. Starting a feature or changing a speed requires confirmation; stopping does not. Speeds are whole numbers from 4 to 100. Only your own current character is affected; nothing is persisted across sessions, and these are not executable macro steps. <code>AiPermission(&quot;Body&quot;, false)<\/code> immediately revokes and stops movement, and <code>Free<\/code> remains disabled. Movement permission defaults on but every activation requires confirmation.<\/p>\n<p>While flying, use the normal movement controls and aim the camera up/down; Space or jump rises, Ctrl/C descends on desktop. Flight is client-side using the local character and may not work with every rig, executor, mobile control scheme, server-authoritative game, or anti-cheat. Stopping flight may cause falling. Noclip tracks original collision values and attempts to restore them when stopped; another script changing the same properties can interfere. Cross stops and cleans up when the character is removed or dies, when Cross is disabled, or when the window is destroyed. Speed restoration is conditional if the game changed it; reapply manually after respawning. Test only where you are permitted to use these capabilities.<\/p>\n<h2>Music<\/h2>\n<p>Existing Cross music search/play remains unchanged and may use the internet. Favorites and playlists in the integrated engine use downloaded files: <code>favorite gentle song<\/code>, <code>thêm gentle song vào playlist chill<\/code>, <code>phát playlist chill<\/code>, <code>bài tiếp playlist chill<\/code>, <code>danh sách yêu thích<\/code>, <code>danh sách playlist<\/code>, <code>lịch sử nhạc<\/code>. Disable Music Auto before playlist playback; a local audio asset API is required. Playlist advancement is manual. Cache metadata and history can be incomplete or ambiguous, and requesting playback does not guarantee the client can decode the audio. The player can still independently access network resources.<\/p>\n<p>Internal modules are available through <code>Window.LocalAI<\/code>; lifecycle cleanup runs with the window. Local JSON is not an encryption or privacy guarantee. Mock tests cannot replace a real Roblox/Delta test.<\/p>\n","vi":"<h1>Cross: tích hợp xử lý offline<\/h1>\n<p>Người dùng chỉ dùng <strong>khung chat Cross hiện có trong Dynamic Island<\/strong>, không có tab Local AI mới. Các khả năng V2 chạy phía sau Cross. Đây là xử lý theo luật, không phải LLM: chỉ nhận diện một số mẫu tiếng Việt có/không dấu và tiếng Anh, không hiểu mọi câu tự do. Phần AI không cần model ngoài hay API key. Nhạc online và các chức năng mạng cũ hoạt động riêng.<\/p>\n<h2>Dùng hằng ngày<\/h2>\n<p>Mở Cross như cũ và thử <code>bật Main Auto Farm<\/code>, <code>giải thích Main Auto Farm<\/code>, <code>mở tab Main<\/code>, <code>chẩn đoán<\/code> hoặc <code>fps ping<\/code>. Các lệnh control thông thường vẫn dùng Cross cũ và yêu cầu xác nhận. Trả lời <code>có<\/code> / <code>yes<\/code> hoặc <code>không<\/code> / <code>no<\/code>. Control phải được đăng ký, không bị khóa, không trùng và còn tồn tại; quyền UI và <code>AIControl=false<\/code> vẫn có hiệu lực. Giải thích dựa trên loại control thực, không đoán công dụng riêng của script. Chẩn đoán chỉ báo tình trạng và lỗi Cross/Local AI quan sát được, không kiểm tra toàn bộ lỗi và không sửa source. FPS/Ping lấy từ số đo sẵn có, không bịa RAM. Cảnh báo kiểm tra mỗi 15 giây, tối đa một lần mỗi phút khi Cross bật.<\/p>\n<h2>Tự học và dữ liệu local<\/h2>\n<p>Cross tự học câu hợp lệ sau xác nhận và sở thích như trước, không cần thêm cài đặt hay giao diện quản lý. File cũ vẫn là <code>xNgotLibrary/AI/xNgotCrossAI_user_&lt;UserId&gt;.json<\/code>. Engine tích hợp vẫn dùng file riêng <code>xNgotLibrary/AI/LocalAI_v2_user_&lt;UserId&gt;.json<\/code> cho macro, yêu thích/lịch sử nhạc và dữ liệu V2 trước đó. Cài mới sẽ tự bật lưu local nếu executor hỗ trợ filesystem; lựa chọn bộ nhớ V2 có sẵn vẫn được giữ. File lỗi hoặc bị đổi từ bên ngoài được bảo vệ, không ghi đè. Nếu không lưu được, dữ liệu có thể chỉ tồn tại trong phiên. File là JSON local không mã hóa; bộ lọc không hoàn hảo nên <strong>đừng nhập bí mật<\/strong>. Bộ nhớ AI không đồng bộ online. Các câu V2 cũ vẫn được nhận diện nếu không trùng lệnh đã học của Cross.<\/p>\n<h2>Shell và phản hồi tiếng Việt<\/h2>\n<p>Trong Cross, mở <strong>Shell<\/strong>, nhập yêu cầu rồi bấm Gửi hoặc Enter. Shell gọi cùng bộ xử lý với Chat: thao tác được hỗ trợ thực sự chạy sau khi qua cùng bước kiểm tra quyền và xác nhận. Nhật ký có thể cuộn và tự kéo xuống dòng mới nhất khi có hoạt động mới hoặc mở lại Shell. Nhật ký hiển thị tin nhắn, xác nhận đang chờ và lỗi mà Cross thực sự trả lời; không giả lập lệnh hệ điều hành hay báo hoàn thành trước khi có kết quả. Bấm <strong>Chat<\/strong> để quay lại. Shell không phải Windows PowerShell và không chạy Lua hay lệnh hệ điều hành tùy ý. Tối đa 80 dòng sau khi xuống dòng được giữ trong phiên và xóa cùng chat Cross/khi đóng. Bộ lọc ẩn bí mật hoặc URL trong nhật ký chỉ là cố gắng, không bảo đảm; không nên nhập bí mật. Chat và Shell dùng chung trợ lý và trạng thái xác nhận.<\/p>\n<p>Cross chọn trả lời tiếng Việt hoặc tiếng Anh theo từ nhận diện được trong câu hỏi; hỗ trợ tiếng Việt có/không dấu. Câu ngắn không rõ ngôn ngữ thường giữ ngôn ngữ trước đó. Không phải mọi câu hay lỗi từ callback bên thứ ba đều dịch tự động.<\/p>\n<h2>Nhiều thao tác<\/h2>\n<p>Có thể nói <code>bật Main Auto Farm rồi tắt Main Auto Farm<\/code> mà không cần tạo macro trước. Mỗi bước cần xác nhận riêng; nói <code>tạm dừng macro<\/code>, <code>tiếp tục macro<\/code> hoặc <code>hủy macro<\/code>. Các bước đã thực hiện không tự hoàn tác. Chuỗi hỗ trợ Toggle/Section và Button được tác giả cấp <code>AIAllowMacro=true<\/code>. Tên nhạy cảm được lọc theo danh sách giới hạn; callback chạy code gốc nên không thể bảo đảm an toàn tuyệt đối. Lệnh đơn của Cross vẫn hỗ trợ nhiều loại control hơn.<\/p>\n<p>Nếu muốn lưu lại, có thể nói <code>tạo macro tên: bật Main Auto Farm; tắt Main Auto Farm<\/code>, <code>chạy macro tên<\/code>, <code>danh sách macro<\/code> hoặc <code>xóa macro tên<\/code>. Đây chỉ là lựa chọn qua chat, không phải bước cài đặt khi dùng bình thường. Câu ngoài mẫu có thể không được nhận diện và không được tự chạy.<\/p>\n<h2>Di chuyển nhân vật local<\/h2>\n<p>Nhập trong Cross hoặc Shell: <code>tốc độ 32<\/code>, <code>đặt lại tốc độ<\/code>, <code>bật bay<\/code>, <code>tốc độ bay 50<\/code>, <code>tắt bay<\/code>, <code>bật noclip<\/code>, <code>tắt noclip<\/code> hoặc <code>dừng tất cả di chuyển<\/code>. Tiếng Anh có <code>speed 32<\/code>, <code>reset speed<\/code>, <code>fly<\/code>, <code>fly speed 50<\/code>, <code>disable fly<\/code>, <code>noclip<\/code>, <code>disable noclip<\/code>, <code>stop movement<\/code>. Bật hoặc thay đổi tốc độ phải xác nhận; lệnh dừng không cần xác nhận. Tốc độ là số nguyên từ 4 đến 100. Chỉ tác động nhân vật hiện tại của bạn; không lưu qua phiên và không đưa các lệnh này vào macro. <code>AiPermission(&quot;Body&quot;, false)<\/code> thu hồi quyền và dừng ngay; <code>Free<\/code> vẫn tắt. Quyền di chuyển mặc định bật nhưng từng lần kích hoạt vẫn cần xác nhận.<\/p>\n<p>Khi bay, dùng điều khiển di chuyển bình thường và hướng camera lên/xuống; Space hoặc nút nhảy để lên, Ctrl/C trên máy tính để xuống. Đây là hiệu ứng phía client, có thể không hoạt động với mọi rig, executor, cách điều khiển mobile, game do server quyết định hoặc anti-cheat. Tắt bay có thể khiến nhân vật rơi. Noclip ghi lại và cố khôi phục va chạm khi dừng; script khác sửa cùng thuộc tính có thể gây xung đột. Cross dừng và dọn khi nhân vật bị xóa/chết, Cross bị tắt hoặc cửa sổ bị đóng. Tốc độ chỉ được khôi phục nếu game chưa đổi giá trị; cần bật lại sau hồi sinh. Chỉ sử dụng tại nơi bạn được phép.<\/p>\n<h2>Nhạc<\/h2>\n<p>Tìm/phát nhạc Cross cũ không thay đổi và có thể dùng mạng. Yêu thích và playlist mới dùng file đã tải: <code>favorite gentle song<\/code>, <code>thêm gentle song vào playlist chill<\/code>, <code>phát playlist chill<\/code>, <code>bài tiếp playlist chill<\/code>, <code>danh sách yêu thích<\/code>, <code>danh sách playlist<\/code>, <code>lịch sử nhạc<\/code>. Tắt Music Auto trước khi phát playlist; executor cần API nạp audio local. Chuyển bài playlist thủ công. Metadata cache/lịch sử có thể thiếu hoặc trùng; yêu cầu phát không bảo đảm client giải mã được audio. Player cũ vẫn có thể truy cập mạng độc lập.<\/p>\n<p>Module nội bộ vẫn ở <code>Window.LocalAI<\/code> và được dọn khi đóng cửa sổ. JSON local không phải cơ chế mã hóa. Test mock không thay thế test Roblox/Delta thực tế.<\/p>\n"},"plain":{"en":" Cross: integrated offline intelligence\n\nThe existing Cross chat in Dynamic Island is the only assistant interface; there is no additional Local AI tab. Offline rule-based V2 capabilities run behind Cross. This is not an LLM: it recognizes selected Vietnamese (with or without accents) and English patterns, not every free-form sentence. AI processing does not require an external model or AI key. Existing online music and other network features remain independent.\n\n Everyday use\n\nOpen Cross as before and ask bật Main Auto Farm, giải thích Main Auto Farm, mở tab Main, chẩn đoán, or fps ping. Ordinary controls still use Cross's existing control support and confirmation. Say có / yes or không / no. Targets must be registered, unlocked, unambiguous and still valid; the UI permission switch and AIControl=false remain effective. Explaining describes the real control type, not unknown script-specific behavior. Diagnostics reports availability and errors observed by Cross or Local AI, not all failures; it does not modify source. FPS/Ping are sampled from existing metrics; no RAM is guessed. Alerts check every 15 seconds, at most one per minute, while Cross is enabled.\n\n Automatic learning and local data\n\nCross automatically learns eligible confirmed commands and preferences, just as before. No additional learning settings or UI are required. Its file remains xNgotLibrary/AI/xNgotCrossAI_user_<UserId>.json. The integrated engine also uses its existing separate xNgotLibrary/AI/LocalAI_v2_user_<UserId>.json for its own macros, music favorites and history, and previous V2 data. On a new installation, its local persistence is enabled automatically when filesystem support exists. An existing V2 memory setting is respected; invalid or externally changed files are protected from overwriting. If filesystem access fails, data may last only for the session. Files are local plain JSON, not encrypted; filtering is imperfect, so do not enter secrets. No online sync is performed by AI memory. Individual old V2 phrases remain recognized when they do not conflict with Cross's learned commands.\n\n Shell and Vietnamese replies\n\nOpen Shell inside Cross, type a request and press Send or Enter. It calls the same Cross handler as Chat: supported actions really run only after the same permission checks and confirmations. The scrollable activity log automatically jumps to the newest line when new activity arrives or Shell reopens. It mirrors actual Cross messages and responses, including pending confirmations and reported errors; it does not invent operating-system commands or claim completion before it is reported. Use Chat to return. Shell is not Windows PowerShell and cannot execute arbitrary Lua or OS commands. The last 80 wrapped lines are kept in session memory and cleared with Cross chat/window shutdown. Potential secrets and URLs are hidden from the log on a best-effort basis, not guaranteed; avoid entering them. Chat and Shell use the same assistant and confirmation state.\n\nCross chooses Vietnamese or English based on recognizable words in the request; Vietnamese with and without accents is supported. Ambiguous short replies generally retain the previous language. Not every phrase or error from third-party callbacks can be translated automatically.\n\n Several actions\n\nFor a one-time sequence, say bật Main Auto Farm rồi tắt Main Auto Farm. Each step needs a separate confirmation; tạm dừng macro, tiếp tục macro, and hủy macro control it. Steps already completed are

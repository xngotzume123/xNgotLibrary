<script>
const PAGES = [{"id":"start","num":"01","group":{"en":"START HERE","vi":"BẮT ĐẦU"},"title":{"en":"Introduction","vi":"Giới thiệu"},"html":{"en":"<h1>Your interface, made simpler.<\/h1>\n<p>xNgot Library is a Roblox UI library for building script hubs: windows, controls, saved settings, notifications and a built-in Dynamic Island. This guide covers the <strong>local build from this workspace<\/strong>, including the integrated Ophyn key screen.<\/p>\n<blockquote>\n<p><strong>Version note:<\/strong> These pages describe the updated test build. The GitHub <code>main<\/code> branch and raw download URL may still serve an older build until you upload the updated files.<\/p>\n<\/blockquote>\n<h2>What you can build<\/h2>\n<ul>\n<li><strong>A complete hub<\/strong> with tabs, toggles, sliders, inputs and dialogs.<\/li>\n<li><strong>A key gate<\/strong> with local keys, PandaAuth, Jnkie, Platoboost or a custom validator.<\/li>\n<li><strong>A floating companion<\/strong> for notifications, timers and music.<\/li>\n<li><strong>A personal look<\/strong> with UI presets, colors, fonts and saved profiles.<\/li>\n<\/ul>\n<h2>Your first steps<\/h2>\n<ol>\n<li>Load the local <code>main.lua<\/code> and create a window.<\/li>\n<li>Add a tab and some controls.<\/li>\n<li>Configure a key system only if your hub needs one.<\/li>\n<li>Use the floating panel and theme APIs as needed.<\/li>\n<\/ol>\n<blockquote>\n<p><strong>Client-side security:<\/strong> local keys and any secrets embedded in a client script can be extracted. Use a trusted server-side design for real authorization.<\/p>\n<\/blockquote>\n","vi":"<h1>Một giao diện, vô vàn ý tưởng.<\/h1>\n<p>xNgot Library là thư viện UI Roblox giúp bạn tạo script hub với cửa sổ, các điều khiển, tự lưu cài đặt, thông báo và Dynamic Island tích hợp. Tài liệu này mô tả <strong>bản build trong workspace<\/strong>, bao gồm màn hình key Ophyn đã tích hợp.<\/p>\n<blockquote>\n<p><strong>Lưu ý phiên bản:<\/strong> Tài liệu dành cho bản test đã cập nhật. Nhánh <code>main<\/code> và link raw trên GitHub có thể vẫn là bản cũ cho đến khi bạn đưa các file mới lên repo.<\/p>\n<\/blockquote>\n<h2>Bạn có thể tạo gì?<\/h2>\n<ul>\n<li><strong>Một hub hoàn chỉnh<\/strong> với tab, công tắc, thanh kéo, ô nhập và hộp thoại.<\/li>\n<li><strong>Màn hình key<\/strong> với key local, PandaAuth, Jnkie, Platoboost hoặc validator riêng.<\/li>\n<li><strong>Bảng nổi<\/strong> cho thông báo, hẹn giờ và nhạc.<\/li>\n<li><strong>Giao diện cá nhân<\/strong> với preset, màu, font và profile có thể lưu.<\/li>\n<\/ul>\n<h2>Bắt đầu từ đâu?<\/h2>\n<ol>\n<li>Nạp file <code>main.lua<\/code> trong workspace và tạo cửa sổ.<\/li>\n<li>Thêm tab cùng các thành phần cần thiết.<\/li>\n<li>Cấu hình key system nếu hub của bạn cần khóa.<\/li>\n<li>Dùng API bảng nổi và theme khi cần.<\/li>\n<\/ol>\n<blockquote>\n<p><strong>Bảo mật phía client:<\/strong> key local và secret nhúng trong script đều có thể bị đọc. Muốn xác thực thực sự, hãy thiết kế kiểm tra trên máy chủ đáng tin cậy.<\/p>\n<\/blockquote>\n"},"plain":{"en":" Your interface, made simpler.\n\nxNgot Library is a Roblox UI library for building script hubs: windows, controls, saved settings, notifications and a built-in Dynamic Island. This guide covers the local build from this workspace, including the integrated Ophyn key screen.\n\n> Version note: These pages describe the updated test build. The GitHub main branch and raw download URL may still serve an older build until you upload the updated files.\n\n What you can build\n\n- A complete hub with tabs, toggles, sliders, inputs and dialogs.\n- A key gate with local keys, PandaAuth, Jnkie, Platoboost or a custom validator.\n- A floating companion for notifications, timers and music.\n- A personal look with UI presets, colors, fonts and saved profiles.\n\n Your first steps\n\n1. Load the local main.lua and create a window.\n2. Add a tab and some controls.\n3. Configure a key system only if your hub needs one.\n4. Use the floating panel and theme APIs as needed.\n\n> Client-side security: local keys and any secrets embedded in a client script can be extracted. Use a trusted server-side design for real authorization.\n","vi":" Một giao diện, vô vàn ý tưởng.\n\nxNgot Library là thư viện UI Roblox giúp bạn tạo script hub với cửa sổ, các điều khiển, tự lưu cài đặt, thông báo và Dynamic Island tích hợp. Tài liệu này mô tả bản build trong workspace, bao gồm màn hình key Ophyn đã tích hợp.\n\n> Lưu ý phiên bản: Tài liệu dành cho bản test đã cập nhật. Nhánh main và link raw trên GitHub có thể vẫn là bản cũ cho đến khi bạn đưa các file mới lên repo.\n\n Bạn có thể tạo gì?\n\n- Một hub hoàn chỉnh với tab, công tắc, thanh kéo, ô nhập và hộp thoại.\n- Màn hình key với key local, PandaAuth, Jnkie, Platoboost hoặc validator riêng.\n- Bảng nổi cho thông báo, hẹn giờ và nhạc.\n- Giao diện cá nhân với preset, màu, font và profile có thể lưu.\n\n Bắt đầu từ đâu?\n\n1. Nạp file main.lua trong workspace và tạo cửa sổ.\n2. Thêm tab cùng các thành phần cần thiết.\n3. Cấu hình key system nếu hub của bạn cần khóa.\n4. Dùng API bảng nổi và theme khi cần.\n\n> Bảo mật phía client: key local và secret nhúng trong script đều có thể bị đọc. Muốn xác thực thực sự, hãy thiết kế kiểm tra trên máy chủ đáng tin cậy.\n"}},{"id":"install","num":"02","group":{"en":"START HERE","vi":"BẮT ĐẦU"},"title":{"en":"Installation","vi":"Cài đặt"},"html":{"en":"<h1>Installation<\/h1>\n<p>Place the updated <code>main.lua<\/code> in your executor's workspace. Test that <code>readfile<\/code> and <code>loadstring<\/code> are supported. Downloading into the device's Downloads folder does not automatically put the file in the executor workspace.<\/p>\n<h2>Load from a local file<\/h2>\n<pre><code class=\"language-lua\">getgenv().xNgotLibraryOnly = true\n\nlocal source = readfile(&quot;main.lua&quot;)\nlocal chunk, err = loadstring(source)\nassert(chunk, err)\nlocal LIB = chunk()\n<\/code><\/pre>\n<p>Set <code>xNgotLibraryOnly<\/code> <strong>before<\/strong> loading to get the library without opening the demo. Without it, the file normally starts the demo. Keep the final <code>()<\/code> when using <code>loadstring(readfile(...))()<\/code>.<\/p>\n<h2>Load from GitHub<\/h2>\n<p>After updating <code>dist/main.lua<\/code> in your repository, your raw URL can be used:<\/p>\n<pre><code class=\"language-lua\">getgenv().xNgotLibraryOnly = true\nlocal LIB = loadstring(game:HttpGet(\n    &quot;https://raw.githubusercontent.com/xngotzume123/xNgotLibrary/refs/heads/main/dist/main.lua&quot;\n))()\n<\/code><\/pre>\n<blockquote>\n<p>The raw URL points to what is actually published on GitHub, not the local test file. It will not contain these changes until that file is committed and pushed.<\/p>\n<\/blockquote>\n<h2>Build from source<\/h2>\n<pre><code class=\"language-bash\">python3 src/build.py --release --minify\n<\/code><\/pre>\n<p>This produces <code>dist/main.lua<\/code> and one-line-after-credit <code>dist/main.min.lua<\/code>. The one-line wrapper requires <code>loadstring<\/code> and reconstructs light minified source at runtime; use <code>main.min.light.lua<\/code> from the release ZIP or rebuild with <code>--minify light<\/code> if needed. Successful compiler checks do not replace Roblox testing.<\/p>\n","vi":"<h1>Cài đặt<\/h1>\n<p>Đặt file <code>main.lua<\/code> đã cập nhật vào workspace của executor. Kiểm tra executor có hỗ trợ <code>readfile<\/code> và <code>loadstring<\/code>. File trong thư mục Downloads của điện thoại không tự nằm trong workspace của executor.<\/p>\n<h2>Nạp từ file local<\/h2>\n<pre><code class=\"language-lua\">getgenv().xNgotLibraryOnly = true\n\nlocal source = readfile(&quot;main.lua&quot;)\nlocal chunk, err = loadstring(source)\nassert(chunk, err)\nlocal LIB = chunk()\n<\/code><\/pre>\n<p>Đặt <code>xNgotLibraryOnly<\/code> <strong>trước<\/strong> khi nạp để chỉ lấy thư viện, không tự mở demo. Nếu không đặt cờ, file thường sẽ mở demo. Khi dùng <code>loadstring(readfile(...))()<\/code>, đừng quên <code>()<\/code> cuối.<\/p>\n<h2>Nạp từ GitHub<\/h2>\n<p>Sau khi cập nhật <code>dist/main.lua<\/code> trên repo, bạn có thể dùng link raw:<\/p>\n<pre><code class=\"language-lua\">getgenv().xNgotLibraryOnly = true\nlocal LIB = loadstring(game:HttpGet(\n    &quot;https://raw.githubusercontent.com/xngotzume123/xNgotLibrary/refs/heads/main/dist/main.lua&quot;\n))()\n<\/code><\/pre>\n<blockquote>\n<p>Link raw luôn lấy nội dung đang được đăng trên GitHub, không phải file test trong workspace. Các thay đổi chỉ xuất hiện sau khi bạn commit và push file mới.<\/p>\n<\/blockquote>\n<h2>Build từ source<\/h2>\n<pre><code class=\"language-bash\">python3 src/build.py --release --minify\n<\/code><\/pre>\n<p>Lệnh tạo <code>dist/main.lua<\/code> và <code>dist/main.min.lua<\/code> chỉ một dòng sau credit. Wrapper một dòng cần <code>loadstring<\/code>, dựng lại mã light khi chạy; nếu cần, dùng <code>main.min.light.lua<\/code> trong ZIP hoặc build với <code>--minify light<\/code>. Compile thành công không thay thế test trong Roblox.<\/p>\n"},"plain":{"en":" Installation\n\nPlace the updated main.lua in your executor's workspace. Test that readfile and loadstring are supported. Downloading into the device's Downloads folder does not automatically put the file in the executor workspace.\n\n Load from a local file\n\nlua\ngetgenv().xNgotLibraryOnly = true\n\nlocal source = readfile(\"main.lua\")\nlocal chunk, err = loadstring(source)\nassert(chunk, err)\nlocal LIB = chunk()\n\n\nSet xNgotLibraryOnly before loading to get the library without opening the demo. Without it, the file normally starts the demo. Keep the final () when using loadstring(readfile(...))().\n\n Load from GitHub\n\nAfter updating dist/main.lua in your repository, your raw URL can be used:\n\nlua\ngetgenv().xNgotLibraryOnly = true\nlocal LIB = loadstring(game:HttpGet(\n    \"https://raw.githubusercontent.com/xngotzume123/xNgotLibrary/refs/heads/main/dist/main.lua\"\n))()\n\n\n> The raw URL points to what is actually published on GitHub, not the local test file. It will not contain these changes until that file is committed and pushed.\n\n Build from source\n\nbash\npython3 src/build.py --release --minify\n\n\nThis produces dist/main.lua and one-line-after-credit dist/main.min.lua. The one-line wrapper requires loadstring and reconstructs light minified source at runtime; use main.min.light.lua from the release ZIP or rebuild with --minify light if needed. Successful compiler checks do not replace Roblox testing.\n","vi":" Cài đặt\n\nĐặt file main.lua đã cập nhật vào workspace của executor. Kiểm tra executor có hỗ trợ readfile và loadstring. File trong thư mục Downloads của điện thoại không tự nằm trong workspace của executor.\n\n Nạp từ file local\n\nlua\ngetgenv().xNgotLibraryOnly = true\n\nlocal source = readfile(\"main.lua\")\nlocal chunk, err = loadstring(source)\nassert(chunk, err)\nlocal LIB = chunk()\n\n\nĐặt xNgotLibraryOnly trước khi nạp để chỉ lấy thư viện, không tự mở demo. Nếu không đặt cờ, file thường sẽ mở demo. Khi dùng loadstring(readfile(...))(), đừng quên () cuối.\n\n Nạp từ GitHub\n\nSau khi cập nhật dist/main.lua trên repo, bạn có thể dùng link raw:\n\nlua\ngetgenv().xNgotLibraryOnly = true\nlocal LIB = loadstring(game:HttpGet(\n    \"https://raw.githubusercontent.com/xngotzume123/xNgotLibrary/refs/heads/main/dist/main.lua\"\n))()\n\n\n> Link raw luôn lấy nội dung đang được đăng trên GitHub, không phải file test trong workspace. Các thay đổi chỉ xuất hiện sau khi bạn commit và push file mới.\n\n Build từ source\n\nbash\npython3 src/build.py --release --minify\n\n\nLệnh tạo dist/main.lua và dist/main.min.lua chỉ một dòng sau credit. Wrapper một dòng cần loadstring, dựng lại mã light khi chạy; nếu cần, dùng main.min.light.lua trong ZIP hoặc build với --minify light. Compile thành công không thay thế test trong Roblox.\n"}},{"id":"window","num":"03","group":{"en":"BUILD A HUB","vi":"TẠO HUB"},"title":{"en":"Windows & tabs","vi":"Cửa sổ và tab"},"html":{"en":"<h1>Windows &amp; tabs<\/h1>\n<p>Create a window from the library, then add a tab. The example assumes <code>LIB<\/code> has already been loaded in library-only mode.<\/p>\n<pre><code class=\"language-lua\">local Window = LIB:CreateWindow({\n    Title = &quot;My Hub&quot;,\n    Icon = &quot;sparkles&quot;,\n    Version = &quot;v1.0.0&quot;,\n    Size = UDim2.fromOffset(620, 440),\n    ToggleKey = Enum.KeyCode.RightShift,\n    Folder = &quot;MyHub&quot;,\n    FileSaveName = &quot;settings.json&quot;,\n    AutoSave = true,\n})\n\nlocal Main = Window:Tab({ Title = &quot;Main&quot;, Icon = &quot;house&quot; })\nMain:Button({ Title = &quot;Hello&quot;, Callback = function()\n    print(&quot;Hello from xNgot&quot;)\nend })\n<\/code><\/pre>\n<h2>Window options<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Option<\/th>\n  <th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code>, <code>Icon<\/code>, <code>Version<\/code><\/td>\n  <td>Window title, icon name and version text. <code>Author<\/code> takes precedence over <code>Version<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Size<\/code>, <code>ToggleKey<\/code><\/td>\n  <td>Initial size and keyboard shortcut.<\/td>\n<\/tr>\n<tr>\n  <td><code>Folder<\/code>, <code>FileSaveName<\/code>, <code>AutoSave<\/code><\/td>\n  <td>Configuration location and autosave behavior.<\/td>\n<\/tr>\n<tr>\n  <td><code>SettingsUI<\/code><\/td>\n  <td>Defaults to <code>true<\/code>; <code>false<\/code> removes Settings and the integrated island.<\/td>\n<\/tr>\n<tr>\n  <td><code>Loading<\/code><\/td>\n  <td>Loader configuration; <code>false<\/code> disables it when no key gate is enabled.<\/td>\n<\/tr>\n<tr>\n  <td><code>KeySystem<\/code><\/td>\n  <td>Key gate settings; see the key system section.<\/td>\n<\/tr>\n<tr>\n  <td><code>AdminInfo<\/code><\/td>\n  <td>Custom author information, or <code>false<\/code> to disable it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Control the window<\/h2>\n<pre><code class=\"language-lua\">Window:SelectTab(&quot;Main&quot;)\nWindow:Hide()\nWindow:Show()\nWindow:Toggle()\nWindow:SetToggleKey(Enum.KeyCode.RightShift)\n-- Window:Destroy() -- closes and cleans up\n<\/code><\/pre>\n<p>Creating another xNgot window replaces the previous active xNgot window, even if the title differs. Its window, island, key screen and associated connections are cleaned up; unrelated game interfaces are not intentionally removed.<\/p>\n<p>The window and island are held until the key screen completes. If the user closes the key screen before authentication, the window is destroyed rather than unlocked.<\/p>\n","vi":"<h1>Cửa sổ và tab<\/h1>\n<p>Tạo cửa sổ từ thư viện rồi thêm tab. Ví dụ giả sử bạn đã nạp <code>LIB<\/code> ở chế độ library-only.<\/p>\n<pre><code class=\"language-lua\">local Window = LIB:CreateWindow({\n    Title = &quot;My Hub&quot;,\n    Icon = &quot;sparkles&quot;,\n    Version = &quot;v1.0.0&quot;,\n    Size = UDim2.fromOffset(620, 440),\n    ToggleKey = Enum.KeyCode.RightShift,\n    Folder = &quot;MyHub&quot;,\n    FileSaveName = &quot;settings.json&quot;,\n    AutoSave = true,\n})\n\nlocal Main = Window:Tab({ Title = &quot;Main&quot;, Icon = &quot;house&quot; })\nMain:Button({ Title = &quot;Xin chào&quot;, Callback = function()\n    print(&quot;Xin chào từ xNgot&quot;)\nend })\n<\/code><\/pre>\n<h2>Tùy chọn cửa sổ<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Tùy chọn<\/th>\n  <th>Ý nghĩa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Title<\/code>, <code>Icon<\/code>, <code>Version<\/code><\/td>\n  <td>Tên cửa sổ, tên icon, phiên bản; <code>Author<\/code> ưu tiên hơn <code>Version<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Size<\/code>, <code>ToggleKey<\/code><\/td>\n  <td>Kích thước ban đầu và phím tắt.<\/td>\n<\/tr>\n<tr>\n  <td><code>Folder<\/code>, <code>FileSaveName<\/code>, <code>AutoSave<\/code><\/td>\n  <td>Nơi lưu cấu hình và chế độ tự lưu.<\/td>\n<\/tr>\n<tr>\n  <td><code>SettingsUI<\/code><\/td>\n  <td>Mặc định <code>true<\/code>; <code>false<\/code> bỏ Settings và Dynamic Island tích hợp.<\/td>\n<\/tr>\n<tr>\n  <td><code>Loading<\/code><\/td>\n  <td>Cấu hình loader; <code>false<\/code> tắt loader nếu không bật khóa key.<\/td>\n<\/tr>\n<tr>\n  <td><code>KeySystem<\/code><\/td>\n  <td>Cấu hình key; xem mục key system.<\/td>\n<\/tr>\n<tr>\n  <td><code>AdminInfo<\/code><\/td>\n  <td>Thông tin tác giả tùy chỉnh, hoặc <code>false<\/code> để tắt.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Điều khiển cửa sổ<\/h2>\n<pre><code class=\"language-lua\">Window:SelectTab(&quot;Main&quot;)\nWindow:Hide()\nWindow:Show()\nWindow:Toggle()\nWindow:SetToggleKey(Enum.KeyCode.RightShift)\n-- Window:Destroy() -- đóng và dọn dẹp\n<\/code><\/pre>\n<p>Khi tạo cửa sổ xNgot mới, cửa sổ xNgot đang hoạt động sẽ được thay thế kể cả khi khác tên. Thư viện dọn cửa sổ, Island, màn hình key và kết nối liên quan; không chủ đích xóa giao diện khác của game.<\/p>\n<p>Cửa sổ và bảng nổi chờ đến khi màn hình key hoàn tất. Nếu đóng màn hình key trước khi xác thực, cửa sổ sẽ được đóng thay vì tự mở khóa.<\/p>\n"},"plain":{"en":" Windows & tabs\n\nCreate a window from the library, then add a tab. The example assumes LIB has already been loaded in library-only mode.\n\nlua\nlocal Window = LIB:CreateWindow({\n    Title = \"My Hub\",\n    Icon = \"sparkles\",\n    Version = \"v1.0.0\",\n    Size = UDim2.fromOffset(620, 440),\n    ToggleKey = Enum.KeyCode.RightShift,\n    Folder = \"MyHub\",\n    FileSaveName = \"settings.json\",\n    AutoSave = true,\n})\n\nlocal Main = Window:Tab({ Title = \"Main\", Icon = \"house\" })\nMain:Button({ Title = \"Hello\", Callback = function()\n    print(\"Hello from xNgot\")\nend })\n\n\n Window options\n\n| Option | Description |\n| --- | --- |\n| Title, Icon, Version | Window title, icon name and version text. Author takes precedence over Version. |\n| Size, ToggleKey | Initial size and keyboard shortcut. |\n| Folder, FileSaveName, AutoSave | Configuration location and autosave behavior. |\n| SettingsUI | Defaults to true; false removes Settings and the integrated island. |\n| Loading | Loader configuration; false disables it when no key gate is enabled. |\n| KeySystem | Key gate settings; see the key system section. |\n| AdminInfo | Custom author information, or false to disable it. |\n\n Control the window\n\nlua\nWindow:SelectTab(\"Main\")\nWindow:Hide()\nWindow:Show()\nWindow:Toggle()\nWindow:SetToggleKey(Enum.KeyCode.RightShift)\n-- Window:Destroy() -- closes and cleans up\n\n\nCreating another xNgot window replaces the previous active xNgot window, even if the title differs. Its window, island, key screen and associated connections are cleaned up; unrelated game interfaces are not intentionally removed.\n\nThe window and island are held until the key screen completes. If the user closes the key screen before authentication, the window is destroyed rather than unlocked.\n","vi":" Cửa sổ và tab\n\nTạo cửa sổ từ thư viện rồi thêm tab. Ví dụ giả sử bạn đã nạp LIB ở chế độ library-only.\n\nlua\nlocal Window = LIB:CreateWindow({\n    Title = \"My Hub\",\n    Icon = \"sparkles\",\n    Version = \"v1.0.0\",\n    Size = UDim2.fromOffset(620, 440),\n    ToggleKey = Enum.KeyCode.RightShift,\n    Folder = \"MyHub\",\n    FileSaveName = \"settings.json\",\n    AutoSave = true,\n})\n\nlocal Main = Window:Tab({ Title = \"Main\", Icon = \"house\" })\nMain:Button({ Title = \"Xin chào\", Callback = function()\n    print(\"Xin chào từ xNgot\")\nend })\n\n\n Tùy chọn cửa sổ\n\n| Tùy chọn | Ý nghĩa |\n| --- | --- |\n| Title, Icon, Version | Tên cửa sổ, tên icon, phiên bản; Author ưu tiên hơn Version. |\n| Size, ToggleKey | Kích thước ban đầu và phím tắt. |\n| Folder, FileSaveName, AutoSave | Nơi lưu cấu hình và chế độ tự lưu. |\n| SettingsUI | Mặc định true; false bỏ Settings và Dynamic Island tích hợp. |\n| Loading | Cấu hình loader; false tắt loader nếu không bật khóa key. |\n| KeySystem | Cấu hình key; xem mục key system. |\n| AdminInfo | Thông tin tác giả tùy chỉnh, hoặc false để tắt. |\n\n Điều khiển cửa sổ\n\nlua\nWindow:SelectTab(\"Main\")\nWindow:Hide()\nWindow:Show()\nWindow:Toggle()\nWindow:SetToggleKey(Enum.KeyCode.RightShift)\n-- Window:Destroy() -- đóng và dọn dẹp\n\n\nKhi tạo cửa sổ xNgot mới, cửa sổ xNgot đang hoạt động sẽ được thay thế kể cả khi khác tên. Thư viện dọn cửa sổ, Island, màn hình key và kết nối liên quan; không chủ đích xóa giao diện khác của game.\n\nCửa sổ và bảng nổi chờ đến khi màn hình key hoàn tất. Nếu đóng màn hình key trước khi xác thực, cửa sổ sẽ được đóng thay vì tự mở khóa.\n"}},{"id":"controls","num":"04","group":{"en":"BUILD A HUB","vi":"TẠO HUB"},"title":{"en":"UI components","vi":"Thành phần UI"},"html":{"en":"<h1>UI components<\/h1>\n<p>On touch devices, controls retain their original visual size while touch handling reduces accidental taps. Slider taps and horizontal drags adjust the value; vertical swipes are treated as scrolling. Single-select dropdowns close after a touch selection, while multi-select stays open. The selection highlight indicates the selected value, not a stuck press.<\/p>\n<p>Add elements to a tab using <code>Tab:Button<\/code>, <code>Tab:Toggle<\/code>, <code>Tab:Slider<\/code>, <code>Tab:Input<\/code>, <code>Tab:Dropdown<\/code>, <code>Tab:Colorpicker<\/code>, <code>Tab:Section<\/code>, <code>Tab:Paragraph<\/code>, <code>Tab:Code<\/code>, <code>Tab:Discord<\/code> and <code>Tab:InfoNguyenNhat<\/code>.<\/p>\n<h2>Buttons and text<\/h2>\n<pre><code class=\"language-lua\">Main:Section({ Title = &quot;General&quot;, Default = true })\nMain:Paragraph({ Title = &quot;Welcome&quot;, Desc = &quot;Choose an option below.&quot; })\nMain:Button({ Title = &quot;Refresh&quot;, Callback = function()\n    print(&quot;Refresh&quot;)\nend })\nlocal sample = Main:Code({ Title = &quot;Example&quot;, Code = &quot;print('hello')&quot; })\nsample:SetCode(&quot;print('updated')&quot;)\n<\/code><\/pre>\n<h2>State controls<\/h2>\n<pre><code class=\"language-lua\">local toggle = Main:Toggle({\n    Title = &quot;Enabled&quot;, Default = false,\n    Callback = function(on) print(&quot;Enabled:&quot;, on) end,\n})\nlocal slider = Main:Slider({\n    Title = &quot;Speed&quot;, Value = { Min = 1, Max = 100, Default = 25 }, Step = 1,\n    Callback = function(value) print(value) end,\n})\nlocal input = Main:Input({ Title = &quot;Name&quot;, Placeholder = &quot;Type a name&quot; })\ntoggle:Set(true)\nslider:Set(50)\ninput:Set(&quot;xNgot&quot;)\n<\/code><\/pre>\n<blockquote>\n<p>Toggle, slider, input, dropdown and color-picker callbacks can run during creation with an initial or saved value. Do not assume callbacks only run after a click.<\/p>\n<\/blockquote>\n<h2>Dropdown and color<\/h2>\n<pre><code class=\"language-lua\">local menu = Main:Dropdown({\n    Title = &quot;Mode&quot;, Values = { &quot;Default&quot;, &quot;Fast&quot;, &quot;Quiet&quot; }, Value = &quot;Default&quot;,\n    Callback = function(value) print(value) end,\n})\nmenu:Refresh({ &quot;Default&quot;, &quot;Fast&quot;, &quot;Quiet&quot; })\nmenu:Select(&quot;Fast&quot;)\n\nMain:Colorpicker({\n    Title = &quot;Accent&quot;, Default = Color3.fromRGB(10, 135, 213),\n    Callback = function(color) print(color) end,\n})\n<\/code><\/pre>\n<p>Use distinct element titles within each tab: titles are used as configuration keys. <code>Multi = true<\/code> enables a multi-select dropdown; <code>AllowNone = true<\/code> permits no selection. Many controls also expose <code>:SetTitle<\/code>, <code>:SetDesc<\/code>, <code>:Lock<\/code>, <code>:Unlock<\/code> and <code>:Destroy<\/code>; check the specific component before relying on a method.<\/p>\n","vi":"<h1>Thành phần UI<\/h1>\n<p>Trên thiết bị cảm ứng, điều khiển giữ kích thước hiển thị như cũ và xử lý chạm để giảm nhấn lộn. Slider nhận chạm hoặc kéo ngang; vuốt dọc được xem là cuộn. Dropdown chọn một mục sẽ đóng sau khi chạm chọn, còn chọn nhiều mục vẫn mở. Màu của mục đã chọn là trạng thái lựa chọn, không phải hiệu ứng nhấn bị kẹt.<\/p>\n<p>Thêm thành phần vào tab bằng <code>Tab:Button<\/code>, <code>Tab:Toggle<\/code>, <code>Tab:Slider<\/code>, <code>Tab:Input<\/code>, <code>Tab:Dropdown<\/code>, <code>Tab:Colorpicker<\/code>, <code>Tab:Section<\/code>, <code>Tab:Paragraph<\/code>, <code>Tab:Code<\/code>, <code>Tab:Discord<\/code> và <code>Tab:InfoNguyenNhat<\/code>.<\/p>\n<h2>Nút và nội dung<\/h2>\n<pre><code class=\"language-lua\">Main:Section({ Title = &quot;Cơ bản&quot;, Default = true })\nMain:Paragraph({ Title = &quot;Chào bạn&quot;, Desc = &quot;Chọn một tính năng bên dưới.&quot; })\nMain:Button({ Title = &quot;Làm mới&quot;, Callback = function()\n    print(&quot;Làm mới&quot;)\nend })\nlocal sample = Main:Code({ Title = &quot;Ví dụ&quot;, Code = &quot;print('hello')&quot; })\nsample:SetCode(&quot;print('updated')&quot;)\n<\/code><\/pre>\n<h2>Thành phần có trạng thái<\/h2>\n<pre><code class=\"language-lua\">local toggle = Main:Toggle({\n    Title = &quot;Bật&quot;, Default = false,\n    Callback = function(on) print(&quot;Bật:&quot;, on) end,\n})\nlocal slider = Main:Slider({\n    Title = &quot;Tốc độ&quot;, Value = { Min = 1, Max = 100, Default = 25 }, Step = 1,\n    Callback = function(value) print(value) end,\n})\nlocal input = Main:Input({ Title = &quot;Tên&quot;, Placeholder = &quot;Nhập tên&quot; })\ntoggle:Set(true)\nslider:Set(50)\ninput:Set(&quot;xNgot&quot;)\n<\/code><\/pre>\n<blockquote>\n<p>Callback của toggle, slider, input, dropdown và bảng màu có thể chạy ngay lúc tạo với giá trị mặc định hoặc giá trị đã lưu, không chỉ khi người dùng bấm.<\/p>\n<\/blockquote>\n<h2>Danh sách và bảng màu<\/h2>\n<pre><code class=\"language-lua\">local menu = Main:Dropdown({\n    Title = &quot;Chế độ&quot;, Values = { &quot;Default&quot;, &quot;Fast&quot;, &quot;Quiet&quot; }, Value = &quot;Default&quot;,\n    Callback = function(value) print(value) end,\n})\nmenu:Refresh({ &quot;Default&quot;, &quot;Fast&quot;, &quot;Quiet&quot; })\nmenu:Select(&quot;Fast&quot;)\n\nMain:Colorpicker({\n    Title = &quot;Màu nhấn&quot;, Default = Color3.fromRGB(10, 135, 213),\n    Callback = function(color) print(color) end,\n})\n<\/code><\/pre>\n<p>Đặt <code>Title<\/code> khác nhau trong cùng một tab vì tên được dùng làm khóa lưu cấu hình. <code>Multi = true<\/code> bật chọn nhiều, <code>AllowNone = true<\/code> cho phép không chọn. Nhiều thành phần có <code>:SetTitle<\/code>, <code>:SetDesc<\/code>, <code>:Lock<\/code>, <code>:Unlock<\/code> và <code>:Destroy<\/code>; hãy kiểm tra từng thành phần trước khi dùng.<\/p>\n"},"plain":{"en":" UI components\n\nOn touch devices, controls retain their original visual size while touch handling reduces accidental taps. Slider taps and horizontal drags adjust the value; vertical swipes are treated as scrolling. Single-select dropdowns close after a touch selection, while multi-select stays open. The selection highlight indicates the selected value, not a stuck press.\n\nAdd elements to a tab using Tab:Button, Tab:Toggle, Tab:Slider, Tab:Input, Tab:Dropdown, Tab:Colorpicker, Tab:Section, Tab:Paragraph, Tab:Code, Tab:Discord and Tab:InfoNguyenNhat.\n\n Buttons and text\n\nlua\nMain:Section({ Title = \"General\", Default = true })\nMain:Paragraph({ Title = \"Welcome\", Desc = \"Choose an option below.\" })\nMain:Button({ Title = \"Refresh\", Callback = function()\n    print(\"Refresh\")\nend })\nlocal sample = Main:Code({ Title = \"Example\", Code = \"print('hello')\" })\nsample:SetCode(\"print('updated')\")\n\n\n State controls\n\nlua\nlocal toggle = Main:Toggle({\n    Title = \"Enabled\", Default = false,\n    Callback = function(on) print(\"Enabled:\", on) end,\n})\nlocal slider = Main:Slider({\n    Title = \"Speed\", Value = { Min = 1, Max = 100, Default = 25 }, Step = 1,\n    Callback = function(value) print(value) end,\n})\nlocal input = Main:Input({ Title = \"Name\", Placeholder = \"Type a name\" })\ntoggle:Set(true)\nslider:Set(50)\ninput:Set(\"xNgot\")\n\n\n> Toggle, slider, input, dropdown and color-picker callbacks can run during creation with an initial or saved value. Do not assume callbacks only run after a click.\n\n Dropdown and color\n\nlua\nlocal menu = Main:Dropdown({\n    Title = \"Mode\", Values = { \"Default\", \"Fast\", \"Quiet\" }, Value = \"Default\",\n    Callback = function(value) print(value) end,\n})\nmenu:Refresh({ \"Default\", \"Fast\", \"Quiet\" })\nmenu:Select(\"Fast\")\n\nMain:Colorpicker({\n    Title = \"Accent\", Default = Color3.fromRGB(10, 135, 213),\n    Callback = function(color) print(color) end,\n})\n\n\nUse distinct element titles within each tab: titles are used as configuration keys. Multi = true enables a multi-select dropdown; AllowNone = true permits no selection. Many controls also expose :SetTitle, :SetDesc, :Lock, :Unlock and :Destroy; check the specific component before relying on a method.\n","vi":" Thành phần UI\n\nTrên thiết bị cảm ứng, điều khiển giữ kích thước hiển thị như cũ và xử lý chạm để giảm nhấn lộn. Slider nhận chạm hoặc kéo ngang; vuốt dọc được xem là cuộn. Dropdown chọn một mục sẽ đóng sau khi chạm chọn, còn chọn nhiều mục vẫn mở. Màu của mục đã chọn là trạng thái lựa chọn, không phải hiệu ứng nhấn bị kẹt.\n\nThêm thành phần vào tab bằng Tab:Button, Tab:Toggle, Tab:Slider, Tab:Input, Tab:Dropdown, Tab:Colorpicker, Tab:Section, Tab:Paragraph, Tab:Code, Tab:Discord và Tab:InfoNguyenNhat.\n\n Nút và nội dung\n\nlua\nMain:Section({ Title = \"Cơ bản\", Default = true })\nMain:Paragraph({ Title = \"Chào bạn\", Desc = \"Chọn một tính năng bên dưới.\" })\nMain:Button({ Title = \"Làm mới\", Callback = function()\n    print(\"Làm mới\")\nend })\nlocal sample = Main:Code({ Title = \"Ví dụ\", Code = \"print('hello')\" })\nsample:SetCode(\"print('updated')\")\n\n\n Thành phần có trạng thái\n\nlua\nlocal toggle = Main:Toggle({\n    Title = \"Bật\", Default = false,\n    Callback = function(on) print(\"Bật:\", on) end,\n})\nlocal slider = Main:Slider({\n    Title = \"Tốc độ\", Value = { Min = 1, Max = 100, Default = 25 }, Step = 1,\n    Callback = function(value) print(value) end,\n})\nlocal input = Main:Input({ Title = \"Tên\", Placeholder = \"Nhập tên\" })\ntoggle:Set(true)\nslider:Set(50)\ninput:Set(\"xNgot\")\n\n\n> Callback của toggle, slider, input, dropdown và bảng màu có thể chạy ngay lúc tạo với giá trị mặc định hoặc giá trị đã lưu, không chỉ khi người dùng bấm.\n\n Danh sách và bảng màu\n\nlua\nlocal menu = Main:Dropdown({\n    Title = \"Chế độ\", Values = { \"Default\", \"Fast\", \"Quiet\" }, Value = \"Default\",\n    Callback = function(value) print(value) end,\n})\nmenu:Refresh({ \"Default\", \"Fast\", \"Quiet\" })\nmenu:Select(\"Fast\")\n\nMain:Colorpicker({\n    Title = \"Màu nhấn\", Default = Color3.fromRGB(10, 135, 213),\n    Callback = function(color) print(color) end,\n})\n\n\nĐặt Title khác nhau trong cùng một tab vì tên được dùng làm khóa lưu cấu hình. Multi = true bật chọn nhiều, AllowNone = true cho phép không chọn. Nhiều thành phần có :SetTitle, :SetDesc, :Lock, :Unlock và :Destroy; hãy kiểm tra từng thành phần trước khi dùng.\n"}},{"id":"feedback","num":"05","group":{"en":"BUILD A HUB","vi":"TẠO HUB"},"title":{"en":"Notifications & dialogs","vi":"Thông báo và hộp thoại"},"html":{"en":"<h1>Notifications &amp; dialogs<\/h1>\n<p>Use <code>LIB:Notify<\/code> for feedback or <code>Window:Dialog<\/code> when a choice is required.<\/p>\n<pre><code class=\"language-lua\">LIB:Notify({\n    Title = &quot;Saved&quot;, Content = &quot;Your settings are ready.&quot;,\n    Kind = &quot;success&quot;, Icon = &quot;circle-check&quot;, Duration = 4,\n})\n\nWindow:Dialog({\n    Title = &quot;Reset settings?&quot;, Content = &quot;This will delete the saved configuration.&quot;,\n    Icon = &quot;triangle-alert&quot;,\n    Buttons = {\n        { Title = &quot;Cancel&quot; },\n        { Title = &quot;Reset&quot;, Callback = function() Window:DeleteConfig() end },\n    },\n})\n<\/code><\/pre>\n<p><code>Kind<\/code> supports <code>info<\/code>, <code>success<\/code>, <code>warn<\/code> and <code>error<\/code> for island notifications. <code>Native = true<\/code> requests the regular notification instead of routing to an enabled island. A native notification can be closed with the returned object's <code>:Close()<\/code>.<\/p>\n","vi":"<h1>Thông báo và hộp thoại<\/h1>\n<p>Dùng <code>LIB:Notify<\/code> để báo trạng thái, hoặc <code>Window:Dialog<\/code> khi cần người dùng lựa chọn.<\/p>\n<pre><code class=\"language-lua\">LIB:Notify({\n    Title = &quot;Đã lưu&quot;, Content = &quot;Cài đặt của bạn đã sẵn sàng.&quot;,\n    Kind = &quot;success&quot;, Icon = &quot;circle-check&quot;, Duration = 4,\n})\n\nWindow:Dialog({\n    Title = &quot;Đặt lại cài đặt?&quot;, Content = &quot;Cấu hình đã lưu sẽ bị xóa.&quot;,\n    Icon = &quot;triangle-alert&quot;,\n    Buttons = {\n        { Title = &quot;Hủy&quot; },\n        { Title = &quot;Đặt lại&quot;, Callback = function() Window:DeleteConfig() end },\n    },\n})\n<\/code><\/pre>\n<p><code>Kind<\/code> hỗ trợ <code>info<\/code>, <code>success<\/code>, <code>warn<\/code>, <code>error<\/code> cho thông báo trên island. <code>Native = true<\/code> yêu cầu thông báo thường thay vì chuyển sang island đang bật. Thông báo native có thể đóng bằng <code>:Close()<\/code> trên object trả về.<\/p>\n"},"plain":{"en":" Notifications & dialogs\n\nUse LIB:Notify for feedback or Window:Dialog when a choice is required.\n\nlua\nLIB:Notify({\n    Title = \"Saved\", Content = \"Your settings are ready.\",\n    Kind = \"success\", Icon = \"circle-check\", Duration = 4,\n})\n\nWindow:Dialog({\n    Title = \"Reset settings?\", Content = \"This will delete the saved configuration.\",\n    Icon = \"triangle-alert\",\n    Buttons = {\n        { Title = \"Cancel\" },\n        { Title = \"Reset\", Callback = function() Window:DeleteConfig() end },\n    },\n})\n\n\nKind supports info, success, warn and error for island notifications. Native = true requests the regular notification instead of routing to an enabled island. A native notification can be closed with the returned object's :Close().\n","vi":" Thông báo và hộp thoại\n\nDùng LIB:Notify để báo trạng thái, hoặc Window:Dialog khi cần người dùng lựa chọn.\n\nlua\nLIB:Notify({\n    Title = \"Đã lưu\", Content = \"Cài đặt của bạn đã sẵn sàng.\",\n    Kind = \"success\", Icon = \"circle-check\", Duration = 4,\n})\n\nWindow:Dialog({\n    Title = \"Đặt lại cài đặt?\", Content = \"Cấu hình đã lưu sẽ bị xóa.\",\n    Icon = \"triangle-alert\",\n    Buttons = {\n        { Title = \"Hủy\" },\n        { Title = \"Đặt lại\", Callback = function() Window:DeleteConfig() end },\n    },\n})\n\n\nKind hỗ trợ info, success, warn, error cho thông báo trên island. Native = true yêu cầu thông báo thường thay vì chuyển sang island đang bật. Thông báo native có thể đóng bằng :Close() trên object trả về.\n"}},{"id":"key-overview","num":"06","group":{"en":"KEY SYSTEM","vi":"KEY SYSTEM"},"title":{"en":"How it works","vi":"Cách hoạt động"},"html":{"en":"<h1>Key system<\/h1>\n<p>The updated build embeds the Ophyn interface and adapters. Enable the gate via <code>KeySystem<\/code> in <code>LIB:CreateWindow<\/code>, or use <code>getgenv().xNgotLoaderConfig.keySystem<\/code> for the bundled demo. Its colors, font, rounded corners and window icon follow saved xNgot UI settings by default.<\/p>\n<h2>Supported modes<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Mode<\/th>\n  <th>Configuration<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Local<\/td>\n  <td><code>Key = &quot;...&quot;<\/code> or <code>Keys = { &quot;...&quot;, &quot;...&quot; }<\/code><\/td>\n<\/tr>\n<tr>\n  <td>PandaAuth<\/td>\n  <td><code>API = { { Type = &quot;panda&quot;, ServiceId = &quot;...&quot; } }<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Jnkie<\/td>\n  <td><code>API = { { Type = &quot;jnkie&quot;, Service = &quot;...&quot;, Identifier = &quot;...&quot; } }<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Platoboost<\/td>\n  <td><code>API = { { Type = &quot;platoboost&quot;, ServiceId = 123, Secret = &quot;...&quot; } }<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Custom<\/td>\n  <td><code>Key = function(key) ... end<\/code> or an <code>API<\/code> entry with <code>Type = &quot;custom&quot;<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Keyless<\/td>\n  <td><code>Keyless = { enabled = true }<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>When multiple validators are configured, <strong>any one<\/strong> can accept the key. Avoid leaving a demo local key alongside a production provider unless a fallback is intentional. If no key/provider is configured, the gate does not silently accept an example key.<\/p>\n<h2>Key options<\/h2>\n<p><code>Enabled<\/code>, <code>Key<\/code> / <code>Keys<\/code>, <code>CaseSensitive<\/code>, <code>SaveKey<\/code>, <code>KeyFile<\/code>, <code>URL<\/code> / <code>GetKeyUrl<\/code>, <code>API<\/code>, <code>GetMethods<\/code>, <code>Keyless<\/code>, and <code>Ophyn<\/code> are supported. Saved keys are checked again before access. <code>Style = &quot;Legacy&quot;<\/code> selects the older xNgot gate; it only supports local keys.<\/p>\n<blockquote>\n<p>Provider adapters and the key UI are integrated, but live provider authentication has not been tested without account credentials. PandaAuth and Jnkie download and execute their respective SDKs at runtime.<\/p>\n<\/blockquote>\n","vi":"<h1>Key system<\/h1>\n<p>Bản cập nhật nhúng giao diện Ophyn và adapter xác thực. Bật bằng <code>KeySystem<\/code> trong <code>LIB:CreateWindow<\/code>, hoặc dùng <code>getgenv().xNgotLoaderConfig.keySystem<\/code> cho demo. Màu, font, góc bo và icon mặc định lấy theo cài đặt UI xNgot đã lưu.<\/p>\n<h2>Các chế độ<\/h2>\n<table>\n<thead>\n<tr>\n  <th>Chế độ<\/th>\n  <th>Cấu hình<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Local<\/td>\n  <td><code>Key = &quot;...&quot;<\/code> hoặc <code>Keys = { &quot;...&quot;, &quot;...&quot; }<\/code><\/td>\n<\/tr>\n<tr>\n  <td>PandaAuth<\/td>\n  <td><code>API = { { Type = &quot;panda&quot;, ServiceId = &quot;...&quot; } }<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Jnkie<\/td>\n  <td><code>API = { { Type = &quot;jnkie&quot;, Service = &quot;...&quot;, Identifier = &quot;...&quot; } }<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Platoboost<\/td>\n  <td><code>API = { { Type = &quot;platoboost&quot;, ServiceId = 123, Secret = &quot;...&quot; } }<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Custom<\/td>\n  <td><code>Key = function(key) ... end<\/code> hoặc <code>API<\/code> với <code>Type = &quot;custom&quot;<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Keyless<\/td>\n  <td><code>Keyless = { enabled = true }<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Khi cấu hình nhiều validator, key chỉ cần hợp lệ với <strong>một trong số đó<\/strong>. Đừng để key local demo cùng provider production nếu bạn không chủ đích tạo đường vào dự phòng. Nếu không cấu hình key/provider, hệ thống không tự chấp nhận key mẫu.<\/p>\n<h2>Tùy chọn chính<\/h2>\n<p>Hỗ trợ <code>Enabled<\/code>, <code>Key<\/code> / <code>Keys<\/code>, <code>CaseSensitive<\/code>, <code>SaveKey<\/code>, <code>KeyFile<\/code>, <code>URL<\/code> / <code>GetKeyUrl<\/code>, <code>API<\/code>, <code>GetMethods<\/code>, <code>Keyless<\/code> và <code>Ophyn<\/code>. Key đã lưu vẫn được kiểm tra lại trước khi vào. <code>Style = &quot;Legacy&quot;<\/code> chọn giao diện key xNgot cũ, chỉ hỗ trợ local key.<\/p>\n<blockquote>\n<p>Adapter và UI đã tích hợp, nhưng xác thực thật với provider chưa được kiểm tra do chưa có thông tin tài khoản. PandaAuth và Jnkie tải rồi chạy SDK tương ứng trong lúc sử dụng.<\/p>\n<\/blockquote>\n"},"plain":{"en":" Key system\n\nThe updated build embeds the Ophyn interface and adapters. Enable the gate via KeySystem in LIB:CreateWindow, or use getgenv().xNgotLoaderConfig.keySystem for the bundled demo. Its colors, font, rounded corners and window icon follow saved xNgot UI settings by default.\n\n Supported modes\n\n| Mode | Configuration |\n| --- | --- |\n| Local | Key = \"...\" or Keys = { \"...\", \"...\" } |\n| PandaAuth | API = { { Type = \"panda\", ServiceId = \"...\" } } |\n| Jnkie | API = { { Type = \"jnkie\", Service = \"...\", Identifier = \"...\" } } |\n| Platoboost | API = { { Type = \"platoboost\", ServiceId = 123, Secret = \"...\" } } |\n| Custom | Key = function(key) ... end or an API entry with Type = \"custom\" |\n| Keyless | Keyless = { enabled = true } |\n\nWhen multiple validators are configured, any one can accept the key. Avoid leaving a demo local key alongside a production provider unless a fallback is intentional. If no key/provider is configured, the gate does not silently accept an example key.\n\n Key options\n\nEnabled, Key / Keys, CaseSensitive, SaveKey, KeyFile, URL / GetKeyUrl, API, GetMethods, Keyless, and Ophyn are supported. Saved keys are checked again before access. Style = \"Legacy\" selects the older xNgot gate; it only supports local keys.\n\n> Provider adapters and the key UI are integrated, but live provider authentication has not been tested without account credentials. PandaAuth and Jnkie download and execute their respective SDKs at runtime.\n","vi":" Key system\n\nBản cập nhật nhúng giao diện Ophyn và adapter xác thực. Bật bằng KeySystem trong LIB:CreateWindow, hoặc dùng getgenv().xNgotLoaderConfig.keySystem cho demo. Màu, font, góc bo và icon mặc định lấy theo cài đặt UI xNgot đã lưu.\n\n Các chế độ\n\n| Chế độ | Cấu hình |\n| --- | --- |\n| Local | Key = \"...\" hoặc Keys = { \"...\", \"...\" } |\n| PandaAuth | API = { { Type = \"panda\", ServiceId = \"...\" } } |\n| Jnkie | API = { { Type = \"jnkie\", Service = \"...\", Identifier = \"...\" } } |\n| Platoboost | API = { { Type = \"platoboost\", ServiceId = 123, Secret = \"...\" } } |\n| Custom | Key = function(key) ... end hoặc API với Type = \"custom\" |\n| Keyless | Keyless = { enabled = true } |\n\nKhi cấu hình nhiều validator, key chỉ cần hợp lệ với một trong số đó. Đừng để key local demo cùng provider production nếu bạn không chủ đích tạo đường vào dự phòng. Nếu không cấu hình key/provider, hệ thống không tự chấp nhận key mẫu.\n\n Tùy chọn chính\n\nHỗ trợ Enabled, Key / Keys, CaseSensitive, SaveKey, KeyFile, URL / GetKeyUrl, API, GetMethods, Keyless và Ophyn. Key đã lưu vẫn được kiểm tra lại trước khi vào. Style = \"Legacy\" chọn giao diện key xNgot cũ, chỉ hỗ trợ local key.\n\n> Adapter và UI đã tích hợp, nhưng xác thực thật với provider chưa được kiểm tra do chưa có thông tin tài khoản. PandaAuth và Jnkie tải rồi chạy SDK tương ứng trong lúc sử dụng.\n"}},{"id":"key-local","num":"07","group":{"en":"KEY SYSTEM","vi":"KEY SYSTEM"},"title":{"en":"Local keys & keyless","vi":"Key local và keyless"},"html":{"en":"<h1>Local keys &amp; keyless<\/h1>\n<h2>Basic local key<\/h2>\n<pre><code class=\"language-lua\">local Window = LIB:CreateWindow({\n    Title = &quot;My Hub&quot;, Icon = &quot;sparkles&quot;,\n    KeySystem = {\n        Enabled = true,\n        Keys = { &quot;DEMO-KEY&quot;, &quot;VIP-KEY&quot; },\n        CaseSensitive = false,\n        SaveKey = true,\n        KeyFile = &quot;xNgotLibrary/Keys/key.txt&quot;,\n        GetKeyUrl = &quot;https://example.com/get-key&quot;,\n    },\n})\n<\/code><\/pre>\n<p>Local keys default to case-insensitive matching. Provider keys are passed to the provider unchanged. <code>SaveKey = false<\/code> is useful for testing the screen each time.<\/p>\n<pre><code class=\"language-lua\">print(Window.KeyUnlocked)\nWindow:ForgetSavedKey()\n<\/code><\/pre>\n<p>For the bundled demo, the default key is <code>XNGOT-2026<\/code>. A previously saved key may automatically be checked; configure <code>SaveKey = false<\/code> to test manual entry.<\/p>\n<h2>Keyless mode<\/h2>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true,\n    Keyless = { enabled = true, showcard = true, autoconfirm = false },\n}\n<\/code><\/pre>\n<p><code>autoconfirm = true<\/code> continues automatically. Keyless intentionally skips validation; it does not provide access control.<\/p>\n","vi":"<h1>Key local và keyless<\/h1>\n<h2>Key local cơ bản<\/h2>\n<pre><code class=\"language-lua\">local Window = LIB:CreateWindow({\n    Title = &quot;My Hub&quot;, Icon = &quot;sparkles&quot;,\n    KeySystem = {\n        Enabled = true,\n        Keys = { &quot;DEMO-KEY&quot;, &quot;VIP-KEY&quot; },\n        CaseSensitive = false,\n        SaveKey = true,\n        KeyFile = &quot;xNgotLibrary/Keys/key.txt&quot;,\n        GetKeyUrl = &quot;https://example.com/get-key&quot;,\n    },\n})\n<\/code><\/pre>\n<p>Key local mặc định không phân biệt hoa/thường. Key gửi đến provider được giữ nguyên. Dùng <code>SaveKey = false<\/code> khi muốn test màn hình nhập key mỗi lần.<\/p>\n<pre><code class=\"language-lua\">print(Window.KeyUnlocked)\nWindow:ForgetSavedKey()\n<\/code><\/pre>\n<p>Demo đi kèm mặc định dùng key <code>XNGOT-2026<\/code>. Key đã lưu có thể được kiểm tra tự động; dùng <code>SaveKey = false<\/code> để test nhập tay.<\/p>\n<h2>Chế độ keyless<\/h2>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true,\n    Keyless = { enabled = true, showcard = true, autoconfirm = false },\n}\n<\/code><\/pre>\n<p><code>autoconfirm = true<\/code> cho tự tiếp tục. Keyless chủ động bỏ xác thực, không phải chế độ kiểm soát truy cập.<\/p>\n"},"plain":{"en":" Local keys & keyless\n\n Basic local key\n\nlua\nlocal Window = LIB:CreateWindow({\n    Title = \"My Hub\", Icon = \"sparkles\",\n    KeySystem = {\n        Enabled = true,\n        Keys = { \"DEMO-KEY\", \"VIP-KEY\" },\n        CaseSensitive = false,\n        SaveKey = true,\n        KeyFile = \"xNgotLibrary/Keys/key.txt\",\n        GetKeyUrl = \"https://example.com/get-key\",\n    },\n})\n\n\nLocal keys default to case-insensitive matching. Provider keys are passed to the provider unchanged. SaveKey = false is useful for testing the screen each time.\n\nlua\nprint(Window.KeyUnlocked)\nWindow:ForgetSavedKey()\n\n\nFor the bundled demo, the default key is XNGOT-2026. A previously saved key may automatically be checked; configure SaveKey = false to test manual entry.\n\n Keyless mode\n\nlua\nKeySystem = {\n    Enabled = true,\n    Keyless = { enabled = true, showcard = true, autoconfirm = false },\n}\n\n\nautoconfirm = true continues automatically. Keyless intentionally skips validation; it does not provide access control.\n","vi":" Key local và keyless\n\n Key local cơ bản\n\nlua\nlocal Window = LIB:CreateWindow({\n    Title = \"My Hub\", Icon = \"sparkles\",\n    KeySystem = {\n        Enabled = true,\n        Keys = { \"DEMO-KEY\", \"VIP-KEY\" },\n        CaseSensitive = false,\n        SaveKey = true,\n        KeyFile = \"xNgotLibrary/Keys/key.txt\",\n        GetKeyUrl = \"https://example.com/get-key\",\n    },\n})\n\n\nKey local mặc định không phân biệt hoa/thường. Key gửi đến provider được giữ nguyên. Dùng SaveKey = false khi muốn test màn hình nhập key mỗi lần.\n\nlua\nprint(Window.KeyUnlocked)\nWindow:ForgetSavedKey()\n\n\nDemo đi kèm mặc định dùng key XNGOT-2026. Key đã lưu có thể được kiểm tra tự động; dùng SaveKey = false để test nhập tay.\n\n Chế độ keyless\n\nlua\nKeySystem = {\n    Enabled = true,\n    Keyless = { enabled = true, showcard = true, autoconfirm = false },\n}\n\n\nautoconfirm = true cho tự tiếp tục. Keyless chủ động bỏ xác thực, không phải chế độ kiểm soát truy cập.\n"}},{"id":"providers","num":"08","group":{"en":"KEY SYSTEM","vi":"KEY SYSTEM"},"title":{"en":"Provider setup","vi":"Cấu hình provider"},"html":{"en":"<h1>Provider setup<\/h1>\n<p>These are <code>KeySystem<\/code> tables. Replace sample values with the exact values from your provider dashboard. Do not add demo local keys unless you want them accepted too.<\/p>\n<h2>PandaAuth<\/h2>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = &quot;panda&quot;, ServiceId = &quot;YOUR_SERVICE_ID&quot; } },\n}\n<\/code><\/pre>\n<h2>Jnkie<\/h2>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = &quot;jnkie&quot;, Service = &quot;SERVICE_NAME&quot;,\n              Identifier = &quot;USER_IDENTIFIER&quot;, Provider = &quot;Mixed&quot; } },\n}\n<\/code><\/pre>\n<h2>Platoboost<\/h2>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = &quot;platoboost&quot;, ServiceId = 12345, Secret = &quot;YOUR_SECRET&quot; } },\n}\n<\/code><\/pre>\n<blockquote>\n<p>A client script is not a safe place to store a secret. Provider reachability, SDK compatibility and request support depend on the executor and provider. Check both successful and rejected keys with a real test service before release.<\/p>\n<\/blockquote>\n","vi":"<h1>Cấu hình provider<\/h1>\n<p>Đây là các bảng <code>KeySystem<\/code>. Thay giá trị mẫu bằng thông tin chính xác trên dashboard của provider. Không thêm key demo local nếu bạn không muốn key đó cũng được chấp nhận.<\/p>\n<h2>PandaAuth<\/h2>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = &quot;panda&quot;, ServiceId = &quot;SERVICE_ID_CUA_BAN&quot; } },\n}\n<\/code><\/pre>\n<h2>Jnkie<\/h2>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = &quot;jnkie&quot;, Service = &quot;TEN_SERVICE&quot;,\n              Identifier = &quot;USER_IDENTIFIER&quot;, Provider = &quot;Mixed&quot; } },\n}\n<\/code><\/pre>\n<h2>Platoboost<\/h2>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = &quot;platoboost&quot;, ServiceId = 12345, Secret = &quot;SECRET_CUA_BAN&quot; } },\n}\n<\/code><\/pre>\n<blockquote>\n<p>Script phía client không phải nơi an toàn để giữ secret. Kết nối, SDK và request tùy thuộc provider và executor. Hãy test cả key hợp lệ lẫn key sai với dịch vụ thật trước khi phát hành.<\/p>\n<\/blockquote>\n"},"plain":{"en":" Provider setup\n\nThese are KeySystem tables. Replace sample values with the exact values from your provider dashboard. Do not add demo local keys unless you want them accepted too.\n\n PandaAuth\n\nlua\nKeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = \"panda\", ServiceId = \"YOUR_SERVICE_ID\" } },\n}\n\n\n Jnkie\n\nlua\nKeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = \"jnkie\", Service = \"SERVICE_NAME\",\n              Identifier = \"USER_IDENTIFIER\", Provider = \"Mixed\" } },\n}\n\n\n Platoboost\n\nlua\nKeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = \"platoboost\", ServiceId = 12345, Secret = \"YOUR_SECRET\" } },\n}\n\n\n> A client script is not a safe place to store a secret. Provider reachability, SDK compatibility and request support depend on the executor and provider. Check both successful and rejected keys with a real test service before release.\n","vi":" Cấu hình provider\n\nĐây là các bảng KeySystem. Thay giá trị mẫu bằng thông tin chính xác trên dashboard của provider. Không thêm key demo local nếu bạn không muốn key đó cũng được chấp nhận.\n\n PandaAuth\n\nlua\nKeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = \"panda\", ServiceId = \"SERVICE_ID_CUA_BAN\" } },\n}\n\n\n Jnkie\n\nlua\nKeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = \"jnkie\", Service = \"TEN_SERVICE\",\n              Identifier = \"USER_IDENTIFIER\", Provider = \"Mixed\" } },\n}\n\n\n Platoboost\n\nlua\nKeySystem = {\n    Enabled = true, SaveKey = true,\n    API = { { Type = \"platoboost\", ServiceId = 12345, Secret = \"SECRET_CUA_BAN\" } },\n}\n\n\n> Script phía client không phải nơi an toàn để giữ secret. Kết nối, SDK và request tùy thuộc provider và executor. Hãy test cả key hợp lệ lẫn key sai với dịch vụ thật trước khi phát hành.\n"}},{"id":"key-custom","num":"09","group":{"en":"KEY SYSTEM","vi":"KEY SYSTEM"},"title":{"en":"Custom & appearance","vi":"Custom và giao diện"},"html":{"en":"<h1>Custom &amp; appearance<\/h1>\n<p>A custom adapter receives the entered key and a context containing the entry's fields plus <code>ctx.Request<\/code> when available.<\/p>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true,\n    API = {{\n        Type = &quot;custom&quot;, ServiceId = &quot;my-service&quot;,\n        CheckKey = function(key, ctx)\n            if key == &quot;demo&quot; then return true end\n            return false, &quot;Invalid key&quot;\n        end,\n        GetKeyLink = function(ctx)\n            return &quot;https://example.com/get-key&quot;\n        end,\n    }},\n}\n<\/code><\/pre>\n<p>The example is intentionally local, not a secure server validator. A simpler <code>Key = function(key) return true_or_false, reason end<\/code> is also supported.<\/p>\n<h2>Customize the gate<\/h2>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true, Keys = { &quot;DEMO&quot; },\n    Ophyn = {\n        Title = &quot;My Hub&quot;, Description = &quot;Key System&quot;, Intro = true,\n        discord_link = &quot;discord.gg/example&quot;, Discord = true,\n        Informations = true,\n    },\n}\n<\/code><\/pre>\n<p><code>Ophyn<\/code> options are forwarded to the embedded interface. Set <code>SyncTheme = false<\/code> and choose <code>Theme<\/code> for a separate Ophyn palette; <code>SyncFont = false<\/code> uses its original font. Explicit <code>ChangeTheme = true<\/code> allows the user to switch away from the synchronized palette. A custom <code>Logo<\/code> overrides the window icon.<\/p>\n","vi":"<h1>Custom và giao diện<\/h1>\n<p>Adapter tùy chỉnh nhận key và context chứa các trường trong entry, cùng <code>ctx.Request<\/code> nếu executor hỗ trợ.<\/p>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true,\n    API = {{\n        Type = &quot;custom&quot;, ServiceId = &quot;my-service&quot;,\n        CheckKey = function(key, ctx)\n            if key == &quot;demo&quot; then return true end\n            return false, &quot;Key không hợp lệ&quot;\n        end,\n        GetKeyLink = function(ctx)\n            return &quot;https://example.com/get-key&quot;\n        end,\n    }},\n}\n<\/code><\/pre>\n<p>Ví dụ trên cố ý kiểm tra local, không phải xác thực server an toàn. Bạn cũng có thể dùng <code>Key = function(key) return true_or_false, reason end<\/code>.<\/p>\n<h2>Tùy chỉnh màn hình<\/h2>\n<pre><code class=\"language-lua\">KeySystem = {\n    Enabled = true, Keys = { &quot;DEMO&quot; },\n    Ophyn = {\n        Title = &quot;My Hub&quot;, Description = &quot;Key System&quot;, Intro = true,\n        discord_link = &quot;discord.gg/example&quot;, Discord = true,\n        Informations = true,\n    },\n}\n<\/code><\/pre>\n<p><code>Ophyn<\/code> chuyển các tùy chọn đến giao diện tích hợp. Đặt <code>SyncTheme = false<\/code> và chọn <code>Theme<\/code> để dùng bảng màu Ophyn riêng; <code>SyncFont = false<\/code> dùng font gốc của Ophyn. <code>ChangeTheme = true<\/code> chủ động cho phép đổi khỏi bảng màu đồng bộ. <code>Logo<\/code> tùy chỉnh thay cho icon cửa sổ.<\/p>\n"},"plain":{"en":" Custom & appearance\n\nA custom adapter receives the entered key and a context containing the entry's fields plus ctx.Request when available.\n\nlua\nKeySystem = {\n    Enabled = true,\n    API = {{\n        Type = \"custom\", ServiceId = \"my-service\",\n        CheckKey = function(key, ctx)\n            if key == \"demo\" then return true end\n            return false, \"Invalid key\"\n        end,\n        GetKeyLink = function(ctx)\n            return \"https://example.com/get-key\"\n        end,\n    }},\n}\n\n\nThe example is intentionally local, not a secure server validator. A simpler Key = function(key) return true_or_false, reason end is also supported.\n\n Customize the gate\n\nlua\nKeySystem = {\n    Enabled = true, Keys = { \"DEMO\" },\n    Ophyn = {\n        Title = \"My Hub\", Description = \"Key System\", Intro = true,\n        discord_link = \"discord.gg/example\", Discord = true,\n        Informations = true,\n    },\n}\n\n\nOphyn options are forwarded to the embedded interface. Set SyncTheme = false and choose Theme for a separate Ophyn palette; SyncFont = false uses its original font. Explicit ChangeTheme = true allows the user to switch away from the synchronized palette. A custom Logo overrides the window icon.\n","vi":" Custom và giao diện\n\nAdapter tùy chỉnh nhận key và context chứa các trường trong entry, cùng ctx.Request nếu executor hỗ trợ.\n\nlua\nKeySystem = {\n    Enabled = true,\n    API = {{\n        Type = \"custom\", ServiceId = \"my-service\",\n        CheckKey = function(key, ctx)\n            if key == \"demo\" then return true end\n            return false, \"Key không hợp lệ\"\n        end,\n        GetKeyLink = function(ctx)\n            return \"https://example.com/get-key\"\n        end,\n    }},\n}\n\n\nVí dụ trên cố ý kiểm tra local, không phải xác thực server an toàn. Bạn cũng có thể dùng Key = function(key) return true_or_false, reason end.\n\n Tùy chỉnh màn hình\n\nlua\nKeySystem = {\n    Enabled = true, Keys = { \"DEMO\" },\n    Ophyn = {\n        Title = \"My Hub\", Description = \"Key System\", Intro = true,\n        discord_link = \"discord.gg/example\", Discord = true,\n        Informations = true,\n    },\n}\n\n\nOphyn chuyển các tùy chọn đến giao diện tích hợp. Đặt SyncTheme = false và chọn Theme để dùng bảng màu Ophyn riêng; SyncFont = false dùng font gốc của Ophyn. ChangeTheme = true chủ động cho phép đổi khỏi bảng màu đồng bộ. Logo tùy chỉnh thay cho icon cửa sổ.\n"}},{"id":"island","num":"10","group":{"en":"EXPLORE","vi":"KHÁM PHÁ"},"title":{"en":"Dynamic Island","vi":"Dynamic Island"},"html":{"en":"<h1>Dynamic Island<\/h1>\n<p>The integrated island is available when <code>SettingsUI<\/code> is enabled. Guard against <code>nil<\/code> when it is disabled or could not initialize.<\/p>\n<pre><code class=\"language-lua\">local Island = Window:GetDynamicIsland()\nif Island then\n    Island:Notify(&quot;Welcome&quot;, &quot;Your hub is ready&quot;, &quot;success&quot;, 4)\n    Island:GameplayActivity(&quot;Working&quot;, &quot;Processing&quot;, 5, &quot;info&quot;)\n    Island:Expand(&quot;Music&quot;)\nend\n<\/code><\/pre>\n<h2>Timer and display<\/h2>\n<pre><code class=\"language-lua\">if Island then\n    Island:Timer(300)\n    Island:ExtendTimer(60)\n    Island:StopTimer()\n    Island:WatchToggle()\n    Island:Set(&quot;Fps&quot;, true)\n    Island:Set(&quot;Ping&quot;, true)\n    Island:Enable(true)\nend\n<\/code><\/pre>\n<p>Other methods include <code>Collapse<\/code>, <code>WatchLap<\/code>, <code>WatchReset<\/code>, <code>Theme<\/code>, <code>Accent<\/code> and <code>State<\/code>. The Settings UI dashboard shows distinct FPS and ping histories, server actions and Job ID. The island remains hidden until the key screen and menu initialization finish.<\/p>\n<p>The current UI language implementation is English-only; <code>SetLanguage<\/code> does not currently switch the interface to Vietnamese.<\/p>\n","vi":"<h1>Dynamic Island<\/h1>\n<p>Bảng nổi tích hợp xuất hiện khi bật <code>SettingsUI<\/code>. Hãy kiểm tra <code>nil<\/code> khi Settings bị tắt hoặc island không khởi tạo được.<\/p>\n<pre><code class=\"language-lua\">local Island = Window:GetDynamicIsland()\nif Island then\n    Island:Notify(&quot;Xin chào&quot;, &quot;Hub đã sẵn sàng&quot;, &quot;success&quot;, 4)\n    Island:GameplayActivity(&quot;Đang chạy&quot;, &quot;Đang xử lý&quot;, 5, &quot;info&quot;)\n    Island:Expand(&quot;Music&quot;)\nend\n<\/code><\/pre>\n<h2>Hẹn giờ và hiển thị<\/h2>\n<pre><code class=\"language-lua\">if Island then\n    Island:Timer(300)\n    Island:ExtendTimer(60)\n    Island:StopTimer()\n    Island:WatchToggle()\n    Island:Set(&quot;Fps&quot;, true)\n    Island:Set(&quot;Ping&quot;, true)\n    Island:Enable(true)\nend\n<\/code><\/pre>\n<p>Các hàm khác gồm <code>Collapse<\/code>, <code>WatchLap<\/code>, <code>WatchReset<\/code>, <code>Theme<\/code>, <code>Accent<\/code> và <code>State<\/code>. Dashboard trong Settings hiển thị lịch sử FPS và ping khác màu, thao tác server và Job ID. Island chờ màn hình key và quá trình dựng menu hoàn tất mới hiện.<\/p>\n<p>Giao diện hiện tại chỉ có tiếng Anh; <code>SetLanguage<\/code> hiện không chuyển giao diện sang tiếng Việt.<\/p>\n"},"plain":{"en":" Dynamic Island\n\nThe integrated island is available when SettingsUI is enabled. Guard against nil when it is disabled or could not initialize.\n\nlua\nlocal Island = Window:GetDynamicIsland()\nif Island then\n    Island:Notify(\"Welcome\", \"Your hub is ready\", \"success\", 4)\n    Island:GameplayActivity(\"Working\", \"Processing\", 5, \"info\")\n    Island:Expand(\"Music\")\nend\n\n\n Timer and display\n\nlua\nif Island then\n    Island:Timer(300)\n    Island:ExtendTimer(60)\n    Island:StopTimer()\n    Island:WatchToggle()\n    Island:Set(\"Fps\", true)\n    Island:Set(\"Ping\", true)\n    Island:Enable(true)\nend\n\n\nOther methods include Collapse, WatchLap, WatchReset, Theme, Accent and State. The Settings UI dashboard shows distinct FPS and ping histories, server actions and Job ID. The island remains hidden until the key screen and menu initialization finish.\n\nThe current UI language implementation is English-only; SetLanguage does not currently switch the interface to Vietnamese.\n","vi":" Dynamic Island\n\nBảng nổi tích hợp xuất hiện khi bật SettingsUI. Hãy kiểm tra nil khi Settings bị tắt hoặc island không khởi tạo được.\n\nlua\nlocal Island = Window:GetDynamicIsland()\nif Island then\n    Island:Notify(\"Xin chào\", \"Hub đã sẵn sàng\", \"success\", 4)\n    Island:GameplayActivity(\"Đang chạy\", \"Đang xử lý\", 5, \"info\")\n    Island:Expand(\"Music\")\nend\n\n\n Hẹn giờ và hiển thị\n\nlua\nif Island then\n    Island:Timer(300)\n    Island:ExtendTimer(60)\n    Island:StopTimer()\n    Island:WatchToggle()\n    Island:Set(\"Fps\", true)\n    Island:Set(\"Ping\", true)\n    Island:Enable(true)\nend\n\n\nCác hàm khác gồm Collapse, WatchLap, WatchReset, Theme, Accent và State. Dashboard trong Settings hiển thị lịch sử FPS và ping khác màu, thao tác server và Job ID. Island chờ màn hình key và quá trình dựng menu hoàn tất mới hiện.\n\nGiao diện hiện tại chỉ có tiếng Anh; SetLanguage hiện không chuyển giao diện sang tiếng Việt.\n"}},{"id":"music","num":"11","group":{"en":"EXPLORE","vi":"KHÁM PHÁ"},"title":{"en":"Music & configuration","vi":"Nhạc và cấu hình"},"html":{"en":"<h1>Music &amp; configuration<\/h1>\n<p>The built-in music engine supports searching and managing downloaded tracks through the island. Availability depends on network access, supported executor APIs and the external services.<\/p>\n<pre><code class=\"language-lua\">local Island = Window:GetDynamicIsland()\nif Island then\n    Island:MusicSearch(&quot;lofi chill&quot;)\n    Island:Expand(&quot;Music&quot;)\n    Island:MusicVolume(65)\nend\n<\/code><\/pre>\n<p>Search runs asynchronously; after results appear, choose a track in the player or use <code>MusicSelectValue<\/code>. <code>PlayMusic()<\/code> toggles the current track and does not wait for search results.<\/p>\n<h2>Presets<\/h2>\n<pre><code class=\"language-lua\">_G.xNgotMusicConfig:Preset(&quot;lowdata&quot;)\n_G.xNgotMusicConfig:Set(&quot;topN&quot;, 8)\nprint(_G.xNgotMusicConfig:Get(&quot;topN&quot;))\n<\/code><\/pre>\n<p>Use <strong>Music region<\/strong> and <strong>Music platform<\/strong> in the island settings. Auto region uses Roblox country when available, then its locale; choose Global to disable regional preference. Vietnam, United States, Korea and Japan are supported. This adds regional search terms, so results are not a verified country/language filter. Platforms in the UI are YouTube, SoundCloud and Audius; search and downloads depend on external services.<\/p>\n<p>When <strong>Preload next track<\/strong> and Auto play are enabled, the player prepares the next item from the current list at 50%, including a best-effort audio preload. Shuffle chooses one next item; Repeat One takes priority. If there is only one item, preloading is skipped. If preparation is incomplete or fails, normal loading is used; gapless playback is not guaranteed. Downloads use network and local storage. Region detection does not use a third-party IP lookup.<\/p>\n<pre><code class=\"language-lua\">_G.xNgotMusicConfig:Set(&quot;region&quot;, &quot;VN&quot;) -- auto, global, VN, US, KR, JP\n_G.xNgotMusicConfig:Set(&quot;sources&quot;, {&quot;youtube&quot;}) -- or soundcloud, audius\n_G.xNgotMusicConfig:Set(&quot;prefetchNext&quot;, true)\n<\/code><\/pre>\n<p>Available presets: <code>fast<\/code>, <code>quality<\/code>, <code>lowdata<\/code>, <code>vietnamese<\/code>. Other island methods include <code>MusicCatalog<\/code>, <code>MusicRows<\/code>, <code>MusicSelect<\/code>, <code>MusicSelectValue<\/code>, <code>NextMusic<\/code>, <code>MusicSpeed<\/code>, <code>MusicFiles<\/code>, <code>MusicPlayFile<\/code>, <code>MusicDeleteFile<\/code> and <code>MusicClearDownloaded<\/code>.<\/p>\n<h2>Diagnose support<\/h2>\n<pre><code class=\"language-lua\">local report = _G.xNgotMusicDoctor()\nfor _, check in ipairs(report.checks) do\n    print(check.status, check.name, check.detail)\nend\n<\/code><\/pre>\n<p>The doctor is a diagnostic hint, not proof that a feature works: executor globals and network behavior vary. Check each reported item and test playback directly.<\/p>\n","vi":"<h1>Nhạc và cấu hình<\/h1>\n<p>Engine nhạc tích hợp hỗ trợ tìm kiếm và quản lý bài đã tải qua island. Khả năng sử dụng phụ thuộc kết nối, API executor và dịch vụ bên ngoài.<\/p>\n<pre><code class=\"language-lua\">local Island = Window:GetDynamicIsland()\nif Island then\n    Island:MusicSearch(&quot;lofi chill&quot;)\n    Island:Expand(&quot;Music&quot;)\n    Island:MusicVolume(65)\nend\n<\/code><\/pre>\n<p>Tìm kiếm chạy bất đồng bộ; khi có kết quả hãy chọn bài trong player hoặc dùng <code>MusicSelectValue<\/code>. <code>PlayMusic()<\/code> chỉ đảo trạng thái bài hiện tại, không chờ kết quả tìm.<\/p>\n<h2>Preset<\/h2>\n<pre><code class=\"language-lua\">_G.xNgotMusicConfig:Preset(&quot;lowdata&quot;)\n_G.xNgotMusicConfig:Set(&quot;topN&quot;, 8)\nprint(_G.xNgotMusicConfig:Get(&quot;topN&quot;))\n<\/code><\/pre>\n<p>Chọn <strong>Music region<\/strong> và <strong>Music platform<\/strong> trong cài đặt Island. Auto ưu tiên quốc gia do Roblox cung cấp, sau đó dùng locale; chọn Global để bỏ ưu tiên vùng. Có Việt Nam, Mỹ, Hàn Quốc và Nhật Bản. Đây là thêm từ khóa khu vực khi tìm, không phải bộ lọc xác minh ngôn ngữ hay quốc tịch. Giao diện hỗ trợ YouTube, SoundCloud, Audius; kết quả và tải nhạc phụ thuộc dịch vụ bên ngoài.<\/p>\n<p>Khi bật <strong>Preload next track<\/strong> và Auto play, lúc phát đến 50% trình phát chuẩn bị bài kế tiếp trong danh sách hiện tại và cố tải trước âm thanh. Shuffle chọn trước một bài; Repeat One được ưu tiên. Nếu chỉ có một bài thì bỏ qua tải trước. Nếu chưa tải xong hoặc tải lỗi, trình phát tiếp tục xử lý bình thường; không đảm bảo chuyển bài hoàn toàn không trễ. Tải trước dùng mạng và bộ nhớ. Tự nhận vùng không dùng dịch vụ tra IP bên thứ ba.<\/p>\n<pre><code class=\"language-lua\">_G.xNgotMusicConfig:Set(&quot;region&quot;, &quot;VN&quot;) -- auto, global, VN, US, KR, JP\n_G.xNgotMusicConfig:Set(&quot;sources&quot;, {&quot;youtube&quot;}) -- hoặc soundcloud, audius\n_G.xNgotMusicConfig:Set(&quot;prefetchNext&quot;, true)\n<\/code><\/pre>\n<p>Các preset: <code>fast<\/code>, <code>quality<\/code>, <code>lowdata<\/code>, <code>vietnamese<\/code>. Các hàm khác gồm <code>MusicCatalog<\/code>, <code>MusicRows<\/code>, <code>MusicSelect<\/code>, <code>MusicSelectValue<\/code>, <code>NextMusic<\/code>, <code>MusicSpeed<\/code>, <code>MusicFiles<\/code>, <code>MusicPlayFile<\/code>, <code>MusicDeleteFile<\/code> và <code>MusicClearDownloaded<\/code>.<\/p>\n<h2>Kiểm tra hỗ trợ<\/h2>\n<pre><code class=\"language-lua\">local report = _G.xNgotMusicDoctor()\nfor _, check in ipairs(report.checks) do\n    print(check.status, check.name, check.detail)\nend\n<\/code><\/pre>\n<p>Doctor chỉ là gợi ý chẩn đoán, không chứng minh tính năng hoạt động: global và mạng của mỗi executor có thể khác nhau. Hãy xem từng mục và test phát nhạc trực tiếp.<\/p>\n"},"plain":{"en":" Music & configuration\n\nThe built-in music engine supports searching and managing downloaded tracks through the island. Availability depends on network access, supported executor APIs and the external services.\n\nlua\nlocal Island = Window:GetDynamicIsland()\nif Island then\n    Island:MusicSearch(\"lofi chill\")\n    Island:Expand(\"Music\")\n    Island:MusicVolume(65)\nend\n\n\nSearch runs asynchronously; after results appear, choose a track in the player or use MusicSelectValue. PlayMusic() toggles the current track and does not wait for search results.\n\n Presets\n\nlua\n_G.xNgotMusicConfig:Preset(\"lowdata\")\n_G.xNgotMusicConfig:Set(\"topN\", 8)\nprint(_G.xNgotMusicConfig:Get(\"topN\"))\n\n\nUse Music region and Music platform in the island settings. Auto region uses Roblox country when available, then its locale; choose Global to disable regional preference. Vietnam, United States, Korea and Japan are supported. This adds regional search terms, so results are not a verified country/language filter. Platforms in the UI are YouTube, SoundCloud and Audius; search and downloads depend on external services.\n\nWhen Preload next track and Auto play are enabled, the player prepares the next item from the current list at 50%, including a best-effort audio preload. Shuffle chooses one next item; Repeat One takes priority. If there is only one item, preloading is skipped. If preparation is incomplete or fails, normal loading is used; gapless playback is not guaranteed. Downloads use network and local storage. Region detection does not use a third-party IP lookup.\n\nlua\n_G.xNgotMusicConfig:Set(\"region\", \"VN\") -- auto, global, VN, US, KR, JP\n_G.xNgotMusicConfig:Set(\"sources\", {\"youtube\"}) -- or soundcloud, audius\n_G.xNgotMusicConfig:Set(\"prefetchNext\", true)\n\n\nAvailable presets: fast, quality, lowdata, vietnamese. Other island methods include MusicCatalog, MusicRows, MusicSelect, MusicSelectValue, NextMusic, MusicSpeed, MusicFiles, MusicPlayFile, MusicDeleteFile and MusicClearDownloaded.\n\n Diagnose support\n\nlua\nlocal report = _G.xNgotMusicDoctor()\nfor _, check in ipairs(report.checks) do\n    print(check.status, check.name, check.detail)\nend\n\n\nThe doctor is a diagnostic hint, not proof that a feature works: executor globals and network behavior vary. Check each reported item and test playback directly.\n","vi":" Nhạc và cấu hình\n\nEngine nhạc tích hợp hỗ trợ tìm kiếm và quản lý bài đã tải qua island. Khả năng sử dụng phụ thuộc kết nối, API executor và dịch vụ bên ngoài.\n\nlua\nlocal Island = Window:GetDynamicIsland()\nif Island then\n    Island:MusicSearch(\"lofi chill\")\n    Island:Expand(\"Music\")\n    Island:MusicVolume(65)\nend\n\n\nTìm kiếm chạy bất đồng bộ; khi có kết quả hãy chọn bài trong player hoặc dùng MusicSelectValue. PlayMusic() chỉ đảo trạng thái bài hiện tại, không chờ kết quả tìm.\n\n Preset\n\nlua\n_G.xNgotMusicConfig:Preset(\"lowdata\")\n_G.xNgotMusicConfig:Set(\"topN\", 8)\nprint(_G.xNgotMusicConfig:Get(\"topN\"))\n\n\nChọn Music region và Music platform trong cài đặt Island. Auto ưu tiên quốc gia do Roblox cung cấp, sau đó dùng locale; chọn Global để bỏ ưu tiên vùng. Có Việt Nam, Mỹ, Hàn Quốc và Nhật Bản. Đây là thêm từ khóa khu vực khi tìm, không phải bộ lọc xác minh ngôn ngữ hay quốc tịch. Giao diện hỗ trợ YouTube, SoundCloud, Audius; kết quả và tải nhạc phụ thuộc dịch vụ bên ngoài.\n\nKhi bật Preload next track và Auto play, lúc phát đến 50% trình phát chuẩn bị bài kế tiếp trong danh sách hiện tại và cố tải trước âm thanh. Shuffle chọn trước một bài; Repeat One được ưu tiên. Nếu chỉ có một bài thì bỏ qua tải trước. Nếu chưa tải xong hoặc tải lỗi, trình phát tiếp tục xử lý bình thường; không đảm bảo chuyển bài hoàn toàn không trễ. Tải trước dùng mạng và bộ nhớ. Tự nhận vùng không dùng dịch vụ tra IP bên thứ ba.\n\nlua\n_G.xNgotMusicConfig:Set(\"region\", \"VN\") -- auto, global, VN, US, KR, JP\n_G.xNgotMusicConfig:Set(\"sources\", {\"youtube\"}) -- hoặc soundcloud, audius\n_G.xNgotMusicConfig:Set(\"prefetchNext\", true)\n\n\nCác preset: fast, quality, lowdata, vietnamese. Các hàm khác gồm MusicCatalog, MusicRows, MusicSelect, MusicSelectValue, NextMusic, MusicSpeed, MusicFiles, MusicPlayFile, MusicDeleteFile và MusicClearDownloaded.\n\n Kiểm tra hỗ trợ\n\nlua\nlocal report = _G.xNgotMusicDoctor()\nfor _, check in ipairs(report.checks) do\n    print(check.status, check.name, check.detail)\nend\n\n\nDoctor chỉ là gợi ý chẩn đoán, không chứng minh tính năng hoạt động: global và mạng của mỗi executor có thể khác nhau. Hãy xem từng mục và test phát nhạc trực tiếp.\n"}},{"id":"appearance","num":"12","group":{"en":"EXPLORE","vi":"KHÁM PHÁ"},"title":{"en":"Appearance & storage","vi":"Giao diện và lưu trữ"},"html":{"en":"<h1>Appearance &amp; storage<\/h1>\n<p>Users can adjust appearance in Settings UI, or your script can control the theme and profiles.<\/p>\n<pre><code class=\"language-lua\">Window:SetUISettings({\n    AccentColor = Color3.fromRGB(10, 135, 213),\n    CornerRadius = 12,\n}, true)\nWindow:ApplyUIPreset(&quot;Midnight&quot;, true)\nWindow:SaveUIProfile(&quot;My theme&quot;)\n<\/code><\/pre>\n<p>Use <code>GetUISettings<\/code>, <code>GetUIPresets<\/code>, <code>UseOriginalUI<\/code>, <code>ExportUISettings<\/code>, <code>ImportUISettings<\/code>, <code>LoadUIProfile<\/code> and <code>DeleteUIProfile<\/code> to manage appearance. The gate reads saved xNgot theme settings when it starts; selecting an independent Ophyn theme can override that synchronization.<\/p>\n<h2>Configuration files<\/h2>\n<pre><code class=\"language-lua\">print(Window:GetConfigPath())\nWindow:SaveConfig()\n-- Window:DeleteConfig() -- deletes saved UI/component settings\n<\/code><\/pre>\n<p>The configuration is grouped by tab and component titles. Changing a title changes the associated key. Saving depends on executor file APIs; the key file is separate from the window configuration.<\/p>\n","vi":"<h1>Giao diện và lưu trữ<\/h1>\n<p>Người dùng có thể đổi giao diện trong Settings UI, hoặc script điều khiển theme và profile.<\/p>\n<pre><code class=\"language-lua\">Window:SetUISettings({\n    AccentColor = Color3.fromRGB(10, 135, 213),\n    CornerRadius = 12,\n}, true)\nWindow:ApplyUIPreset(&quot;Midnight&quot;, true)\nWindow:SaveUIProfile(&quot;My theme&quot;)\n<\/code><\/pre>\n<p>Dùng <code>GetUISettings<\/code>, <code>GetUIPresets<\/code>, <code>UseOriginalUI<\/code>, <code>ExportUISettings<\/code>, <code>ImportUISettings<\/code>, <code>LoadUIProfile<\/code> và <code>DeleteUIProfile<\/code> để quản lý giao diện. Màn hình key đọc theme xNgot đã lưu khi khởi động; theme Ophyn riêng có thể ghi đè chế độ đồng bộ.<\/p>\n<h2>File cấu hình<\/h2>\n<pre><code class=\"language-lua\">print(Window:GetConfigPath())\nWindow:SaveConfig()\n-- Window:DeleteConfig() -- xóa cấu hình UI/thành phần đã lưu\n<\/code><\/pre>\n<p>Cấu hình được nhóm theo <code>Title<\/code> của tab và thành phần. Đổi tên sẽ đổi khóa lưu tương ứng. Việc lưu phụ thuộc API file của executor; file key là file riêng với cấu hình cửa sổ.<\/p>\n"},"plain":{"en":" Appearance & storage\n\nUsers can adjust appearance in Settings UI, or your script can control the theme and profiles.\n\nlua\nWindow:SetUISettings({\n    AccentColor = Color3.fromRGB(10, 135, 213),\n    CornerRadius = 12,\n}, true)\nWindow:ApplyUIPreset(\"Midnight\", true)\nWindow:SaveUIProfile(\"My theme\")\n\n\nUse GetUISettings, GetUIPresets, UseOriginalUI, ExportUISettings, ImportUISettings, LoadUIProfile and DeleteUIProfile to manage appearance. The gate reads saved xNgot theme settings when it starts; selecting an independent Ophyn theme can override that synchronization.\n\n Configuration files\n\nlua\nprint(Window:GetConfigPath())\nWindow:SaveConfig()\n-- Window:DeleteConfig() -- deletes saved UI/component settings\n\n\nThe configuration is grouped by tab and component titles. Changing a title changes the associated key. Saving depends on executor file APIs; the key file is separate from the window configuration.\n","vi":" Giao diện và lưu trữ\n\nNgười dùng có thể đổi giao diện trong Settings UI, hoặc script điều khiển theme và profile.\n\nlua\nWindow:SetUISettings({\n    AccentColor = Color3.fromRGB(10, 135, 213),\n    CornerRadius = 12,\n}, true)\nWindow:ApplyUIPreset(\"Midnight\", true)\nWindow:SaveUIProfile(\"My theme\")\n\n\nDùng GetUISettings, GetUIPresets, UseOriginalUI, ExportUISettings, ImportUISettings, LoadUIProfile và DeleteUIProfile để quản lý giao diện. Màn hình key đọc theme xNgot đã lưu khi khởi động; theme Ophyn riêng có thể ghi đè chế độ đồng bộ.\n\n File cấu hình\n\nlua\nprint(Window:GetConfigPath())\nWindow:SaveConfig()\n-- Window:DeleteConfig() -- xóa cấu hình UI/thành phần đã lưu\n\n\nCấu hình được nhóm theo Title của tab và thành phần. Đổi tên sẽ đổi khóa lưu tương ứng. Việc lưu phụ thuộc API file của executor; file key là file riêng với cấu hình cửa sổ.\n"}},{"id":"troubleshoot","num":"13","group":{"en":"REFERENCE","vi":"THAM KHẢO"},"title":{"en":"Troubleshooting","vi":"Xử lý sự cố"},"html":{"en":"<h1>Troubleshooting<\/h1>\n<h2><code>failed to read file<\/code><\/h2>\n<p>Check the file is in the executor's <strong>workspace<\/strong>, not only the device Downloads folder. The name in <code>readfile(&quot;main.lua&quot;)<\/code> must match exactly, including the extension.<\/p>\n<h2><code>Out of local registers ... limit 200<\/code><\/h2>\n<p>This is a compile-time error, so in-script debug UI cannot run. Use the updated build, which was checked with an older 200-register Luau compiler. If it persists, capture the exact error and file name.<\/p>\n<h2>The menu or key screen does not appear<\/h2>\n<ul>\n<li>Check <code>xNgotLibraryOnly<\/code>: when <code>true<\/code>, load the library and call <code>LIB:CreateWindow(...)<\/code> yourself.<\/li>\n<li>A saved key may auto-validate. Set <code>SaveKey = false<\/code> to test manual entry.<\/li>\n<li>The key screen may wait for assets; the integrated build includes a preload timeout.<\/li>\n<li>If the user closes the gate before validation, the wi

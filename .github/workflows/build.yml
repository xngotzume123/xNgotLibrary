name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kiểm tra module
        run: python3 src/build.py --check

      - name: Build dev + release (có minify)
        run: |
          python3 src/build.py --minify full
          python3 src/build.py --release --minify full
          ls -l dist

      - name: Thống kê
        run: python3 src/build.py --stats

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
